name: "Compound commands: for"
cases:
  - name: "Single-line for loop"
    stdin: |
      for f in 1 2 3; do echo $f; done

  - name: "Multi-line for loop"
    stdin: |
      for f in 1 2 3; do
        echo $f
      done

  - name: "Empty for loop"
    stdin: |
      for f in; do echo $f; done

  - name: "for loop without in"
    stdin: |
      set -- a b c

      echo "Loop 1"
      for f; do echo $f; done

      echo "Loop 2: no semicolon"
      for f do echo $f; done

  - name: "for loop without in but spaces"
    stdin: |
      set -- a "b c" d

      echo "Loop 1"
      for f; do echo $f; done

      echo "Loop 2: no semicolon"
      for f do echo $f; done

  - name: "Break in for loop"
    stdin: |
      for f in 1 2 3; do
        echo $f
        break
      done

  - name: "Break in nested for loop"
    stdin: |
      for f in 1 2 3; do
        for g in a b c; do
          echo "f=$f g=$g"
          true && break
        done
        echo "Left inner loop"
      done

  - name: "Break 1 in nested for loops"
    stdin: |
      for f in 1 2 3; do
        for g in a b c; do
          echo "f=$f g=$g"
          break 1
        done
      done

  - name: "Break 2 in nested for loops"
    stdin: |
      for f in 1 2 3; do
        for g in a b c; do
          echo "f=$f g=$g"
          break 2
        done
      done

  - name: "Break out of nested for/while loops"
    stdin: |
      for f in 1 2 3; do
        while true; do
          echo "f=$f"
          break 2
        done
      done

  - name: "Continue in for loop"
    stdin: |
      for f in 1 2 3; do
        echo $f
        continue
        echo $f
      done

  - name: "Continue with bad N"
    known_failure: true # Fails differently
    stdin: |
      for f in 1 2 3; do
        echo $f
        continue 0
        echo result: $?
      done

  - name: "Continue in nested for loop"
    stdin: |
      for f in a b c; do
        for g in 1 2 3; do
          echo "f=$f g=$g"
          continue
          echo "Should not print"
        done
        echo "Left inner loop"
      done

  - name: "Continue in nested for loop with explicit N=1"
    stdin: |
      for f in a b c; do
        for g in 1 2 3; do
          echo "f=$f g=$g"
          continue 1
          echo "Should not print"
        done
        echo "Left inner loop"
      done

  - name: "Continue in nested for loop with explicit N=2"
    stdin: |
      for f in a b c; do
        for g in 1 2 3; do
          echo "f=$f g=$g"
          continue 2
          echo "Should not print"
        done
        echo "Left inner loop"
      done

  - name: "Continue in nested for loop with too large N"
    stdin: |
      for f in a b c; do
        for g in 1 2 3; do
          echo "f=$f g=$g"
          continue 3
          echo "Should not print"
        done
        echo "Left inner loop"
      done

  - name: "Multi-line for loop"
    test_files:
      - path: "script.sh"
        contents: |
          for f in 1 2 3; do
            echo $f
          done
    args: ["./script.sh"]

  - name: "For loop piped"
    stdin: |
      for f in ab ac bd ef; do echo $f; done | grep b

  - name: "For loop output redirection"
    stdin: |
      for f in a b c; do echo $f; done > ./out.txt

  - name: "For reserved word handling"
    stdin: |
      for for in for; do echo $for; done

  - name: "For with return in body"
    stdin: |
      f() {
        for i in 1 2 3; do
          echo "Iteration $i"
          if [ "$i" = "2" ]; then
            return 42
          fi
        done
        echo "After for"
      }
      f
      echo "Exit code: $?"

  - name: "For with exit in body"
    stdin: |
      for i in 1 2 3; do
        echo "Iteration $i"
        if [ "$i" = "2" ]; then
          exit 42
        fi
      done
      echo "After for"

  - name: "For loop with nameref variable"
    stdin: |
      target=""
      declare -n ref=target
      for ref in a b c; do
          echo "loop: target=$target"
      done
      echo "final: target=$target"

  - name: "continue with a non-numeric argument aborts the script"
    known_failure: true # TODO(builtins): a usage error skips continue, so the loop body keeps running
    ignore_stderr: true
    stdin: |
      for i in 1 2; do continue abc; echo "body $i"; done
      echo "after loop: $?"

  - name: "break with a count of zero"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do break 0; echo "body $i"; done
      echo "after loop: $?"

  - name: "break and continue with a count of zero leave every loop"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do for j in a b; do break 0; done; echo "outer $i"; done
      echo "after break: $?"
      for i in 1 2; do for j in a b; do continue 0; done; echo "outer $i"; done
      echo "after continue: $?"

  - name: "break and continue with a negative count leave every loop"
    known_failure: true # TODO(loops): a negative count is taken for an option and rejected
    ignore_stderr: true
    stdin: |
      for i in 1 2; do for j in a b; do break -1; done; echo "outer $i"; done
      echo "after break: $?"
      for i in 1 2; do for j in a b; do continue -1; done; echo "outer $i"; done
      echo "after continue: $?"

  - name: "break and continue outside a loop"
    ignore_stderr: true
    stdin: |
      break; echo "after break: $?"
      continue; echo "after continue: $?"

  - name: "break and continue check for a loop before their options"
    known_failure: true # TODO(loops): the loop check doesn't come before option parsing
    ignore_stderr: true
    stdin: |
      f() { break -Z; echo "after break -Z: $?"; continue -Z; echo "after continue -Z: $?"; }
      f

  - name: "break and continue act only on the loops of the current function"
    ignore_stderr: true
    stdin: |
      f() { break; echo "f went on: $?"; }
      for i in 1 2; do f; echo "loop body $i"; done
      g() { for j in a; do break 2; done; echo "g went on"; }
      for i in 1 2; do g; echo "loop body $i"; done
      for i in 1; do ( break; echo "subshell went on" ); echo "after subshell: $?"; done

  - name: "break and continue in a substitution act on the enclosing loops"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do x=$(break; echo "not captured"); echo "captured [$x]"; done
      for i in 1; do x=$(for j in 1; do break 2; done; echo "not captured"); echo "[$x]"; done
      for i in 1; do cat <(break; echo "not read"); echo "after process substitution"; done

  - name: "break and continue past the outermost loop"
    stdin: |
      for i in 1 2; do for j in a b; do break 5; done; echo "not reached"; done
      echo "after break: $?"
      for i in 1 2; do for j in a b; do echo "$i$j"; continue 9; done; done
      echo "after continue: $?"

  - name: "break and continue read their operand as bash does"
    known_failure: true # TODO(loops): break and continue don't read their operand as bash does
    ignore_stderr: true
    stdin: |
      for i in 1 2; do break -- 1; echo "not reached"; done
      echo "after --: $?"
      for i in 1 2; do break " 1 "; echo "not reached"; done
      echo "after blanks: $?"
      for i in 1; do break --help >/dev/null; echo "help: $?"; done

  - name: "break and continue clamp their count to the loop depth"
    stdin: |
      for i in 1 2; do
        for j in 1 2; do break 99; echo "inner $i$j"; done
        echo "outer $i"
      done
      echo "after: $?"
      f() { for k in 1 2; do continue 99; echo "in f $k"; done; echo "f end"; }
      for i in 1 2; do f; echo "loop $i"; done

  - name: "break outside a loop reports it, except in POSIX mode"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { break; echo "break: $?"; } 2>&1 | strip
      { continue; echo "continue: $?"; } 2>&1 | strip
      set -o posix
      break; echo "POSIX break: $?"
      continue; echo "POSIX continue: $?"

  - name: "A compound command in a subshell of its own starts outside any loop"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do { break; echo "first stage went on"; } | cat; echo "body $i"; done
      for i in 1 2; do : | if true; then break; echo "last stage went on"; fi; echo "body $i"; done
      for i in 1 2; do { break; echo "async group went on"; } & wait $!; echo "body $i"; done
      for i in 1 2; do true && break & wait $!; echo "async list $i"; done
      for i in 1 2; do : | for j in 1; do break 2; done; echo "stage loop $i"; done

  - name: "A simple command in a subshell keeps the enclosing loops"
    stdin: |
      for i in 1 2; do : | break; echo "last stage $i"; done
      for i in 1 2; do break | :; echo "first stage $i"; done
      for i in 1 2; do break & wait $!; echo "async $i"; done
      for i in 1 2; do x=$({ break; echo "not captured"; }); echo "substitution $i [$x]"; done
      shopt -s lastpipe
      for i in 1 2; do : | { break; echo "not reached"; }; echo "not reached $i"; done
      echo "lastpipe: $?"

  - name: "eval and a sourced script share the loops they're run in"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do eval 'break'; echo "not reached $i"; done
      for i in 1 2; do eval 'break 2'; echo "not reached $i"; done
      echo "eval: $?"
      printf 'break\necho "not reached in file"\n' > in_loop.sh
      for i in 1 2; do . ./in_loop.sh; echo "not reached $i"; done
      echo "sourced: $?"
      printf 'break\necho "in file: $?"\n' > no_loop.sh
      . ./no_loop.sh
      for i in 1 2; do eval 'f() { break; echo "f went on"; }; f'; echo "eval $i"; done
      rm in_loop.sh no_loop.sh

  - name: "continue in a loop's condition"
    ignore_stderr: true
    stdin: |
      n=0
      while n=$((n + 1)); [ $n -lt 3 ] && continue; [ $n -lt 5 ]; do echo "while body $n"; done
      echo "while: n=$n"
      n=0
      until n=$((n + 1)); [ $n -lt 3 ] && continue; [ $n -ge 5 ]; do echo "until body $n"; done
      echo "until: n=$n"
      while break; do echo "not reached"; done
      echo "break in a condition: $?"

  - name: "break and continue go on when they can't report"
    stdin: |
      for i in 1 2; do break 0 2>&-; echo "break went on"; done
      echo "break 0: $?"
      for i in 1 2; do continue 0 2>&-; echo "continue went on"; done
      echo "continue 0: $?"
      break 2>&-; echo "break: $?"
      continue 2>&-; echo "continue: $?"

  - name: "A loop's words and initializer are in the loop"
    stdin: |
      for v in "$(break; echo "word went on")"; do echo "[$v]"; done
      for ((i = 1$(continue; echo 7); i < 3; i++)); do echo "i=$i"; done

  - name: "Redirections of a compound command in a subshell of its own are outside any loop"
    ignore_stderr: true
    stdin: |
      for i in 1; do : | { read -r v; echo "[$v]"; } <<<"$(break; echo "stage went on")"; done
      for i in 1; do : | while read -r v; do echo "[$v]"; done <<<"$(break; echo "loop stage went on")"; done
      f() { read -r v; echo "[$v]"; } <<<"$(break; echo "function went on")"
      for i in 1; do f; done
      shopt -s lastpipe
      for i in 1; do : | { read -r v; echo "[$v]"; } <<<"$(break; echo "not captured")"; done
