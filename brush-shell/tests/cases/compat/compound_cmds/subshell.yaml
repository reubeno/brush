name: "Compound commands: subshell"
cases:
  - name: "Basic subshell usage"
    stdin: |
      (echo hi)

  - name: "Subshells in sequence"
    ignore_stderr: true
    stdin: |
      (echo hi)(echo there)

  - name: "Subshell env usage"
    stdin: |
      (subshell_var=value && echo "subshell_var: ${subshell_var}")
      echo "subshell_var: ${subshell_var}"

  - name: "Subshell output redirection"
    stdin: |
      (echo Hello; echo world) >out.txt
      echo "Dumping out.txt..."
      cat out.txt

  - name: "Piped subshell usage"
    stdin: |
      (echo hi) | wc -l

  - name: "Breaks in subshell"
    stdin: |
      for i in 1 2 3; do
        echo $i
        (for i in 1 2 3; do break 2; done)
      done

  - name: "Exec in subshell"
    stdin: |
      echo "Before subshell"
      (exec cat <<<"Hello from exec in subshell")
      echo "After subshell"

  - name: "Nested subshells on one line"
    known_failure: true # TODO(parser): #1040: '( (' is parsed as the start of an arithmetic command
    stdin: |
      ( (echo hi) )
      x=$( ( (echo hi) ) )
      echo "x=$x"

  - name: "A subshell starts outside any loop"
    ignore_stderr: true
    stdin: |
      for i in 1 2; do
        (break; echo "survived $i: $?")
        (continue 2; echo "continued $i: $?")
      done
      echo done

  - name: "A subshell's redirections are expanded in the subshell"
    known_failure: true # TODO(subshell): a subshell's redirections are expanded in its parent, before the subshell starts
    ignore_stderr: true
    stdin: |
      for i in 1; do ( read -r v; echo "[$v]" ) <<<"$(break; echo "subshell went on")"; done
      ( : ) >"${x:=/dev/null}"
      echo "x=[$x]"
      ( : ) 3>&1 >"/dev/null$(echo "BASH_SUBSHELL=$BASH_SUBSHELL" >&3)"
