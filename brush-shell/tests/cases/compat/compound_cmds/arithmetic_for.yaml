name: "Compound commands: arithmetic for"
cases:
  - name: "Single-line arithmetic for loop"
    stdin: |
      for ((i = 0; i < 5; i++)); do echo $i; done
      echo "Result: $?"

  - name: "Arithmetic for loop without separator"
    stdin: |
      for ((i = 0; i < 5; i++)) do echo $i; done
      echo "Result: $?"

  - name: "Arithmetic for loop with empty condition"
    stdin: |
      for (( ; ; )); do
        echo "In loop; status: $?"
        break
      done
    echo "Result: $?"

  - name: "Arithmetic for loop with ;;"
    stdin: |
      for ((;;)); do
        echo "In loop; status: $?"
        break
      done
    echo "Result: $?"

  - name: "Arithmetic for loop with initializer and ;;"
    stdin: |
      for ((i = 0;;)); do
        echo "i=$i"
        break
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; and updater"
    stdin: |
      for ((;;i++)); do
        echo "i=$i"
        if ((i >= 2)); then break; fi
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with initializer, ;; and updater"
    stdin: |
      for ((i = 0;;i++)); do
        echo "i=$i"
        if ((i >= 2)); then break; fi
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; and spaces around it"
    stdin: |
      for (( i = 0 ;; i++ )); do
        echo "i=$i"
        if ((i >= 2)); then break; fi
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with parenthesized parts and ;;"
    stdin: |
      for (((i = 0);;(i++))); do
        echo "i=$i"
        if ((i >= 2)); then break; fi
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; and do on the next line"
    stdin: |
      for ((;;))
      do
        echo "In loop"
        break
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; and alternate syntax"
    stdin: |
      for ((;;)) { echo "In loop"; break; }
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; and a newline before the closing parens"
    stdin: |
      for ((i = 0;;
      )); do
        echo "i=$i"
        break
      done
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; inside a case item"
    stdin: |
      case x in
        x) for ((i = 0;;)); do echo "i=$i"; break; done;;
        *) echo "no match";;
      esac
      echo "Result: $?"

  - name: "Arithmetic for loop with ;; right after the condition"
    ignore_stderr: true
    stdin: |
      for ((i = 0; i < 3;;)); do echo "Should not run"; break; done
      echo "After syntax error"

  - name: "Arithmetic for loop with three semicolons"
    ignore_stderr: true
    stdin: |
      for ((;;;)); do echo "Should not run"; break; done
      echo "After syntax error"

  - name: "Arithmetic for loop with four semicolons"
    ignore_stderr: true
    stdin: |
      for ((;;;;)); do echo "Should not run"; break; done
      echo "After syntax error"

  - name: "Arithmetic for loop with ;; in the updater position"
    ignore_stderr: true
    stdin: |
      for ((i = 0; i < 3; ;;)); do echo "Should not run"; break; done
      echo "After syntax error"

  - name: "Break in arithmetic for loop"
    stdin: |
      for ((i = 0; i < 5; i++)); do
        echo $i
        break
      done
      echo "Result: $?"

  - name: "Continue in arithmetic for loop"
    stdin: |
      for ((i = 0; i < 5; i++)); do
        continue
        echo "Should not print"
      done
      echo "Result: $?"

  - name: "Arithmetic for with break in condition inside outer loop"
    stdin: |
      for j in 1 2 3; do
        echo "Outer iteration $j"
        for ((i = 0; break; i++)); do
          echo "Inner body"
        done
        echo "After inner for"
      done
      echo "After outer loop"

  - name: "Arithmetic for with continue in condition inside outer loop"
    stdin: |
      for j in 1 2 3; do
        echo "Outer iteration $j"
        for ((i = 0; continue; i++)); do
          echo "Inner body"
        done
        echo "After inner for"
      done
      echo "After outer loop"

  - name: "Arithmetic for with return in body"
    stdin: |
      f() {
        for ((i = 0; i < 5; i++)); do
          echo "Iteration $i"
          if [ $i -eq 2 ]; then
            return 42
          fi
        done
        echo "After for"
      }
      f
      echo "Exit code: $?"

  - name: "Arithmetic for with exit in body"
    stdin: |
      for ((i = 0; i < 5; i++)); do
        echo "Iteration $i"
        if [ $i -eq 2 ]; then
          exit 42
        fi
      done
      echo "After for"

  - name: "Arithmetic for with alternate syntax"
    stdin: |
      for ((i = 0; i < 5; i++)) {
        echo "Iteration $i"
      }

  - name: "Arithmetic for with alternate syntax (one line)"
    stdin: |
      for ((i = 0; i < 5; i++)) { echo "Iteration $i"; }

  - name: "Arithmetic for loop with nameref"
    known_failure: true
    stdin: |
      target=0
      declare -n ref=target
      for ((ref=1; ref<=3; ref++)); do
        echo "ref=$ref target=$target"
      done
      echo "final target=$target"
