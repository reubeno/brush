name: "Redirection: {varname} file descriptors"
# A redirection operator may be preceded by `{varname}` instead of a file
# descriptor number. The shell then allocates a free descriptor >= 10, opens the
# redirection on it, and assigns its number to varname; with `>&-` or `<&-`, the
# value of varname instead names the descriptor to close (issue #1292).
#
# Cases marked `known_failure` exercise behavior brush doesn't implement yet. The
# rest guard that words which merely look like `{varname}` stay ordinary words.
incompatible_configs: ["sh"]
cases:
  #
  # Allocation
  #
  - name: "exec {var}> allocates fd 10"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {fd}>out.txt
      echo "fd=$fd"
      echo hello >&$fd
      exec {fd}>&-
      cat out.txt

  - name: "Successive {var} allocations take the lowest free fd >= 10"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {a}>a.txt {b}>b.txt
      echo "a=$a b=$b"
      exec {c}>c.txt
      echo "c=$c"

  - name: "{var} allocation skips fds already in use"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec 10>x.txt 12>y.txt
      exec {a}>a.txt {b}>b.txt {c}>c.txt
      echo "$a $b $c"

  - name: "{var} allocation reuses a closed fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {a}>a.txt {b}>b.txt
      exec {a}>&-
      exec {c}>c.txt
      echo "a=$a b=$b c=$c"

  - name: "{var} allocation while a background job runs"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      # The shell's own bookkeeping for the job must not take the fd.
      sleep 0.5 &
      exec {fd}>out.txt
      echo "fd=$fd"
      wait

  - name: "Same {var} twice in one command"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {fd}>f.txt {fd}>g.txt
      echo "fd=$fd"
      echo to-f >&10
      echo to-g >&11
      cat f.txt g.txt

  - name: "Reassigning a {var} leaves the previous fd open"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {fd}>f.txt
      old=$fd
      exec {fd}>g.txt
      echo "old=$old new=$fd"
      echo to-f >&$old
      echo to-g >&$fd
      cat f.txt g.txt

  - name: "Later redirections in the same command see the assigned {var}"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {a}>a.txt {b}>&$a
      echo "a=$a b=$b"
      echo via-b >&$b
      cat a.txt

  - name: "{var} redirection before the command name"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      {f}>&1 echo hello >&$f
      echo "f=$f"

  - name: "{var} redirection with an assignment prefix"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      x=1 {f}>&1 echo hello >&$f
      echo "f=$f x=[$x]"

  - name: "Arguments are expanded before {var} is assigned"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo "during=[$fd]" {fd}>out.txt
      echo "after=$fd"

  #
  # Each redirection operator
  #
  - name: "{var}< opens a file for reading"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    test_files:
      - path: "in.txt"
        contents: |
          line1
          line2
    stdin: |
      exec {r}<in.txt
      read -r a <&$r
      read -r b <&$r
      echo "$r: $a $b"

  - name: "{var}>> appends"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo one >f.txt
      exec {w}>>f.txt
      echo two >&$w
      cat f.txt

  - name: "{var}<> opens for reading and writing"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo abc >f.txt
      exec {rw}<>f.txt
      read -r -n1 c <&$rw
      echo X >&$rw
      echo "rw=$rw c=$c"
      cat f.txt
      exec {new}<>created.txt
      ls created.txt

  - name: "{var}> and {var}>| with noclobber"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true # bash names the variable, not the file, in its error
    stdin: |
      set -o noclobber
      echo a >f.txt
      exec {w}>f.txt
      echo "status=$? w=[$w]"
      exec {w}>|f.txt
      echo "status=$? w=$w"
      echo b >&$w
      cat f.txt

  - name: "{var}<<< here-string"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      v=value
      exec {h}<<<"here $v"
      cat <&$h
      echo "h=$h"

  - name: "{var}<< here-document"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {h}<<EOF
      doc line $((1+1))
      EOF
      cat <&$h
      echo "h=$h"

  - name: "{var}<<- here-document strips tabs"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {h}<<-EOF
      	tabbed
      	EOF
      cat <&$h

  - name: "{var}>&n duplicates an output fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec 3>f.txt
      exec {fd}>&3
      echo "fd=$fd"
      echo via-dup >&$fd
      exec 3>&-
      echo still-open >&$fd
      cat f.txt

  - name: "{var}<&n duplicates an input fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    test_files:
      - path: "in.txt"
        contents: |
          first
          second
    stdin: |
      exec 3<in.txt
      exec {fd}<&3
      read -r a <&$fd
      read -r b <&3
      echo "fd=$fd a=$a b=$b"

  - name: "{var}>&n- moves an output fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec 5>f.txt
      exec {m}>&5-
      echo "m=$m"
      echo moved >&$m
      echo to-5 >&5 || echo "fd 5 closed"
      cat f.txt

  - name: "{var}<&n- moves an input fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    test_files:
      - path: "in.txt"
        contents: |
          moved-line
    stdin: |
      exec 5<in.txt
      exec {m}<&5-
      read -r l <&$m
      echo "m=$m l=$l"
      read -r l <&5 || echo "fd 5 closed"

  - name: "{var}>&word that isn't a number is an error"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec {fd}>&file.txt
      echo "status=$? fd=[$fd]"
      [[ -e file.txt ]] && echo created || echo not-created

  - name: "{var}>&n of a closed fd is an error"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec {fd}>&9
      echo "status=$? fd=[$fd]"
      # The failed attempt mustn't hold on to an fd.
      exec {g}>g.txt
      echo "g=$g"

  #
  # Closing with {var}>&- and {var}<&-
  #
  - name: "exec {var}>&- closes the fd and keeps the variable"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec {fd}>f.txt
      exec {fd}>&-
      echo "status=$? fd=$fd"
      echo x >&$fd || echo "write failed"

  - name: "exec {var}<&- closes an input fd"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    test_files:
      - path: "in.txt"
        contents: |
          data
    stdin: |
      exec {fd}<in.txt
      exec {fd}<&-
      echo "status=$?"
      read -r l <&$fd || echo "read failed"

  - name: "{var}>&- closes whichever fd the variable names"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec 7>f.txt
      fd=7
      exec {fd}>&-
      echo "status=$?"
      echo x >&7 || echo "fd 7 closed"

  - name: "{var}>&- can close stdout"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec 3>&1
      fd=1
      exec {fd}>&-
      echo hidden
      echo "shown status=$?" >&3

  - name: "Closing an fd that isn't open succeeds"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      fd=42
      exec {fd}>&-
      echo "status=$?"
      exec {fd}>f.txt
      exec {fd}>&-
      exec {fd}>&-
      echo "twice status=$?"

  - name: "Values {var}>&- accepts as fd numbers"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      for v in 7 " 7" "7 " +7; do
        exec 7>f.txt
        fd=$v
        exec {fd}>&-
        if { echo x >&7; } 2>/dev/null; then echo "[$v] still open"; else echo "[$v] closed"; fi
      done

  - name: "Values {var}>&- rejects"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true # bash reports these as "ambiguous redirect"
    stdin: |
      exec 7>seven.txt 10>ten.txt
      for v in "" abc -1 0x7 3+4 10x; do
        fd=$v
        exec {fd}>&-
        echo "[$v] status=$?"
      done
      unset fd
      exec {fd}>&-
      echo "unset status=$?"
      echo seven >&7
      echo ten >&10
      cat seven.txt ten.txt

  - name: "{var}>&- on a non-exec command closes only for that command"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec 7>f.txt
      fd=7
      : {fd}>&-
      echo after-builtin >&7
      { echo in-group >&7; } {fd}>&-
      echo "group status=$?"
      echo after-group >&7
      cat f.txt

  - name: "{var}>&- with an array element"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec {a[1]}>f.txt
      exec {a[1]}>&-
      echo "status=$? a1=${a[1]}"
      echo x >&10 || echo "fd 10 closed"

  #
  # Lifetime: a {var} redirection outlives the command it's on
  #
  - name: "{var} redirection on a builtin stays open afterward"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo hi {fd}>out.txt
      echo "fd=$fd"
      echo again >&$fd
      : {fd2}>out2.txt
      echo "fd2=$fd2"
      echo more >&$fd2
      cat out.txt out2.txt

  - name: "Builtin output sent to a {var} fd; stdout restored afterward"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo to-file {fd}>f.txt >&$fd
      echo "fd=$fd"
      echo after >&$fd
      cat f.txt

  - name: "{var} redirections through command, builtin, and eval"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      command echo a {a}>a.txt
      builtin echo b {b}>b.txt
      eval 'echo c {c}>c.txt'
      echo "$a $b $c"

  - name: "{var} redirection on a function call"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      f() { echo "in f: $fd" >&$fd; }
      f {fd}>out.txt
      echo "fd=$fd"
      echo after >&$fd
      cat out.txt

  - name: "{var} redirection on a function definition allocates per call"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      g() { echo "body: $fd" >&$fd; } {fd}>out.txt
      g
      echo "after first call: $fd"
      g
      echo "after second call: $fd"
      cat out.txt

  - name: "{var} redirection on a brace group"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      { echo "in group: $fd" >&$fd; } {fd}>out.txt
      echo "fd=$fd"
      echo after >&$fd
      cat out.txt

  - name: "{var} redirection on a while loop"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      while read -r l <&$fd; do echo "got $l"; done {fd}<<<"a"
      echo "fd=$fd"

  - name: "{var} redirection on an if command"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      if true; then echo "in if: $fd"; fi {fd}>out.txt
      echo "fd=$fd"

  - name: "{var} redirections in a loop allocate new fds each time"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      for i in 1 2 3; do : {fd}>f$i.txt; printf '%s ' "$fd"; done
      echo

  - name: "{var} with a local variable"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      f() { local fd; exec {fd}>out.txt; echo "inside=$fd"; }
      fd=outer
      f
      echo "outside=$fd"
      # The fd itself stays open after the function returns.
      echo still-open >&10
      cat out.txt

  - name: "Failed {var} redirection leaves the variable unchanged"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      fd=old
      exec {fd}<nonexistent.txt
      echo "exec status=$? fd=$fd"
      : {fd}<nonexistent.txt
      echo "builtin status=$? fd=$fd"
      # The failed attempts mustn't hold on to an fd.
      exec {g}>g.txt
      echo "g=$g"

  - name: "{var} redirection to a readonly variable fails"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      readonly fd=3
      echo hi {fd}>f.txt
      echo "status=$? fd=$fd"
      [[ -e f.txt ]] && echo "file created"
      exec {fd}>g.txt
      echo "exec status=$? fd=$fd"

  - name: "{var} allocation fails when no fd is available"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    incompatible_platforms: ["wasi"]
    ignore_stderr: true
    stdin: |
      ulimit -n 12 || exit 1
      exec {a}>a.txt
      echo "status=$? a=$a"
      exec {b}>b.txt
      echo "status=$? b=$b"
      exec {c}>c.txt
      echo "status=$? c=[$c]"

  #
  # Commands run in a child don't assign the variable in the shell
  #
  - name: "{var} redirection on an external command"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      sh -c 'echo "child wrote to fd 10" >&10' {fd}>out.txt
      echo "fd=[$fd]"
      cat out.txt

  - name: "{var} redirection without a command"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      {fd}>out.txt
      echo "status=$? fd=[$fd]"
      ls out.txt

  - name: "{var} redirection on a subshell"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      ( echo "inside: $fd" >&$fd ) {fd}>out.txt
      echo "outside=[$fd]"
      cat out.txt
      ( exec {g}>g.txt; echo "exec inside: $g" )
      echo "exec outside=[$g]"

  - name: "{var} redirection in a pipeline"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo hi {fd}>out.txt | cat
      echo "fd=[$fd]"

  - name: "{var} redirection in a command substitution"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      x=$(: {fd}>out.txt; echo "inner=$fd")
      echo "$x outer=[$fd]"

  - name: "{var} fds are inherited by children"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {fd}>out.txt
      sh -c "echo external >&$fd"
      ( echo subshell >&$fd )
      echo background >&$fd &
      wait
      x=$(echo cmdsub >&$fd)
      echo pipeline >&$fd | cat
      cat out.txt

  #
  # varredir_close
  #
  - name: "varredir_close closes a builtin's {var} fd afterward"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      shopt -s varredir_close
      echo hi {fd}>out.txt
      echo "fd=$fd"
      echo x >&$fd || echo "fd closed"

  - name: "varredir_close doesn't affect exec"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      shopt -s varredir_close
      exec {fd}>out.txt
      echo "fd=$fd"
      echo still-open >&$fd
      cat out.txt

  - name: "varredir_close with compound commands and functions"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      shopt -s varredir_close
      { echo "in group: $fd" >&$fd; } {fd}>out.txt
      echo x >&$fd || echo "group fd closed"
      f() { echo "in f: $g" >&$g; }
      f {g}>>out.txt
      echo x >&$g || echo "function fd closed"
      cat out.txt

  - name: "varredir_close frees the fd for reuse"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      shopt -s varredir_close
      echo hi {fd}>f.txt
      exec {g}>g.txt
      echo "fd=$fd g=$g"

  #
  # What varname may be
  #
  - name: "{var} with array elements"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {a[1]}>a.txt
      declare -p a
      declare -A m
      exec {m[k]}>m.txt
      declare -p m
      i=2
      exec {b[i+1]}>b.txt
      declare -p b
      c=(5 6)
      exec {c}>c.txt
      declare -p c

  - name: "{var} with an invalid array subscript"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      exec {a[@]}>a.txt
      echo "status=$?"
      declare -p a 2>/dev/null || echo "a unset"

  - name: "{var} with a nameref"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      declare -n r=target
      exec {r}>out.txt
      echo "target=$target"

  - name: "{var} keeps the variable's attributes"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      exec {plain}>p.txt
      declare -p plain
      declare -i int
      exec {int}>i.txt
      declare -p int

  - name: "{var} with underscores and digits in the name"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      echo hi {_x9}>f.txt {FD_2}>g.txt
      echo "$_x9 $FD_2"

  - name: "{var} under set -u"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    ignore_stderr: true
    stdin: |
      set -u
      exec {fd}>f.txt
      echo "fd=$fd"
      unset other
      exec {other}>&-
      echo "close unset status=$?"

  - name: "{var} in POSIX mode"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      set -o posix
      echo hi {fd}>f.txt
      echo "fd=$fd"

  #
  # Words that only look like {varname} stay ordinary words
  #
  - name: "Braced words that aren't valid names aren't {var} redirections"
    stdin: |
      echo hi {1x}>f1.txt; cat f1.txt
      echo hi {}>f2.txt; cat f2.txt
      echo hi {a-b}>f3.txt; cat f3.txt
      echo hi {1}>f4.txt; cat f4.txt
      echo hi {@}>f5.txt; cat f5.txt
      v=
      echo hi {$v}>f6.txt; cat f6.txt

  - name: "Quoted, spaced, or adjoined {var} isn't a redirection prefix"
    stdin: |
      echo hi "{fd}">f1.txt; cat f1.txt
      echo hi \{fd}>f2.txt; cat f2.txt
      echo hi {fd} >f3.txt; cat f3.txt
      echo hi x{fd}>f4.txt; cat f4.txt
      echo hi {fd}x>f5.txt; cat f5.txt
      echo "fd=[$fd]"

  - name: "{var} before &> is an ordinary word"
    stdin: |
      echo hi {fd}&>out.txt
      echo "fd=[$fd]"
      cat out.txt

  - name: "Brace expansion before a redirection is unaffected"
    stdin: |
      echo hi {a,b}>out.txt
      cat out.txt

  #
  # Display
  #
  - name: "declare -f shows {var} redirections"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      f() { echo hi {fd}>out; cat {r}<in; cat {a}>>z; cat {b}<>y; read x {h}<<<"str"; exec {c[1]}>arr; }
      declare -f f

  - name: "xtrace omits {var} redirections"
    known_failure: true # TODO(redirection): {varname} redirections not implemented (#1292)
    stdin: |
      set -x
      exec {fd}>f.txt
      echo hi {g}>g.txt
      exec {fd}>&- {g}>&-
