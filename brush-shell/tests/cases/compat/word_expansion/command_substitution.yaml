name: "Command substitution"
cases:
  - name: "Command substitution"
    stdin: |
      var="value"

      echo "1:"
      echo $(echo hi)
      echo "2:"
      echo "$(echo hi)"
      echo "3:"
      echo "$(echo "hi")"
      echo "4:"
      echo "$(var="updated"; echo ${var})"
      echo "var=${var}"

  - name: "Command substitution with embedded parens"
    stdin: |
      x=$(echo foo | (wc -l; echo hi))
      echo "\$x: $x"

  - name: "Command substitution with subshell"
    stdin: |
      x=$( (echo hi) )
      echo "\$x: $x"

  - name: "Command substitution exit code"
    stdin: |
      x=$(false) && echo "1. Made it past false"
      y=$(true) && echo "2. Made it past true"

  - name: "Command substitution with exec"
    stdin: |
      x=$(exec echo hi)
      echo "x: $x"

  - name: "Backtick command substitution"
    stdin: |
      echo `echo hi`

  - name: "Backtick command substitution with escaping"
    stdin: |
      echo `echo \`echo hi\``

  - name: "Backtick command substitution with backslashes"
    stdin: |
      echo `echo \\`

  - name: "Backtick command substitution in double quotes"
    stdin: |
      echo "`echo First line`"
      echo " `echo Second line` "
      echo "Third`echo line`here"

  - name: "Ignore single quote in comment in command substitution"
    stdin: |
      var=$(
        # I'm
        echo "Batman"
      )
      echo $var

  - name: "Ignore double quote in comment in command substitution"
    stdin: |
      var=$(
        # This " is not being
        echo "parsed"
      )
      echo $var

  - name: "Ignore parentheses in comment in command substitution"
    stdin: |
      var=$(
        # :(
        echo "Sad"
      )
      echo $var

  - name: "Ignore dollar in comment in command substitution"
    stdin: |
      var=$(
        #               $
        echo "Mr. Crabs ^"
      )
      echo $var

  - name: "Positional parameter count not mistaken for comment"
    stdin: |
      echo $(echo $#)

  - name: "Comment after blanks in command substitution"
    stdin: |
      echo "0 blanks: $(# I'm a comment
      echo hi)"
      echo "1 blank: $( # I'm a comment
      echo hi)"
      echo "2 blanks: $(  # I'm a comment
      echo hi)"
      echo "3 blanks: $(   # I'm a comment
      echo hi)"

  - name: "Comment after tabs in command substitution"
    stdin: |
      echo "1 tab: $(	# I'm a comment
      echo hi)"
      echo "2 tabs: $(		# I'm a comment
      echo hi)"
      echo "blank and tab: $( 	# I'm a comment
      echo hi)"

  - name: "Hash after blanks that is not a comment in command substitution"
    stdin: |
      echo "1: $( echo a#b )"
      echo "2: $( echo 'a # b' )"
      echo "3: $( echo one # I'm a trailing comment
      echo two)"
      echo "4: $(cat <<HERE
       # not a comment
      HERE
      )"

  - name: "Ignore single quote in comment in command substitution (backticks)"
    stdin: |
      var=`
        # I'm
        echo "Batman"
      `
      echo $var

  - name: "Ignore double quote in comment in command substitution (backticks)"
    stdin: |
      var=`
        # This " is not being
        echo "parsed"
      `
      echo $var

  - name: "Ignore parentheses in comment in command substitution (backticks)"
    stdin: |
      var=`
        # :(
        echo "Sad"
      `
      echo $var

  - name: "Ignore dollar in comment in command substitution (backticks)"
    stdin: |
      var=`
        #               $
        echo "Mr. Crabs ^"
      `
      echo $var

  - name: "Positional parameter count not mistaken for comment (backticks)"
    stdin: |
      echo `echo $#`

  - name: "Command substitution with only input redir"
    stdin: |
      echo "Some text" >file.txt
      x=$(<file.txt)
      echo "x: $x"

  - name: "Command substitution with only input redir in pipeline"
    known_failure: true
    ignore_stderr: true
    test_files:
      - path: file.txt
        contents: |
          File Contents
    stdin: |
      x=$(<non-existent-file.txt) || x=$(<file.txt)
      echo "\$?: $?"
      echo "x: $x"

  - name: "Backquote with only input redir"
    stdin: |
      echo "Some text" >file.txt
      x=`<file.txt`
      echo "x: $x"

  - name: "Command substitution as simple command preserves exit code"
    stdin: |
      $(false)
      echo "exit code: $?"

      $(true)
      echo "exit code: $?"

      $(exit 42)
      echo "exit code: $?"

  - name: "Backtick substitution as simple command preserves exit code"
    stdin: |
      `false`
      echo "exit code: $?"

      `true`
      echo "exit code: $?"

  - name: "Command substitution with exec as simple command"
    stdin: |
      $(exec true)
      echo "exit code: $?"

      $(exec false)
      echo "exit code: $?"

  - name: "Command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e 'a\x00b')" | hexdump -C

  - name: "Backtick substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "`echo -e 'a\x00b'`" | hexdump -C

  - name: "Command substitution strips multiple null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e 'hello\x00world\x00end')" | hexdump -C

  - name: "Command substitution with only null bytes produces empty string"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e '\x00\x00\x00')" | hexdump -C

  - name: "Variable assignment from command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      x=$(echo -e 'a\x00b')
      echo "$x" | hexdump -C

  - name: "Input redirection substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      printf 'a\x00b' > file.txt
      x=$(<file.txt)
      echo "$x" | hexdump -C

  - name: "Nested command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo "$(echo -e 'a\x00b')")" | hexdump -C

  - name: "Nested command substitution exit code"
    stdin: |
      $($(false))
      echo "exit code: $?"

      $($(:))
      echo "exit code: $?"

  - name: "Case statement with unparenthesized pattern in command substitution"
    known_failure: true # TODO(tokenizer): #1052: the ')' ending a case pattern is taken as closing the '$('
    stdin: |
      echo "$(case x in x) echo matched;; esac)"

  - name: "Case statement with unparenthesized pattern in command substitution in here doc"
    known_failure: true # TODO(tokenizer): #1052: the ')' ending a case pattern is taken as closing the '$('
    stdin: |
      cat <<EOF
      $(case x in x) echo matched;; esac)
      EOF

  - name: "Command substitution with embedded extglob"
    stdin: |
      shopt -s extglob
      touch abc abd xyz
      echo "$(echo @(abc|xyz))"
      echo $(echo !(ab*))

  - name: "Command substitution with quoted paren in extglob"
    stdin: |
      shopt -s extglob
      echo @(")") @(a|')'|b)x @(\))
      echo $(printf "%s" @(")"))
      echo "$(echo @(a|")"|b)x)"
      echo @($'\'')x @($'a\')'|b) @(\$'a\')x @($")")x
      echo $(echo @($'\'')x)
      echo @($$'a\')x @($$$'\'')x | sed "s/$$/PID/g"

  - name: "Extglob containing backquotes or command substitution in quotes"
    stdin: |
      shopt -s extglob
      echo @(`echo ")"`)x @(`echo "("`)x
      echo @("$(echo ")")")x @("`echo "\)"`")x
      echo $(echo @(`echo ")"`)x)

  - name: "Extglob containing parameter expansion with blanks in quotes"
    known_failure: true # TODO(tokenizer): unquoted blanks inside '${...}' in double quotes are collapsed to one space
    stdin: |
      shopt -s extglob
      case 'a  b' in @("${u:-a  b}")) echo match;; *) echo no match;; esac

  - name: "Escaped backslash in backquoted command"
    known_failure: true # TODO(expansion): '\\' inside backquotes isn't reduced to '\' before the command runs
    stdin: |
      shopt -s extglob
      echo `echo \\"`
      echo @(`echo \\"`)x

  - name: "Extglob containing backquoted command that fails"
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @(}`'`)x
      echo @(`$'\'`)x

  - name: "Extglob with unquoted command substitution containing a comment"
    # As in bash, an unquoted `$(` in an extglob isn't parsed as a command; its parens
    # just count toward the nesting, so the `)` in the comment matters.
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @($(echo x # )
      ))y
      echo "not reached"

  - name: "Extglob with unterminated construct inside quotes"
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @("$(\$"\))x
      echo "not reached"

  - name: "Single quote after escaped or doubled dollar sign"
    known_failure: true # TODO(tokenizer): a quote after any '$' is taken as ANSI-C quoting, even after '\$' or '$$'
    stdin: |
      echo \$'a\'x
      echo $$'a\'x | sed "s/$$/PID/g"

  - name: "Extglob containing backquoted command with close paren"
    stdin: |
      shopt -s extglob
      touch x
      echo $(echo @(`case x in x) echo x;; esac`))

  - name: "Pathname expansion of extglob containing backquoted command"
    known_failure: true # TODO(patterns): extglobs containing an expansion never match
    stdin: |
      shopt -s extglob
      touch x
      echo @(`case x in x) echo x;; esac`)

  - name: "Function substitution"
    known_failure: true # TODO(expansion): #931: ${ cmd; } (bash 5.3) is not implemented
    stdin: |
      ${ false; }
      echo "rc=$?"
      x=${ echo hi; }
      echo "x=$x"
