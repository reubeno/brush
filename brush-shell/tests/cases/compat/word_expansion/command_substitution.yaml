name: "Command substitution"
cases:
  - name: "Command substitution"
    stdin: |
      var="value"

      echo "1:"
      echo $(echo hi)
      echo "2:"
      echo "$(echo hi)"
      echo "3:"
      echo "$(echo "hi")"
      echo "4:"
      echo "$(var="updated"; echo ${var})"
      echo "var=${var}"

  - name: "Command substitution with embedded parens"
    stdin: |
      x=$(echo foo | (wc -l; echo hi))
      echo "\$x: $x"

  - name: "Command substitution with subshell"
    stdin: |
      x=$( (echo hi) )
      echo "\$x: $x"

  - name: "Command substitution exit code"
    stdin: |
      x=$(false) && echo "1. Made it past false"
      y=$(true) && echo "2. Made it past true"

  - name: "Command substitution with exec"
    stdin: |
      x=$(exec echo hi)
      echo "x: $x"

  - name: "Backtick command substitution"
    stdin: |
      echo `echo hi`

  - name: "Backtick command substitution with escaping"
    stdin: |
      echo `echo \`echo hi\``

  - name: "Backtick command substitution with backslashes"
    stdin: |
      echo `echo \\`

  - name: "Backtick command substitution with trailing backslashes"
    stdin: |
      y=`printf %s \\`
      printf 'two: <%s> len=%s\n' "$y" "${#y}"
      y=`printf %s \\\\`
      printf 'four: <%s> len=%s\n' "$y" "${#y}"
      y=`printf %s \\\\\\`
      printf 'six: <%s> len=%s\n' "$y" "${#y}"

  - name: "Backtick command substitution escape rules"
    stdin: |
      HOME=abc
      printf '<%s>\n' `printf '%s\n' \\\\2`
      echo `echo \$HOME`
      echo `echo \\$HOME`
      echo `echo \"q\"`
      echo `echo 'a\"b'`

  - name: "Backtick command substitution escape rules in double quotes"
    stdin: |
      HOME=abc
      echo "`echo \\\\a`"
      echo "`echo \$HOME \\$HOME`"
      y=
      echo "${y:-`echo \"q\"`}"

  - name: "Backtick command substitution unescaping double quotes in double quotes"
    known_failure: true # TODO(parser): in backquotes directly within double quotes (not in a `${...}` within them), a backslash before `"` is removed
    stdin: |
      echo "`echo \"q\"`"
      echo "`echo 'a\"b'`"

  - name: "Backtick command substitution line continuations"
    stdin: |
      echo `echo e\
      cho`
      echo `echo 'a\
      b'`
      echo "`echo 'a\
      b'`"

  - name: "Backtick command substitution in double quotes"
    stdin: |
      echo "`echo First line`"
      echo " `echo Second line` "
      echo "Third`echo line`here"

  - name: "Ignore single quote in comment in command substitution"
    stdin: |
      var=$(
        # I'm
        echo "Batman"
      )
      echo $var

  - name: "Ignore double quote in comment in command substitution"
    stdin: |
      var=$(
        # This " is not being
        echo "parsed"
      )
      echo $var

  - name: "Ignore parentheses in comment in command substitution"
    stdin: |
      var=$(
        # :(
        echo "Sad"
      )
      echo $var

  - name: "Ignore dollar in comment in command substitution"
    stdin: |
      var=$(
        #               $
        echo "Mr. Crabs ^"
      )
      echo $var

  - name: "Positional parameter count not mistaken for comment"
    stdin: |
      echo $(echo $#)

  - name: "Comment after blanks in command substitution"
    stdin: |
      echo "0 blanks: $(# I'm a comment
      echo hi)"
      echo "1 blank: $( # I'm a comment
      echo hi)"
      echo "2 blanks: $(  # I'm a comment
      echo hi)"
      echo "3 blanks: $(   # I'm a comment
      echo hi)"

  - name: "Comment after tabs in command substitution"
    stdin: |
      echo "1 tab: $(	# I'm a comment
      echo hi)"
      echo "2 tabs: $(		# I'm a comment
      echo hi)"
      echo "blank and tab: $( 	# I'm a comment
      echo hi)"

  - name: "Hash after blanks that is not a comment in command substitution"
    stdin: |
      echo "1: $( echo a#b )"
      echo "2: $( echo 'a # b' )"
      echo "3: $( echo one # I'm a trailing comment
      echo two)"
      echo "4: $(cat <<HERE
       # not a comment
      HERE
      )"

  - name: "Ignore single quote in comment in command substitution (backticks)"
    stdin: |
      var=`
        # I'm
        echo "Batman"
      `
      echo $var

  - name: "Ignore double quote in comment in command substitution (backticks)"
    stdin: |
      var=`
        # This " is not being
        echo "parsed"
      `
      echo $var

  - name: "Ignore parentheses in comment in command substitution (backticks)"
    stdin: |
      var=`
        # :(
        echo "Sad"
      `
      echo $var

  - name: "Ignore dollar in comment in command substitution (backticks)"
    stdin: |
      var=`
        #               $
        echo "Mr. Crabs ^"
      `
      echo $var

  - name: "Positional parameter count not mistaken for comment (backticks)"
    stdin: |
      echo `echo $#`

  - name: "Command substitution with only input redir"
    stdin: |
      echo "Some text" >file.txt
      x=$(<file.txt)
      echo "x: $x"

  - name: "Input-only command substitution from process substitution"
    stdin: |
      echo $(< <(echo x) )
      [[ $(< <(echo foo) ) == foo ]]
      echo "status: $?"
      x=`< <(echo legacy)`
      echo "backquote: $x"

  - name: "Input-only command substitution preserves producer subshell depth"
    stdin: |
      x=$(< <(printf '%s' "$BASH_SUBSHELL"))
      printf 'depth: %s\n' "$x"
      (x=$(< <(printf '%s' "$BASH_SUBSHELL")); printf 'nested: %s\n' "$x")
      x=$(< <(printf '%s' "$BASH_SUBSHELL"; (printf ':%s' "$BASH_SUBSHELL")))
      printf 'producer: %s\n' "$x"

  - name: "Input-only command substitution expands its filename in the caller"
    test_files:
      - path: file.txt
        contents: |
          content
      - path: file-0.txt
        contents: |
          caller
      - path: file-1.txt
        contents: |
          subshell
    stdin: |
      unset file
      x=$(< "${file:=file.txt}")
      printf 'value: %s file: %s\n' "$x" "${file-unset}"
      x=$(< "file-$BASH_SUBSHELL.txt")
      printf 'depth: %s\n' "$x"
      x=$(< "$(printf 'file-%s.txt' "$BASH_SUBSHELL")")
      printf 'nested expansion: %s\n' "$x"

  - name: "Input-only command substitution missing file is not fatal"
    ignore_stderr: true
    stdin: |
      x=$(< missing.txt) || printf 'failure: %s\n' "$?"
      printf 'continued: <%s>\n' "$x"
      { x=$(< missing.txt); printf 'closed stderr: %s\n' "$?"; } 2>&-

  - name: "Input-only command substitution survives failed diagnostic writes"
    stdin: |
      [[ -e /dev/full ]] || exit 0
      {
        x=$(< missing.txt)
        printf 'assignment: <%s> status=%s\n' "$x" "$?"
        printf 'value: <%s>\n' "$(< missing.txt)"
      } 2>/dev/full
      printf 'continued: %s\n' "$?"

  - name: "Input-only command substitution propagates fatal expansion errors"
    ignore_exit_status: true
    ignore_stderr: true
    stdin: |
      set -u
      x=$(< "$unset_filename")
      echo "unexpected continuation"

  - name: "Input-only command substitution excludes background and timed redirects"
    test_files:
      - path: file.txt
        contents: |
          content
    stdin: |
      x=$(< file.txt &)
      printf 'background file: <%s>\n' "$x"
      x=$(< <(printf value) &)
      printf 'background process: <%s>\n' "$x"
      { x=$(time < file.txt); } 2>timing.txt
      printf 'timed file: <%s> ' "$x"
      if [[ -s timing.txt ]]; then echo reported; else echo missing; fi
      { x=$(time < <(printf value)); } 2>timing.txt
      printf 'timed process: <%s> ' "$x"
      if [[ -s timing.txt ]]; then echo reported; else echo missing; fi
      rm timing.txt

  - name: "Input-only command substitution completes when producer closes stdout"
    timeout_in_seconds: 5
    stdin: |
      mkfifo gate
      x=$(< <(exec 1>&-; read -r line < gate; printf '%s\n' "$line" >result))
      echo "substitution returned"
      printf 'released\n' >gate
      while [[ ! -f result ]]; do sleep 0.01; done
      cat result
      rm gate result

  - name: "Input-only command substitution preserves inherited process descriptors"
    test_files:
      - path: file.txt
        contents: |
          original
    stdin: |
      read_input() { read -r value; printf '%s\n' "$value"; }
      outer() {
        x=$(< <(read_input <(printf 'replacement\n') <&63))
        printf '%s\n' "$x"
      }
      outer 63<file.txt

  - name: "Input-only command substitution from process substitution with explicit stdin"
    stdin: |
      x=$(0< <(echo explicit))
      echo "x: $x"

  - name: "Input-only command substitution from delayed process substitution"
    stdin: |
      x=$(< <(sleep 0.05; printf 'first\nsecond\n\n'))
      printf '<%s> length: %s\n' "$x" "${#x}"

  - name: "Input-only command substitution from large process substitution"
    stdin: |
      x=$(< <(printf '%0131072d\n' 0))
      printf 'length: %s first: %s last: %s\n' "${#x}" "${x:0:1}" "${x: -1}"

  - name: "Input-only command substitution ignores process substitution exit status"
    stdin: |
      x=$(< <(printf value; exit 7))
      printf 'value: %s status: %s\n' "$x" "$?"

  - name: "Input-only command substitution process substitution inherits errexit"
    stdin: |
      set -e
      x=$(< <(printf before; false; printf after))
      printf 'errexit: <%s>\n' "$x"
      x=$(< <(false; printf continued)) || :
      printf 'conditional: <%s>\n' "$x"
      if x=$(< <(false; printf continued)); then printf 'if: <%s>\n' "$x"; fi
      x=$(< <(false; printf continued)) && printf 'and: <%s>\n' "$x"
      ! x=$(< <(false; printf continued))
      printf 'negated: <%s>\n' "$x"
      x=`< <(false; printf continued)`
      printf 'backquote: <%s>\n' "$x"
      x=$(< <([[ $- == *e* ]] && printf enabled || printf disabled))
      printf 'option: <%s>\n' "$x"
      set +e
      x=$(< <(false; printf continued))
      printf 'disabled: <%s>\n' "$x"

  - name: "Process substitution redirection without input-only command substitution"
    stdin: |
      x=$(3< <(echo ignored))
      printf 'other fd: <%s>\n' "$x"
      x=$(< <(echo ignored); :)
      printf 'command list: <%s>\n' "$x"
      x=$(< <(echo ignored) | cat)
      printf 'pipeline: <%s>\n' "$x"
      x=$(< <(echo ignored) 2>/dev/null)
      printf 'additional redirect: <%s>\n' "$x"

  - name: "Command substitution with only input redir in pipeline"
    ignore_stderr: true
    test_files:
      - path: file.txt
        contents: |
          File Contents
    stdin: |
      x=$(<non-existent-file.txt) || x=$(<file.txt)
      echo "\$?: $?"
      echo "x: $x"

  - name: "Backquote with only input redir"
    stdin: |
      echo "Some text" >file.txt
      x=`<file.txt`
      echo "x: $x"

  - name: "Command substitution as simple command preserves exit code"
    stdin: |
      $(false)
      echo "exit code: $?"

      $(true)
      echo "exit code: $?"

      $(exit 42)
      echo "exit code: $?"

  - name: "Backtick substitution as simple command preserves exit code"
    stdin: |
      `false`
      echo "exit code: $?"

      `true`
      echo "exit code: $?"

  - name: "Command substitution with exec as simple command"
    stdin: |
      $(exec true)
      echo "exit code: $?"

      $(exec false)
      echo "exit code: $?"

  - name: "Command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e 'a\x00b')" | hexdump -C

  - name: "Backtick substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "`echo -e 'a\x00b'`" | hexdump -C

  - name: "Command substitution strips multiple null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e 'hello\x00world\x00end')" | hexdump -C

  - name: "Command substitution with only null bytes produces empty string"
    ignore_stderr: true
    stdin: |
      echo "$(echo -e '\x00\x00\x00')" | hexdump -C

  - name: "Variable assignment from command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      x=$(echo -e 'a\x00b')
      echo "$x" | hexdump -C

  - name: "Input redirection substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      printf 'a\x00b' > file.txt
      x=$(<file.txt)
      echo "$x" | hexdump -C

  - name: "Nested command substitution strips null bytes"
    ignore_stderr: true
    stdin: |
      echo "$(echo "$(echo -e 'a\x00b')")" | hexdump -C

  - name: "Nested command substitution exit code"
    stdin: |
      $($(false))
      echo "exit code: $?"

      $($(:))
      echo "exit code: $?"

  - name: "Syntax error inside command substitution"
    known_failure: true # TODO(parser): the substituted command isn't parsed until it runs, so bash's syntax error (which ends the script) becomes a failed substitution
    ignore_stderr: true
    stdin: |
      x="[$(if)]"
      echo "rc=$? x=$x"

  - name: "Case statement with unparenthesized pattern in command substitution"
    stdin: |
      echo "$(case x in x) echo matched;; esac)"

  - name: "Case statement with unparenthesized pattern in command substitution in here doc"
    stdin: |
      cat <<EOF
      $(case x in x) echo matched;; esac)
      EOF

  - name: "Case statements of several clauses in command substitution"
    stdin: |
      shopt -s extglob
      echo "$(case b in (a) echo a;; b|c) echo b;; esac)"
      echo "$(case y in @(x|y)) echo ext;; esac)"
      echo "$(case a in a) case b in b) echo nested;; esac;; esac) after"

  - name: "Case keywords as plain words in command substitution"
    stdin: |
      echo "$(echo case in)"
      echo "$(echo esac)"
      echo "$(for case in a; do echo "$case"; done)"
      case=1; in=2
      echo "$(echo $((case + in + (3))))"
      echo "$(cat <<END
      case
      END
      echo in)"

  - name: "Case statement in a subshell in command substitution"
    stdin: |
      echo "$( (case x in x) echo bare;; esac) )"
      echo "$( (case x in (x) echo paren;; esac) )"
      echo "$(echo a; (echo b; case y in y) echo c;; esac) | cat)"

  - name: "Case statement with extra blanks in command substitution"
    stdin: |
      echo "$(  case x  in  x)  echo ok;;  esac)"
      echo "[$(case x in  esac)]"
      echo "$(case x in x) echo comment;; # c
      esac)"

  - name: "Case statement after function and time -p in command substitution"
    stdin: |
      echo "$(function f { case x in x) echo fn;; esac; }; f)"
      echo "$({ time -p case x in x) echo timed;; esac; } 2>/dev/null)"

  - name: "Array assignment of case keywords in command substitution"
    stdin: |
      echo "$(a=(case x in); echo "${a[@]}")"
      echo "$(declare -a b=(esac in); echo "${b[1]}")"

  - name: "Command substitution with embedded extglob"
    stdin: |
      shopt -s extglob
      touch abc abd xyz
      echo "$(echo @(abc|xyz))"
      echo $(echo !(ab*))

  - name: "Command substitution with quoted paren in extglob"
    stdin: |
      shopt -s extglob
      echo @(")") @(a|')'|b)x @(\))
      echo $(printf "%s" @(")"))
      echo "$(echo @(a|")"|b)x)"
      echo @($'\'')x @($'a\')'|b) @(\$'a\')x @($")")x
      echo $(echo @($'\'')x)
      echo @($$'a\')x @($$$'\'')x | sed "s/$$/PID/g"

  - name: "Extglob containing backquotes or command substitution in quotes"
    stdin: |
      shopt -s extglob
      echo @(`echo ")"`)x @(`echo "("`)x
      echo @("$(echo ")")")x @("`echo "\)"`")x
      echo $(echo @(`echo ")"`)x)

  - name: "Extglob containing parameter expansion with blanks in quotes"
    stdin: |
      shopt -s extglob
      case 'a  b' in @("${u:-a  b}")) echo match;; *) echo no match;; esac

  - name: "Extglob containing dollar and single quote in double quotes"
    stdin: |
      shopt -s extglob
      v="\$'x'"
      case "$v" in @("$'x'")) echo match;; *) echo no match;; esac

  - name: "Escaped backslash in backquoted command"
    stdin: |
      shopt -s extglob
      echo `echo \\"`
      echo @(`echo \\"`)x

  - name: "Extglob containing backquoted command that fails"
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @(}`'`)x
      echo @(`$'\'`)x

  - name: "Extglob with unquoted command substitution containing a comment"
    # As in bash, an unquoted `$(` in an extglob isn't parsed as a command; its parens
    # just count toward the nesting, so the `)` in the comment matters.
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @($(echo x # )
      ))y
      echo "not reached"

  - name: "Extglob with unterminated construct inside quotes"
    ignore_stderr: true
    stdin: |
      shopt -s extglob
      echo @("$(\$"\))x
      echo "not reached"

  - name: "Single quote after escaped or doubled dollar sign"
    stdin: |
      echo \$'a\'x
      echo $$'a\'x | sed "s/$$/PID/g"

  - name: "Extglob containing backquoted command with close paren"
    stdin: |
      shopt -s extglob
      touch x
      echo $(echo @(`case x in x) echo x;; esac`))

  - name: "Pathname expansion of extglob containing backquoted command"
    known_failure: true # TODO(patterns): extglobs containing an expansion never match
    stdin: |
      shopt -s extglob
      touch x
      echo @(`case x in x) echo x;; esac`)

  - name: "Large builtin output after a nested command substitution"
    stdin: |
      s=x; for i in {1..17}; do s=$s$s; done
      for i in {1..20}; do v=$(echo "$(true)$s"); done
      echo "${#v}"

  - name: "Function substitution"
    known_failure: true # TODO(expansion): #931: ${ cmd; } (bash 5.3) is not implemented
    stdin: |
      ${ false; }
      echo "rc=$?"
      x=${ echo hi; }
      echo "x=$x"

  - name: "Nested command substitution output"
    stdin: |
      echo "$(echo "$(echo hello)")"

  - name: "Deeply nested command substitution"
    stdin: |
      echo "$(echo "$(echo "$(echo deep)")")"

  - name: "Nested command substitution with variable"
    stdin: |
      x="inner"
      result="$(echo "prefix-$(echo "$x")-suffix")"
      echo "$result"

  - name: "Nested command substitution with pipe"
    stdin: |
      result=$(echo "hello world" | $(echo cat))
      echo "$result"

  - name: "Command substitution in arithmetic"
    stdin: |
      echo "$(( $(echo 10) + $(echo 20) ))"

  - name: "Nested command substitution with process substitution"
    stdin: |
      result=$(cat <(echo "from proc sub"))
      echo "$result"

  - name: "Triple nested command substitution"
    stdin: |
      echo "$(echo "a$(echo "b$(echo c)b")a")"

  - name: "Command substitution with loop"
    stdin: |
      result=$(for i in 1 2 3; do echo "$i"; done)
      echo "$result"

  - name: "Nested backtick and dollar-paren substitution"
    stdin: |
      echo "$(echo `echo mixed`)"

  - name: "Command substitution with conditional"
    stdin: |
      x=5
      result=$(if [[ $x -gt 3 ]]; then echo "big"; else echo "small"; fi)
      echo "$result"

  - name: "Command substitution capturing stderr via redirection"
    stdin: |
      result=$(echo "error msg" >&2 2>&1)
      echo "result: $result"

  - name: "Command substitution with quoted closing paren"
    stdin: |
      f() {
        echo $(echo ")")
      }
      f

  - name: "Command substitution with quoted opening paren"
    stdin: |
      f() {
        echo $(echo '(')
      }
      f

  - name: "Comment in command substitution without newline fails"
    known_failure: true
    stdin: |
      x=$(echo # must fail)

  - name: "Comment in command substitution with newline"
    stdin: |
      x=$(
        echo "a" # comment with "quote
        echo "b"
      )
      echo "$x"

