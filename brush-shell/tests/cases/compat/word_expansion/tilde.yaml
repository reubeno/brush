name: "Tilde expansion"
cases:
  - name: "Tilde expansion: basic"
    home_dir: .
    stdin: |
      test_root=$(realpath $(pwd))

      mkdir subdir
      cd subdir

      D=~
      D=$(realpath $D)
      echo "~: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: explicit user"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      D=~root
      echo "~root: $D"

      D=~nonexistentuserwhodoesnotexist
      echo "~<non-existent-username>: $D"

  - name: "Tilde expansion: working dirs"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      mkdir subdir
      cd subdir

      D=~+
      echo "~+: ${D//${test_root}/TEST_ROOT}"

      D=~-
      echo "~-: ${D//${test_root}/TEST_ROOT}"

      unset OLDPWD
      D=~-
      echo "~- (without OLDPWD): ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: dir stack"
    stdin: |
      test_root=$(pwd)

      for name in a b c d e f g; do
        mkdir $name
        pushd $name >/dev/null 2>&1
      done

      D=~2
      echo "~2: ${D//${test_root}/TEST_ROOT}"

      D=~9
      echo "~9: ${D//${test_root}/TEST_ROOT}"

      D=~+2
      echo "~+2: ${D//${test_root}/TEST_ROOT}"

      D=~+9
      echo "~+9: ${D//${test_root}/TEST_ROOT}"

      D=~-2
      echo "~-2: ${D//${test_root}/TEST_ROOT}"

      D=~-9
      echo "~-9: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: after colons"
    home_dir: .
    stdin: |
      test_root=~

      D=something:~
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something":"~
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something:"~"
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something:~:another:~
      echo "D: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: unexpanded tildes"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      D="~"
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=x~
      echo "D: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: colon context sensitivity"
    env:
      HOME: /testhome
    stdin: |
      # Tilde at word start always expands (in both contexts)
      echo "echo tilde: $(echo ~)"
      var=~
      echo "assignment tilde: ${var}"

      # Tilde after colon: should NOT expand in non-assignment context
      echo "echo with colon: $(echo ~:~/bin)"
      echo ~:~/bin

      # But SHOULD expand in assignment context
      var=~:~/bin
      echo "assignment with colon: ${var}"

      # Complex PATH-like example
      PATH=/usr/bin:~:/bin:~/local
      echo "PATH: ${PATH}"

  - name: "Tilde expansion: parameter defaults"
    env:
      HOME: /testhome
    stdin: |
      echo "Use default value with tilde"
      unset myvar
      echo "Default: ${myvar:-~}"
      echo "myvar after :-: ${myvar}"

      echo "Assign default value with tilde"
      unset myvar
      echo "Assign default: ${myvar:=~}"
      echo "myvar after :=: ${myvar}"

      echo "Use default with colon-tilde"
      unset myvar2
      echo "Default colon-tilde: ${myvar2:-~:~/bin}"

      echo "Assign default with colon-tilde"
      unset myvar3
      echo "Assign colon-tilde: ${myvar3:=~:~/bin}"
      echo "myvar3 after := ${myvar3}"

  - name: "Tilde expansion: OLDPWD declared without a value"
    stdin: |
      printf "<%s>\n" ~- ~-/x

      unset OLDPWD
      declare OLDPWD
      printf "<%s>\n" ~-

      unset OLDPWD
      export OLDPWD
      printf "<%s>\n" ~-

      OLDPWD=
      printf "<%s>\n" ~-

  - name: "Tilde expansion: out-of-range dir stack index"
    stdin: |
      # A run of digits too large to fit the dir-stack index type isn't a valid
      # index, so the tilde word falls back to (failed) username lookup and is
      # left unexpanded, same as an ordinary nonexistent user.
      D=~99999999999999999999
      echo "D: $D"

      D=~-99999999999999999999
      echo "D: $D"

      D=~+99999999999999999999
      echo "D: $D"

  - name: "Tilde expansion in list"
    env:
      HOME: .
    test_files:
      - path: "file.txt"
      - path: "file.txt.bak"
    stdin: |
      echo ~/{file.txt,file.txt.bak}

  - name: "Tilde expansion: after the = of an assignment-shaped argument"
    known_failure: true # TODO(expansion): ~ after the = of an assignment-shaped argument to an ordinary command isn't expanded
    home_dir: .
    stdin: |
      test_root=~
      echo y=~/z | sed "s|${test_root}|ROOT|"
      builtin export by=~/z; echo "${by//${test_root}/ROOT}"
      command export cz=~/z; echo "${cz//${test_root}/ROOT}"

  - name: "Tilde expansion: in a pattern and its replacement"
    env:
      HOME: /home/user
    stdin: |
      h=$HOME/foo
      lit='~/foo'
      echo ${h#~} ${h##~/} ${h%~} ${lit#~}
      echo ${h/~/T} ${h//~/T} ${lit/~/T} ${h/foo/~} ${h/foo/~/bar}
      echo "${h#~} ${h/~/T} ${h/foo/~}"
      x=${h/~/T}
      echo "$x"

  - name: "Tilde expansion: none after a pattern anchor"
    env:
      HOME: /home/user
    stdin: |
      h=$HOME/foo
      lit='~/foo'
      end='foo~'
      echo ${h/#~/T} ${h/%~/T} ${lit/#~/T} ${end/%~/T}
      echo ${lit/#~\//T} ${h/#~*/T} ${lit/#~*/T}
      echo "${h/#~/T} ${lit/#~/T}"
      x=${h/#~/T}
      echo "$x"

      arr=("$h" "$lit" "$end")
      echo ${arr[@]/#~/T} ${arr[@]/%~/T} ${arr[@]/~/T}
      cd /
      plus='~+/foo'
      echo ${plus/#~+/T} ${plus/#~/T} ${PWD/#~+/T} ${PWD/~+/T}
      [[ ${lit/#~/T} == T/foo ]] && echo "in a conditional"
      case ${h/#~/T} in "$h") echo "in a case word" ;; esac

  - name: "Tilde after a colon in a word nested in an assignment's value"
    env:
      HOME: /home/user
    stdin: |
      y='a  b'
      v=${u:-x:~}; echo "[$v]"
      v=${y/b/x:~}; echo "[$v]"
      v=${y/a/~:~}; echo "[$v]"
      v=${y#a:~}; echo "[$v]"
      v=${y/a/${u:-x:~}}; echo "[$v]"

  - name: "Tilde expansion: before a character that can't end a tilde prefix"
    known_failure: true # a tilde prefix runs to the next slash or colon or to the end of the word; brush ends it at ';' too
    env:
      HOME: /home/user
    stdin: |
      var='a  b'
      echo "[${var/a/~;~}] [${var/a/~,~}] [${var/a/~ ~}] [${var/a/~x}]"
      echo [${var/a/~;~}]
      echo "[${var/a/~:~}] [${var/a/~/;}]"
