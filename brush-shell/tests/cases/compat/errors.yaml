  - name: "A loop's failing variable assignment is reported at its header"
    # Only the prefix is compared, since the messages differ.
    args: ["script.sh"]
    test_files:
      - path: "script.sh"
        contents: |
          exec 3>&2 2>err.txt
          for i in a b; do
            readonly i
          done
          for ((j = 0; j < 2; j++)); do
            readonly j
          done
          exec 2>&3
          while IFS= read -r line; do
            [[ $line =~ ^(.*: line [0-9]+): ]] && echo "${BASH_REMATCH[1]}"
          done <err.txt
