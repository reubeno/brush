    args: ["script.sh"]
    test_files:
      - path: "script.sh"
        contents: |
          exec 3>&2 2>err.txt
          trap 'echo "ERR LINENO: $LINENO" >&3
          nosuch_err; trap - ERR' ERR
          trap 'true
          nosuch_exit
          re=": (line [0-9]+):"
          while IFS= read -r line; do
            [[ $line =~ $re ]] && echo "${BASH_REMATCH[1]}" >&3
