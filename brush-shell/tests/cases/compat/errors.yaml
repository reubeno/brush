  - name: "An interactive syntax error in eval names no file"
    args: ["-i"]
    ignore_stderr: true
    stdin: |
      f() { eval 'echo )'; }
      f 2>err.txt
      re='^[^:]*: [^:]*: line [0-9]+:'
      while IFS= read -r line; do
        [[ $line == *"syntax error"* ]] || continue
        [[ $line =~ $re ]] && echo "names a file and line" || echo "names no file"
      done <err.txt
      rm err.txt

  - name: "An interactive shell's background job reports errors as the shell does"
    args: ["-i"]
    ignore_stderr: true
    stdin: |
      set +m
      nosuch_cmd 2>err.txt &
      wait
      re='^[^:]*: line [0-9]+:'
      while IFS= read -r line; do
        [[ $line =~ $re ]] && echo "names a line" || echo "names no line"
      done <err.txt
      rm err.txt

