name: "Assignments"
cases:
  - name: "First char is equals sign"
    ignore_stderr: true
    stdin: |
      =x

  - name: "Basic assignment"
    stdin: |
      x=yz
      echo "x: ${x}"

  - name: "Invalid variable name"
    ignore_stderr: true
    stdin: |
      @=something

  - name: "Quoted equals sign"
    ignore_stderr: true
    stdin: |
      x"="3

  - name: "Multiple equals signs"
    stdin: |
      x=y=z
      echo "x: ${x}"

  - name: "Assignment with tilde expansion"
    env:
      HOME: /some/dir
    stdin: |
      # Basic tilde at start (currently works)
      var=~/file1.txt
      echo "~/file1.txt: ${var}"

      # Tilde after colon in assignment (currently broken - doesn't expand second tilde)
      var=~/file1.txt:~/file2.txt
      echo "~/file1.txt:~/file2.txt: ${var}"

      # Multiple tildes after colons
      var=~:~/bin:~/local/bin
      echo "~:~/bin:~/local/bin: ${var}"

      # Mixed with regular paths
      PATH=/usr/bin:~:/bin:~/local
      echo "PATH-like: ${PATH}"

  - name: "Array assignment with tilde expansion"
    env:
      HOME: /testhome
    stdin: |
      # Array elements with tildes
      arr=(~ ~/bin ~root)
      echo "Array elements:"
      for i in "${arr[@]}"; do
        echo "  $i"
      done

      # Array elements with colon-tilde
      arr2=(~:~/bin /usr/bin:~)
      echo "Array with colons:"
      for i in "${arr2[@]}"; do
        echo "  $i"
      done

  - name: "Append assignment with tilde expansion"
    env:
      HOME: /testhome
    stdin: |
      # Basic append
      PATH=/usr/bin
      PATH+=:~
      echo "After append tilde: ${PATH}"

      # Append with colon-tilde
      PATH=/usr/bin
      PATH+=:~:~/local
      echo "After append colon-tilde: ${PATH}"

  - name: "A compound assignment after an ordinary command is a syntax error"
    known_failure: true # TODO(parser): `echo a=(1 2)` is accepted and prints `a=(1 2)`
    ignore_stderr: true
    stdin: |
      echo a=(1 2)
      echo "after: $?"

  - name: "Blanks and operator chars inside an array element assignment's subscript"
    stdin: |
      a=(0 0 0 0)
      j=0
      a[j + 1]=7
      a[ 2 ]=8
      a[j	+ 3]='q r'
      a[0 + 1]+=1
      a[1|2]+=x
      declare -p a

      declare -A m
      m[a b]=x
      m[ c ]=y
      declare -p m

      b=(1 1)
      c[b[1 + 0] + 1]=n
      c[ $((1 + 2)) ]=m
      c[$(echo 1) + 3]=o
      c[1 +
      4]=p
      declare -p c

  - name: "Subscripts with blanks in assignments wherever a command may start"
    stdin: |
      x=1 a[0 + 1]=1 b[0 + 1]=2; echo "${a[1]} ${b[1]}"
      if true; then a[1 + 1]=3; fi; echo "${a[2]}"
      true && a[1 + 2]=4; echo "${a[3]}"
      ! a[1 + 3]=5; echo "${a[4]}"
      { a[1 + 4]=6; }; echo "${a[5]}"
      ( a[1 + 5]=7; echo "${a[6]}" )
      for i in 1; do a[i + 6]=8; done; echo "${a[7]}"
      case x in x) a[1 + 7]=9;; esac; echo "${a[8]}"
      f() { a[1 + 8]=10; }; f; echo "${a[9]}"
      function g { a[1 + 9]=11; }; g; echo "${a[10]}"
      >/dev/null a[1 + 10]=12; echo "${a[11]}"

  - name: "Subscripts with blanks outside assignment position are split"
    stdin: |
      echo a[1 + 2]=3
      for w in a[1 2]; do echo "<$w>"; done
      x=(a[1 + 1] b)
      declare -p x
      (( z[1 + 1] = 3 )); declare -p z

  - name: "A command word with blanks in its subscript is one word"
    ignore_stderr: true # error wording differs
    stdin: |
      a[1 2]
      echo "status: $?"

  - name: "Unterminated subscript in an assignment"
    ignore_stderr: true # error wording differs
    stdin: |
      a[1 2
