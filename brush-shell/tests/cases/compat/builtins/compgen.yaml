name: "Builtins: compgen"
cases:
  - name: "compgen -A alias"
    stdin: |
      alias myalias="ls"
      alias myalias2="echo hi"

      compgen -A alias myalias

  - name: "compgen -A alias is sorted by name"
    stdin: |
      alias e=5
      alias c=3
      alias a=1
      alias f=6
      alias d=4
      alias b=2

      compgen -A alias

  - name: "compgen -A binding"
    stdin: |
      compgen -A binding tab | sort

  - name: "compgen -A builtin"
    stdin: |
      compgen -A builtin cd | sort

  - name: "compgen -A directory"
    stdin: |
      touch somefile
      mkdir somedir
      mkdir somedir2

      compgen -A directory some | sort

  - name: "compgen -A file"
    stdin: |
      touch somefile
      mkdir somedir
      mkdir somedir2

      compgen -A file some | sort

  - name: "compgen -A file with dot files"
    stdin: |
      touch .file
      mkdir .dir

      echo "[without dotglob]"
      shopt -u dotglob
      compgen -A file | sort

      echo "[with dotglob]"
      shopt -s dotglob
      compgen -A file | sort

  - name: "compgen -A function"
    stdin: |
      myfunc() {
        echo hi
      }

      myfunc2() {
        echo hello
      }

      compgen -A function myfunc

  - name: "compgen -A function is sorted by name"
    stdin: |
      e() { :; }
      c() { :; }
      a() { :; }
      f() { :; }
      d() { :; }
      b() { :; }

      compgen -A function

  - name: "compgen -A function only returns functions matching the prefix"
    stdin: |
      zzfa() { :; }
      zzfb() { :; }
      totally_unrelated() { :; }

      compgen -A function zzf
      echo "[$?]"
      compgen -A function nomatch
      echo "[$?]"

  - name: "compgen -A command is sorted by name"
    stdin: |
      zzfe() { :; }
      zzfc() { :; }
      zzfa() { :; }

      compgen -A command zzf

  - name: "compgen -A command only returns functions matching the prefix"
    stdin: |
      zzfa() { :; }
      zzfb() { :; }
      totally_unrelated() { :; }

      compgen -A command zzf

  - name: "compgen -A keyword"
    stdin: |
      compgen -A keyword esa | sort

  - name: "compgen -A variable"
    stdin: |
      declare myvar=10
      declare myvar2=11

      compgen -A variable myvar | sort

  - name: "compgen -W"
    stdin: |
      echo "1. Basic compgen -W"
      compgen -W "one two three" -- t | sort
      echo "2. compgen -W with expansion"
      myvar=value compgen -W '${myvar}'

  - name: "compgen -W splits before expanding each word"
    stdin: |
      echo "[brace words after default splitting]"
      compgen -W '{a,b} c'

      echo "[IFS separator breaks brace syntax]"
      IFS=,
      compgen -W 'x{1,2}'

      echo "[empty list fields are removed]"
      IFS=:
      compgen -W 'a::b'

  - name: "compgen -W does not pathname-expand"
    stdin: |
      touch foo.txt bar.txt baz.log

      echo "[glob pattern should be literal]"
      compgen -W '*.txt' | sort

      echo "[question mark glob should be literal]"
      compgen -W '?.log' | sort

  - name: "compgen -W with unsorted values"
    stdin: |
      compgen -W 'c b d a'

  - name: "compgen -W with options"
    stdin: |
      compgen -W '--abc --def' -- '--ab'

  - name: "compgen with no matches"
    stdin: |
      compgen -W yes no && echo "1. Result"

  - name: "compgen -f with tilde"
    home_dir: testhome # relative to default working dir
    stdin: |
      mkdir testhome && cd testhome

      echo "HOME base: $(basename $HOME)"
      echo "~ base:" $(basename ~)

      touch item1

      echo "[0]"
      for p in $(compgen -f ~); do
        echo ${p//$HOME/HOME}
      done

      echo "[1]"
      for p in $(compgen -f ~/); do
        echo ${p//$HOME/HOME}
      done

  - name: "compgen -f with quoted tilde"
    home_dir: . # Not HOME=...: macOS (Homebrew) bash expands ~ from the environment's HOME.
    stdin: |
      touch item1

      echo "[0]"
      for p in $(compgen -f '~/'); do
        echo ${p//$HOME/HOME}
      done

  - name: "compgen -f with quoted var"
    min_oracle_version: 5.3 # bash 5.2 doesn't complete after a quoted variable
    stdin: |
      touch item1
      HOME=$(pwd)

      echo "[0]"
      for p in $(compgen -f '$HOME/'); do
        echo ${p//$HOME/HOME}
      done

  - name: "compgen -f with quoted + escaped var"
    stdin: |
      touch item1
      HOME=$(pwd)

      echo "[0]"
      for p in $(compgen -f '\$HOME/'); do
        echo ${p//$HOME/HOME}
      done

  - name: "compgen with interesting hyphens"
    stdin: |
      compgen -P-before -S-after -W "one two three" -- t | sort

  - name: "compgen -X"
    stdin: |
      echo "[Take 1]"
      compgen -W 'foo bar' -X 'foo' ''

      echo "[Take 2]"
      compgen -W 'foo bar' -X 'f*' ''

      echo "[Take 3]"
      compgen -W '&1 foo' -X '\&*' ''

  - name: "compgen -X with replacement"
    stdin: |
      echo "[Take 1]"
      compgen -W 'somebody something' -X '&b*' some

  - name: "compgen -X with extglob"
    stdin: |
      touch README
      shopt -s extglob

      echo "[Take 1]"
      compgen -f READ

      echo "[Take 2]"
      compgen -f -X "READ" READ

      echo "[Take 3]"
      compgen -f -X "README" READ

      echo "[Take 4]"
      compgen -f -X "!(READ)" READ

      echo "[Take 5]"
      compgen -f -X "!(README)" READ

      echo "[Take 6]"
      compgen -f -X "!!(READ)" READ

      echo "[Take 7]"
      compgen -f -X "!!(README)" READ

  - name: "compgen -o dirnames"
    stdin: |
      echo "[Take 1]"
      compgen -W 'completion' -o dirnames -- c | sort

      echo "[Take 2]"
      mkdir subdir
      touch subfile
      compgen -W 'completion' -o dirnames -- s | sort

      echo "[Take 3]"
      mkdir cdir cdir2
      touch cfile
      compgen -W 'completion' -o dirnames -- c | sort

      echo "[Take 4]"
      compgen -W 'nomatch' -o dirnames -- c | sort

      echo "[Take 5]"
      compgen -o dirnames -- c | sort

      echo "[Take 6]"
      compgen -W 'completion' -o dirnames -o plusdirs -- c | sort

  - name: "compgen -o default"
    stdin: |
      echo "[Take 1]"
      compgen -W 'completion' -o default -- c | sort

      echo "[Take 2]"
      mkdir subdir
      touch subfile
      compgen -W 'completion' -o default -- s | sort

  - name: "compgen -o bashdefault"
    stdin: |
      echo "[Take 1]"
      compgen -W 'completion' -o bashdefault -- c | sort

      echo "[Take 2]"
      mkdir subdir
      touch subfile
      compgen -W 'completion' -o bashdefault -- s | sort

  - name: "compgen -o plusdirs"
    stdin: |
      echo "[Take 1]"
      touch cfile
      mkdir cdir
      compgen -W 'completion' -o plusdirs -o default -S suffix -- c | sort

  - name: "compgen -A command"
    # Temporarily marked unconstrained Path case as `skip: true` to keep CI stable.
    # Environment-dependent due to host PATH contents(Ubuntu includes X11, while Arch and others do not).
    skip: true
    stdin: |
      compgen -A command | sort | grep -v "^brush"

  - name: "compgen -A command in a constrained PATH"
    stdin: |
      SORT=$(command -v sort)
      GREP=$(command -v grep)
      PATH=$(pwd)
      compgen -A command | $SORT | $GREP -v "^brush"

  - name: "compgen -A command builtins in a constrained PATH"
    stdin: |
      SORT=$(command -v sort)
      PATH=$(pwd)
      compgen -A command cd | $SORT

  - name: "compgen -A command keywords in a constrained PATH"
    stdin: |
      SORT=$(command -v sort)
      PATH=$(pwd)
      compgen -A command [ | $SORT

  - name: "compgen -A command function in a constrained PATH"
    stdin: |
      SORT=$(command -v sort)
      PATH=$(pwd)
      myfunc() {
        echo hi
      }
      myfunc2() {
        echo hello
      }
      compgen -A command myfunc | $SORT

  - name: "compgen -A command with executable symlink"
    stdin: |
      #             pwd
      #  drwxr-xr-x ├──  test-bin
      # .rwxr-xr-x  │   ├──  dummy_exe
      # .rw-r--r--  │   └──  dummy_non_exe
      # drwxr-xr-x  └──  test-links
      # lrwxrwxrwx      ├──  link_valid         ⇒ $(pwd)/test-bin/dummy_exe
      # lrwxrwxrwx      └──  link_valid_exe_rec ⇒ $(pwd)/test-links/link_valid
      # lrwxrwxrwx      ├──  link_non_exec      ⇒ $(pwd)/test-bin/dummy_non_exe
      # lrwxrwxrwx      ├──  link_broken        ⇒ $(pwd)/test-bin/dummy_non_exist
      #
      mkdir test-bin
      touch test-bin/dummy_exe
      touch test-bin/dummy_non_exe
      chmod +x test-bin/dummy_exe

      mkdir test-links
      ln -s $(pwd)/test-bin/dummy_exe       $(pwd)/test-links/link_valid
      ln -s $(pwd)/test-links/link_vaild    $(pwd)/test-links/link_valid_rec
      ln -s $(pwd)/test-bin/dummy_non_exe   $(pwd)/test-links/link_non_exec
      ln -s $(pwd)/test-bin/dummy_non_exist $(pwd)/test-links/link_broken

      PATH="$(pwd)/test-links:$PATH"

      echo "[Valid]"
      compgen -A command -- link_valid | sort

      echo "[Invalid]"
      compgen -A command -- link_non_exec
      compgen -A command -- link_broken

  - name: "compgen -A command includes aliases but not disabled builtins, in order"
    stdin: |
      mkdir test-bin
      touch test-bin/zzqx
      chmod +x test-bin/zzqx
      PATH="$(pwd)/test-bin:$PATH"
      alias zzqc=1 zzqa=1
      zzqf() { :; }
      zzqb() { :; }
      enable -n caller
      compgen -A command zzq
      echo "[disabled]"
      compgen -A command caller

  - name: "compgen -F ignores a function that asks for completion to restart"
    ignore_stderr: true
    stdin: |
      _comp() { COMPREPLY=(a); return 124; }
      compgen -F _comp mycmd
      echo "rc=$?"

  - name: "compgen -F tells the function about an empty line"
    ignore_stderr: true
    stdin: |
      _comp() {
        echo "#=$# 1=<$1> 2=<$2> 3=<$3> LINE=<$COMP_LINE> POINT=<$COMP_POINT>"
        echo "WORDS=<${COMP_WORDS[*]}> NWORDS=${#COMP_WORDS[@]} CWORD=<$COMP_CWORD>"
      }
      compgen -F _comp xy

  - name: "compgen -C tells the command about an empty line"
    ignore_stderr: true
    stdin: |
      compgen -C 'printf "<%s>\n"' xy
      _cmd() { echo "LINE=<$COMP_LINE> POINT=<$COMP_POINT> #=$#"; }
      export -f _cmd
      compgen -C _cmd xy

  - name: "compgen -F sets COMP_KEY and COMP_TYPE to 0"
    ignore_stderr: true
    stdin: |
      _comp() { echo "KEY=${COMP_KEY:-unset} TYPE=${COMP_TYPE:-unset}"; COMPREPLY=(); }
      compgen -F _comp mycmd

  - name: "compgen dequotes the word for list actions"
    stdin: |
      alias myalias=1
      myfunc() { :; }
      export MYEXPORT=1
      declare -a MYARRAY=(1)
      compgen -a '"myal'
      compgen -b '"ec'
      compgen -v '"MYEXP'
      compgen -v 'MYEX\P'
      compgen -e '"MYEXP'
      compgen -A function '"myf'
      compgen -A arrayvar '"MYARR'
      compgen -A signal '"SIGHU'
      compgen -A shopt '"extgl'
      compgen -A setopt '"errex'
      compgen -k '"whil'
      compgen -A helptopic '"ec'

  - name: "compgen dequotes the word for matching like bash"
    # bash dequotes the word as if a leading quote were already open, so that
    # quote closes and a quote char after it opens a new quote.
    stdin: |
      abc=1
      echo "[$(compgen -W "ab\\' abx" -- "'a\"b'")]"
      echo "[$(compgen -v -- "'a\"b'")]"
      echo "[$(compgen -W "a\\\\b ab" -- "'a\\b'")]"
      echo "[$(compgen -W "a\\\\b ab" -- "\"a\\\\")]"

  - name: "compgen -A helptopic includes keywords"
    known_failure: true # brush's help topics are only its builtins
    stdin: |
      compgen -A helptopic whil

  - name: "compgen does not dequote the word for commands"
    stdin: |
      echo "[$(compgen -c '"ech')]"
      echo "[$(compgen -c 'ec\h')]"

  - name: "compgen -f outside completion does not dequote the word"
    stdin: |
      touch item1
      echo "[$(compgen -f '"ite')]"
      echo "[$(compgen -f 'ite\m')]"
      echo "[$(compgen -d '"ite')]"

  - name: "compgen -f and -d do not expand a bare tilde"
    stdin: |
      mkdir h h2
      HOME=$PWD/h
      compgen -f '~'; echo "rc=$?"
      compgen -d '~'; echo "rc=$?"

  - name: "compgen -W closes a quote left open at the end of the list"
    stdin: |
      compgen -W 'fo"o'; echo "rc=$?"
      compgen -W 'fo"o bar'; echo "rc=$?"
      compgen -W 'fo"o bar' -- f; echo "rc=$?"
      compgen -W "a 'b c"; echo "rc=$?"

  - name: "compgen -f keeps the directory part as typed"
    min_oracle_version: 5.3 # bash 5.2 doesn't complete after a variable or escaped space
    home_dir: h # Not HOME=...: macOS (Homebrew) bash expands ~ from the environment's HOME.
    stdin: |
      mkdir -p h/"Docs dir" "dir with space"
      touch "dir with space/item"
      compgen -f '~/Do' | sed "s|^$HOME|H|"
      compgen -f '$HOME/Do' | sed "s|^$HOME|H|"
      compgen -f 'dir\ with\ space/i'

  - name: "compgen -f with direxpand expands parameters in the directory part"
    home_dir: h # Not HOME=...: macOS (Homebrew) bash expands ~ from the environment's HOME.
    stdin: |
      mkdir -p h/"Docs dir"
      shopt -s direxpand
      compgen -f '$HOME/Do' | sed "s|^$HOME|H|"
      compgen -f '~/Do' | sed "s|^$HOME|H|"
