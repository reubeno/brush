name: "Builtins: umask"
cases:
  - name: "umask with an out-of-range mode fails with status 1"
    ignore_stderr: true
    stdin: |
      umask 999
      echo "umask: $?"

  - name: "umask refuses a mode that isn't octal or is past 07777, and keeps the old mask"
    stdin: |
      strip() { sed -E 's/\x1b\[[0-9;]*m//g; s/^[^ ]*: line [0-9]+: //; s/^error: //'; }
      umask 022
      for mode in 8 0778 9a 010000; do
        umask "$mode" 2>err.txt; echo "$mode: $?"
        strip <err.txt
      done
      umask
      umask 07777; echo "07777: $?"
      umask
      umask 1000; echo "1000: $?"
      umask
      rm err.txt

  - name: "umask in a subshell stays there"
    known_failure: true # TODO(umask): a subshell runs in the shell's own process, so its umask is the shell's
    stdin: |
      umask 022
      ( umask 077 )
      echo "after a subshell: $(umask)"
      umask 077 | true
      echo "after a pipeline stage: $(umask)"

  - name: "umask -S, -p and --"
    stdin: |
      umask 022
      umask -S
      umask -p
      umask -- 077
      umask

  - name: "umask -p -S prints a reusable symbolic command"
    known_failure: true # TODO(umask): prints `umask u=...`, without `-S`
    stdin: |
      umask 022
      umask -p -S

  - name: "umask takes a symbolic mode"
    stdin: |
      umask 022
      umask u=rwx,g=rx,o=; umask
      umask g-r; umask
      umask g-w,o-rwx; umask
      umask a=; umask
      umask =rwx; umask
      umask g=u; umask
      umask ug=o-w; umask
      umask u=+r; umask
      umask +w; umask
      umask 027; umask g=,o=g; umask
      umask 027; umask u=g,g=u; umask
      umask 027; umask o=ug; umask
      umask 022; umask u=ug; umask
      umask 027; umask o=gr-r; umask

  - name: "umask refuses an invalid symbolic mode and keeps the old mask"
    stdin: |
      strip() { sed -E 's/\x1b\[[0-9;]*m//g; s/^[^ ]*: line [0-9]+: //; s/^error: //'; }
      umask 022
      for mode in z+r u+q 'g+w,z+r' u+rz; do
        umask "$mode" 2>err.txt; echo "$mode: $?"
        strip <err.txt
      done
      umask
      rm err.txt

  - name: "umask refuses a symbolic mode missing an operator"
    ignore_stderr: true
    stdin: |
      umask 022
      for mode in u 'u+r,' ''; do
        umask "$mode"; echo "$mode: $?"
      done
      umask
