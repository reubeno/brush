name: "Builtins: wait"
cases:
  - name: "wait for specific failed PID"
    known_failure: true # TODO(jobs): wait should return job's exit status
    stdin: |
      (exit 5) &
      pid=$!
      wait $pid
      echo "status: $?"

  - name: "wait for successful PID"
    stdin: |
      (exit 0) &
      pid=$!
      wait $pid
      echo "status: $?"

  - name: "wait in conditional for failed PID"
    known_failure: true # TODO(jobs): wait should return job's exit status
    stdin: |
      (exit 5) &
      pid=$!
      if wait $pid; then
        echo "then"
      else
        echo "else"
      fi

  - name: "wait with no arguments"
    stdin: |
      (exit 0) &
      (exit 0) &
      wait
      echo "after wait all"

  - name: "wait -n not implemented"
    known_failure: true # TODO(builtins): wait -n not implemented
    stdin: |
      (exit 0) &
      (exit 5) &
      wait -n
      echo "first done, status: $?"
      wait -n
      echo "second done, status: $?"

  - name: "Background job failure with wait"
    known_failure: true # TODO(jobs): wait should return job's exit status
    stdin: |
      { sleep 0.01; exit 3; } &
      pid=$!
      wait $pid
      echo "status: $?"

  - name: "wait %job returns the job's status"
    known_failure: true # TODO(wait): wait %1 returns 0, not the job's status
    ignore_stderr: true # brush also prints "[1]+Done" for the job; see the next case
    stdin: |
      set -m
      { sleep 0.2; exit 3; } &
      wait %1
      echo "status: $?"

  - name: "wait %job for a job that already finished"
    known_failure: true # TODO(jobs): brush prints "[1]+Done" for a finished job and drops it before wait sees it
    stdin: |
      set -m
      (exit 3) &
      sleep 0.1
      wait %1
      echo "status: $?"

  - name: "wait for a job that doesn't exist fails with status 127"
    known_failure: true # TODO(wait): wait with job specs not implemented
    ignore_stderr: true
    stdin: |
      wait %9
      echo "wait %9: $?"
      wait -n
      echo "wait -n: $?"
