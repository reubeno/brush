name: "Builtins: times"
cases:
  - name: "Basic usage"
    ignore_stdout: true
    stdin: |
      times

  - name: "times ignores its arguments"
    known_failure: true # TODO(times): brush rejects arguments
    ignore_stderr: true
    stdin: |
      times x >/dev/null
      echo "times: $?"

  - name: "times rejects an option"
    ignore_stderr: true
    stdin: |
      times -x >/dev/null
      echo "times: $?"
