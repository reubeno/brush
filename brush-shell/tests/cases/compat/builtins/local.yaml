name: "Builtins: local"
cases:
  - name: "Basic local usage"
    stdin: |
      myfunc() {
        local x=10
        echo "in myfunc: x==$x"
      }
      x=5
      echo "before call: x==$x"
      myfunc
      echo "after call: x==$x"

  - name: "Local with empty array"
    stdin: |
      myfunc() {
        local x=()
        declare -p x
        echo "x[0]: ${x[0]}"
      }
      myfunc

  - name: "Multiple local operands expand before assignments are applied"
    stdin: |
      myfunc() {
        unset first second
        local first=one second=$first
        declare -p first second
      }
      myfunc
