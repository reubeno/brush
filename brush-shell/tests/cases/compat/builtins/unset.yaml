name: "Builtins: unset"
cases:
  - name: "Basic unset usage"
    stdin: |
      var=value
      unset var
      echo "var: ${var}"

  - name: "Unset multiple variables"
    stdin: |
      var1=value1
      var2=value2
      unset var1 var2
      echo "var1: ${var1}, var2: ${var2}"

  - name: "Unset function"
    ignore_stderr: true
    stdin: |
      function myfunc() {
        echo "Hello, world!"
      }
      unset myfunc
      myfunc

  - name: "Unset -f function"
    ignore_stderr: true
    stdin: |
      function myfunc() {
        echo "Hello, world!"
      }
      unset -f myfunc
      myfunc

  - name: "Unset indexed array element"
    stdin: |
      declare -a myarray=(a b c)

      unset myarray[0]
      declare -p myarray

      unset myarray[3]
      declare -p myarray

      unset myarray[2]
      declare -p myarray

      unset myarray[1]
      declare -p myarray

  - name: "Unset associative array element"
    stdin: |
      echo "[1]"

      declare -A myarray=([key]=value)

      unset myarray[key]
      declare -p myarray

      echo "[2]"

      declare -A myarray=([key]=value)

      unset "myarray[key]"
      declare -p myarray

      echo "[3]"

      declare -A myarray=([key]=value)
      key="x:y:z"

      unset "myarray[key]"
      declare -p myarray

  - name: "Unset array element with interesting expression"
    stdin: |
      declare -a myarray=(a b c d e)

      echo "Initial array:"
      declare -p myarray
      echo

      i=4
      unset myarray[i]
      echo "After removing element at index 4:"
      declare -p myarray
      echo

      unset myarray[6/2]
      echo "After removing element at index 3:"
      declare -p myarray
      echo

  - name: "Unset array element with negative index"
    stdin: |
      declare -a myarray=(a b c d e)

      echo "Initial array:"
      declare -p myarray
      echo

      unset "myarray[-1]"
      echo "After removing last element (index -1):"
      declare -p myarray
      echo

      unset "myarray[-1]"
      echo "After removing new last element (index -1 again):"
      declare -p myarray
      echo

      unset "myarray[-2]"
      echo "After removing second-to-last element (index -2):"
      declare -p myarray
      echo

  - name: "Unset array element with negative index out of bounds"
    ignore_stderr: true
    stdin: |
      declare -a myarray=(a b c)

      echo "Initial array:"
      declare -p myarray
      echo

      unset "myarray[-4]"
      echo "After attempting to remove with index -4 (out of bounds):"
      declare -p myarray
      echo "Return code: $?"

  - name: "Unset array element with variable negative index"
    stdin: |
      declare -a myarray=(10 20 30 40 50)

      echo "Initial array:"
      declare -p myarray
      echo

      i=-1
      unset "myarray[i]"
      echo "After removing with variable index i=-1:"
      declare -p myarray
      echo

      i=-2
      unset "myarray[i]"
      echo "After removing with variable index i=-2:"
      declare -p myarray
      echo

  - name: "Unset local in same function"
    stdin: |
      var="global"

      myfunc() {
        echo "In myfunc"
        local -i var="10"
        declare -p var
        unset var
        echo "After unset"
        declare -p var
        var="20"
      }

      echo "Before call: var=${var}"
      myfunc
      echo "After call: var=${var}"

  - name: "Unset locals in callers"
    stdin: |
      firstfunc() {
        local var="first"
        echo "entered firstfunc: var=${var}"
        secondfunc
        echo "leaving firstfunc: var=${var}"
      }

      secondfunc() {
        local var="second"
        echo "entered secondfunc: var=${var}"
        thirdfunc
        echo "leaving secondfunc: var=${var}"
      }

      thirdfunc() {
        echo "entered thirdfunc: var=${var}"
        unset -v var
        echo "after first unset: var=${var}"
        var+=":updated"
        echo "   ...and updated: var=${var}"
        unset -v var
        echo "after second unset: var=${var}"
        var+=":updated"
        echo "   ...and updated: var=${var}"
        unset -v var
        echo "after third unset: var=${var}"
        var+=":updated"
        echo "   ...and updated: var=${var}"
        echo "leaving firstfunc: var=${var}"
      }

      var="global"
      echo "before calls: var=${var}"
      firstfunc
      echo "after calls: var=${var}"

  - name: "Unset with nameref"
    known_failure: true
    stdin: |
      declare -n ref=var
      var="value"

      echo "[Before unset]"
      echo "ref: ${ref}"
      echo "var: ${var}"

      unset ref

      echo "[After unset]"
      echo "ref: ${ref}"
      echo "var: ${var}"

  - name: "Unset -n removes nameref itself"
    known_failure: true
    stdin: |
      target="value"
      declare -n ref=target
      echo "before: target=$target ref=$ref"
      unset -n ref
      echo "after unset -n: target=$target"
      declare -p ref 2>/dev/null || echo "ref is gone"
      declare -p target 2>/dev/null && echo "target still declared"

  - name: "Unset array element through nameref"
    known_failure: true
    stdin: |
      target=(a b c d e)
      declare -n ref=target
      unset 'ref[2]'
      declare -p target
      unset 'ref[0]'
      declare -p target

  - name: "Unset odd function names"
    stdin: |
      echo "[Checking existing]"
      type [

      echo "[Defining function]"
      function [() {
        :
      }

      echo "[Checking defined]"
      type [

      echo "[Unsetting function]"
      unset [
      echo "unset result: $?"

      echo "[Checking after unset]"
      type [

  #
  # A readonly variable refuses to be unset. The failure is reported and fails the builtin's
  # status, but the remaining names are still processed. The diagnostic is pinned through a
  # pipeline, where it carries no line prefix.
  #
  - name: "unset refuses a readonly variable and continues with the rest"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      readonly zz_ro=1
      zz_other=2
      { unset zz_ro zz_other; } 2>&1 | strip
      unset zz_ro zz_other 2>/dev/null
      echo "status: $?"
      declare -p zz_ro
      declare -p zz_other 2>/dev/null
      echo "other_status: $?"

  - name: "unset refuses an element of a readonly array"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      # One key only: bash and brush enumerate an associative array in different orders.
      declare -A zz_m=([k]=1)
      readonly zz_m
      { unset 'zz_m[k]'; } 2>&1 | strip
      unset 'zz_m[k]' 2>/dev/null
      echo "status: $?"
      declare -p zz_m
      declare -a zz_a=(1 2)
      readonly zz_a
      { unset 'zz_a[0]'; } 2>&1 | strip
      unset 'zz_a[0]' 2>/dev/null
      echo "status: $?"
      declare -p zz_a

  #
  # An element operand's subscript is resolved the way every other subscript is: arithmetically
  # for an indexed array (so a blank one is element 0), literally for an associative one -- after
  # one round of word expansion in both cases.
  #
  - name: "unset resolves an element subscript against the array's kind"
    stdin: |
      declare -a zz_a=(1 2 3)
      i=1
      unset 'zz_a[i]'
      declare -p zz_a
      declare -a zz_b=(1 2 3)
      unset 'zz_b[1+1]'
      declare -p zz_b
      declare -a zz_c=(1 2 3)
      j=2
      unset 'zz_c[$j]'
      declare -p zz_c

  - name: "unset does not evaluate an associative key arithmetically"
    stdin: |
      declare -A zz_m
      zz_m[1+1]=literal
      zz_m[2]=numeric
      unset 'zz_m[1+1]'
      declare -p zz_m

  - name: "unset expands an associative key once"
    stdin: |
      declare -A zz_m
      zz_m[k]=v
      k=k
      unset 'zz_m[$k]'
      declare -p zz_m
      echo "status: $?"

  #
  # A subscript no element can have is not an error: an empty one names nothing and is quietly
  # ignored, while `*` and `@` name every element of an indexed array (clearing it, but leaving it
  # declared) and -- a shell quirk -- nothing at all in an associative one.
  #
  - name: "unset with an empty subscript does nothing"
    stdin: |
      declare -a zz_a=(1 2 3)
      unset 'zz_a[]'
      echo "status: $?"
      declare -p zz_a
      declare -A zz_m=([k]=v)
      unset 'zz_m[]'
      echo "status: $?"
      declare -p zz_m

  - name: "unset with a star or at subscript clears an indexed array"
    stdin: |
      declare -a zz_a=(1 2 3)
      unset 'zz_a[*]'
      echo "status: $?"
      declare -p zz_a
      declare -a zz_b=(1 2 3)
      unset 'zz_b[@]'
      echo "status: $?"
      declare -p zz_b

  - name: "unset with a star or at subscript leaves an associative array alone"
    stdin: |
      declare -A zz_m=([k]=v)
      unset 'zz_m[*]'
      echo "status: $?"
      declare -p zz_m
      unset 'zz_m[@]'
      echo "status: $?"
      declare -p zz_m

  - name: "unset with a star or at subscript removes that key from an associative array"
    # `*` and `@` clear an indexed array, but an associative array can hold them as ordinary
    # keys, so there they name one element like any other key.
    stdin: |
      declare -A zz_m=(['*']=star [k]=v)
      echo "before: ${#zz_m[@]}"
      unset 'zz_m[*]'
      echo "status: $?"
      declare -p zz_m
      declare -A zz_n=(['@']=at [k]=v)
      unset 'zz_n[@]'
      echo "status: $?"
      echo "after: ${#zz_n[@]} ${zz_n[k]}"

  - name: "unset refuses every element subscript of a readonly array"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      declare -a zz_a=(1 2)
      readonly zz_a
      { unset 'zz_a[*]'; } 2>&1 | strip
      unset 'zz_a[*]' 2>/dev/null
      echo "star: $?"
      { unset 'zz_a[]'; } 2>&1 | strip
      unset 'zz_a[]' 2>/dev/null
      echo "empty: $?"
      declare -p zz_a
