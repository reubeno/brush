name: "Builtins: eval"
cases:
  - name: "Basic eval usage"
    stdin: |
      eval 'echo 1 + 1 == $((1 + 1))'

  - name: "eval with return in function"
    stdin: |
      f() {
        eval 'return 42'
        echo "Should not reach here"
      }
      f
      echo "Exit code: $?"

  - name: "eval with exit"
    stdin: |
      eval 'exit 42'
      echo "After eval'd exit"

  - name: "eval with break in loop"
    stdin: |
      for i in 1 2 3; do
        eval 'break'
        echo "After eval'd break"
      done
      echo "After loop"

  - name: "eval with continue in loop"
    stdin: |
      for i in 1 2 3; do
        echo "Iteration $i"
        eval 'continue'
        echo "After eval'd continue"
      done
      echo "After loop"

  - name: "eval with nested break levels"
    stdin: |
      for i in 1 2; do
        for j in a b c; do
          eval 'break 2'
          echo "After eval'd break (inner loop)"
        done
        echo "After eval'd break (outer loop)"
      done
      echo "After outer loop"

  - name: "Eval of code with syntax error"
    known_failure: true # TODO(eval): a tokenizer error in eval'd code aborts the script instead of returning 2
    ignore_stderr: true
    stdin: |
      eval 'echo "a'
      echo "rc=$?"

  - name: "eval with a syntax error returns 2"
    known_failure: true # TODO(eval): a syntax error in eval's input ends a brush script
    ignore_stderr: true
    stdin: |
      eval 'if'
      echo "after eval: $?"

  - name: "eval with an unset variable under set -u ends the shell"
    ignore_stderr: true
    stdin: |
      set -u
      eval 'echo $nope'; echo "rc=$?"
      echo next

  - name: "eval with ${x?} on an unset variable ends the shell"
    ignore_stderr: true
    stdin: |
      eval 'echo ${nope?boom}'; echo "rc=$?"
      echo next

  - name: "command eval with an unset variable under set -u ends the shell"
    ignore_stderr: true
    stdin: |
      set -u
      command eval 'echo $nope'; echo "rc=$?"
      echo next

  - name: "builtin eval with an unset variable under set -u ends the shell"
    ignore_stderr: true
    stdin: |
      set -u
      builtin eval 'echo $nope'; echo "rc=$?"
      echo next

  - name: "eval dynamic function definition"
    stdin: |
      fname="myfunc"
      eval "${fname}() { echo \"hello from ${fname}\"; }"
      myfunc

  - name: "eval dynamic function with args"
    stdin: |
      fname="greet"
      eval "${fname}() { echo \"hello \$1\"; }"
      greet world

  - name: "eval EXPORT_FUNCTIONS pattern"
    stdin: |
      ECLASS="python"

      python_src_compile() { echo "python compile: $@"; }
      python_src_install() { echo "python install: $@"; }

      EXPORT_FUNCTIONS() {
        local __phase
        for __phase in "$@"; do
          eval "${__phase}() { ${ECLASS}_${__phase} \"\$@\"; }"
        done
      }

      EXPORT_FUNCTIONS src_compile src_install
      src_compile arg1 arg2
      src_install arg1

  - name: "eval with nested quoting"
    stdin: |
      x="hello world"
      eval "echo \"the value is: '$x'\""

  - name: "eval variable indirection"
    stdin: |
      var_name="MY_VAR"
      eval "${var_name}='some value'"
      echo "$MY_VAR"

  - name: "eval with command substitution"
    stdin: |
      eval "result=\$(echo computed)"
      echo "$result"

  - name: "eval building array"
    stdin: |
      eval "arr=(one two three)"
      echo "${#arr[@]}"
      echo "${arr[1]}"

  - name: "eval multiple statements"
    stdin: |
      eval 'x=1; y=2; echo $((x + y))'

  - name: "eval preserves exit code"
    stdin: |
      eval 'false'
      echo "exit: $?"
      eval 'true'
      echo "exit: $?"

  - name: "eval with heredoc"
    stdin: |
      eval "$(cat <<'EOF'
      myfunc() {
        echo "defined via heredoc eval"
      }
      EOF
      )"
      myfunc

