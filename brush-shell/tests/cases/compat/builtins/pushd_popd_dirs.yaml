name: "Builtins: pushd/popd/dirs"
incompatible_configs: ["sh"]
cases:
  - name: "Basic pushd usage"
    stdin: |
      cd /
      pushd /
      echo $?
      echo $PWD
      pushd /usr
      dirs
      echo $?
      echo $PWD
      popd
      echo $?
      echo $PWD
      popd
      echo $?

  - name: "pushd without dir change"
    stdin: |
      cd /
      pushd -n /usr
      dirs

  - name: "popd without dir change"
    stdin: |
      cd /
      pushd /
      pushd /usr
      popd -n
      dirs

  - name: "popd with empty stack"
    ignore_stderr: true
    stdin: popd

  - name: "pushd to non-existent dir"
    ignore_stderr: true
    stdin: pushd /non-existent-dir

  - name: "basic dirs usage"
    stdin: |
      cd /
      dirs

  - name: "dirs with tilde replacement"
    env:
      HOME: /usr
    stdin: |
      echo "HOME: $HOME"

      cd ~
      echo "New PWD: $PWD"

      dirs
      dirs -l

  - name: "dirs to clear"
    stdin: |
      cd /usr
      pushd /usr
      pushd /
      dirs -c
      dirs

  - name: "Directory stack errors fail with status 1"
    known_failure: true # TODO(dirs): brush treats them as usage errors, status 2
    ignore_stderr: true
    stdin: |
      pushd
      echo "pushd: $?"
      dirs +9
      echo "dirs: $?"

  - name: "pushd and popd succeed when the stack listing can't be written"
    known_failure: true # TODO(dirs): a failed write of the listing fails pushd and popd
    incompatible_platforms: ["macos"] # no /dev/full
    ignore_stderr: true # the write error's wording is tracked separately
    stdin: |
      cd /
      pushd /tmp >/dev/full; echo "pushd rc=$?"
      popd >/dev/full; echo "popd rc=$?"
