name: "Builtins: pushd/popd/dirs"
incompatible_configs: ["sh"]
cases:
  - name: "Basic pushd usage"
    stdin: |
      cd /
      pushd /
      echo $?
      echo $PWD
      pushd /usr
      dirs
      echo $?
      echo $PWD
      popd
      echo $?
      echo $PWD
      popd
      echo $?

  - name: "pushd without dir change"
    stdin: |
      cd /
      pushd -n /usr
      dirs

  - name: "popd without dir change"
    stdin: |
      cd /
      pushd /
      pushd /usr
      popd -n
      dirs

  - name: "popd with empty stack"
    ignore_stderr: true
    stdin: popd

  - name: "pushd to non-existent dir"
    ignore_stderr: true
    stdin: pushd /non-existent-dir

  - name: "basic dirs usage"
    stdin: |
      cd /
      dirs

  - name: "dirs with tilde replacement"
    env:
      HOME: /usr
    stdin: |
      echo "HOME: $HOME"

      cd ~
      echo "New PWD: $PWD"

      dirs
      dirs -l

  - name: "dirs to clear"
    stdin: |
      cd /usr
      pushd /usr
      pushd /
      dirs -c
      dirs

  - name: "Directory stack errors fail with status 1"
    known_failure: true # TODO(dirs): brush treats them as usage errors, status 2
    ignore_stderr: true
    stdin: |
      pushd
      echo "pushd: $?"
      dirs +9
      echo "dirs: $?"

  - name: "pushd and popd succeed when the stack listing can't be written"
    known_failure: true # TODO(dirs): a failed write of the listing fails pushd and popd
    incompatible_platforms: ["macos"] # no /dev/full
    ignore_stderr: true # the write error's wording is tracked separately
    stdin: |
      cd /
      pushd /tmp >/dev/full; echo "pushd rc=$?"
      popd >/dev/full; echo "popd rc=$?"

  - name: "pushd -n and popd -n may be repeated"
    stdin: |
      cd /usr
      pushd -n / -n >/dev/null; echo "pushd: $? $PWD"
      dirs -l -p | tail -n 1
      popd -n -n >/dev/null; echo "popd: $? $PWD"
      dirs -p | wc -l | tr -d ' '

  - name: "pushd with no directory swaps the top two"
    ignore_stderr: true
    stdin: |
      cd /
      pushd /usr >/dev/null
      pushd >/dev/null; echo "rc=$?"
      pwd

  - name: "pushd with no directory swaps only the top two"
    stdin: |
      cd /
      pushd -n /usr >/dev/null
      pushd -n /tmp >/dev/null
      pushd; echo "rc=$?"
      pwd
      pushd; echo "rc=$?"
      pwd
      dirs

  - name: "pushd with no directory and an empty stack"
    ignore_stderr: true
    stdin: |
      cd /
      pushd; echo "rc=$?"
      pwd
      dirs

  - name: "dirs takes +N and -N"
    known_failure: true # TODO(dirs): +N and -N are not implemented
    ignore_stderr: true
    stdin: |
      cd /; pushd -n /usr >/dev/null; pushd -n /tmp >/dev/null
      dirs -l +1; echo "rc=$?"
      dirs -l -0; echo "rc=$?"
      dirs -l +5; echo "rc=$?"

  - name: "pushd takes +N and -N"
    known_failure: true # TODO(pushd): +N and -N are not implemented
    ignore_stderr: true
    stdin: |
      cd /; pushd -n /usr >/dev/null; pushd -n /tmp >/dev/null
      pushd +1 >/dev/null; echo "rc=$? $(dirs -l)"
      pushd -0 >/dev/null; echo "rc=$? $(dirs -l)"
      pushd +9 >/dev/null; echo "rc=$?"

  - name: "popd takes +N and -N"
    known_failure: true # TODO(popd): +N and -N are not implemented
    ignore_stderr: true
    stdin: |
      cd /; pushd -n /usr >/dev/null; pushd -n /tmp >/dev/null
      popd -n +1 >/dev/null; echo "rc=$? $(dirs -l)"
      pushd -n /usr >/dev/null; popd -0 >/dev/null; echo "rc=$? $(dirs -l)"
      popd +9 >/dev/null; echo "rc=$?"

  #
  # DIRSTACK mirrors `dirs`: element 0 is the current directory, so one pushd yields two
  # elements. brush's dynamic DIRSTACK omits the current directory.
  #
  - name: "DIRSTACK includes the current directory"
    known_failure: true # TODO: the DIRSTACK getter omits the current directory
    stdin: |
      cd /usr
      echo "empty=${#DIRSTACK[@]}"
      pushd / > /dev/null
      echo "after_pushd=${#DIRSTACK[@]}"
