name: "Builtins: command"
cases:
  - name: "Basic command usage"
    ignore_stderr: true
    stdin: |
      echo "Executing echo built-in"
      command echo "Hello"

      echo "Executing ls using name"
      command ls -d /

      echo "Executing ls using absolute path"
      command $(which ls) -d /

      echo "Executing non-existent command by name"
      command non-existent

      echo "Executing non-existent command by path"
      command /usr/bin/non-existent

  - name: "Non-executable command"
    ignore_stderr: true
    stdin: |
      mkdir subdir

      echo "Before executing"
      ./subdir
      echo "After executing: result=$?"

      echo "Before and-or list execution"
      ./subdir || true
      echo "After and-or list execution: result=$?"

  - name: "command -v"
    stdin: |
      echo "PATH: $PATH"

      echo "[echo]"
      command -v echo

      echo "[non-existent]"
      command -v non-existent || echo "1. Not found"

      echo "[/usr/bin/non-existent]"
      command -v /usr/bin/non-existent || echo "2. Not found"

  - name: "command -v -p"
    # On NixOS, `command -p`'s default "standard utilities" path diverges between
    # brush and the oracle. brush derives it from glibc's confstr(_CS_PATH), which
    # nixpkgs patches to include the Nix profile (so `cat` is found there), whereas
    # nixpkgs' bash resolves a default path that excludes the Nix profile (so it
    # finds nothing). This reflects where NixOS keeps its standard utilities, not a
    # brush behavior difference, so it can't be reconciled against the oracle.
    incompatible_os: ["nixos"]
    stdin: |
      unset PATH

      echo "[no -p]"
      command -v cat

      echo "[-p]"
      command -v -p cat

  - name: "command -v with full paths"
    stdin: |
      echo "[cat]"
      command -v cat

      echo "[\$(command -v cat)]"
      command -v $(command -v cat)

  - name: "command -V"
    ignore_stderr: true
    stdin: |
      command -V echo
      command -V ls
      command -V $(which ls)

      command -V non-existent || echo "1. Not found"
      command -V /usr/bin/non-existent || echo "2. Not found"

  - name: "command with --"
    stdin: |
      command -- ls

  - name: "command with --help"
    stdin: |
      command ls --help

  - name: "command forwards expanded declaration assignments"
    known_failure: true # TODO: command builtin improvements required
    stdin: |
      value=world
      command declare declared=$value
      command export exported=$value
      declare -p declared exported

  - name: "nested wrappers resolve ordinary and declaration targets"
    known_failure: true # TODO: command builtin improvements required
    stdin: |
      value=world
      command builtin echo ordinary=$value
      command builtin declare declared=$value
      builtin command echo reverse=$value
      declare -p declared

  - name: "command expands assignment-looking argument for ordinary builtin"
    stdin: |
      value=world
      command echo argument=$value

  - name: "command expands assignment-looking argument for external command"
    stdin: |
      value=world
      command sh -c 'printf "<%s>\n" "$1"' sh argument=$value

  - name: "command expands assignment-looking command name"
    stdin: |
      value=world
      command missing=$value 2>/dev/null
      printf 'status=%s last=<%s>\n' "$?" "$_"

  - name: "command with -p"
    ignore_stderr: true # In case it fails on the oracle as well, ignore the specific error message.
    # See "command -v -p" above: `command -p`'s default utility path resolves
    # differently on NixOS for brush (glibc confstr) vs. the oracle (nixpkgs bash).
    incompatible_os: ["nixos"]
    stdin: |
      unset PATH

      command -p -- ls

  #
  # Regression coverage: `command` does not change whether an argument is an assignment word, so
  # its arguments undergo ordinary word expansion and the nested builtin recognizes any assignment
  # syntax that survives.
  #
  - name: "command does not preserve assignment splitting semantics"
    known_failure: true # TODO: command builtin improvements required
    ignore_stderr: true
    stdin: |
      v="x y"
      command declare b=$v
      declare -p b y

  - name: "command forwards a value with no field separators intact"
    known_failure: true # TODO: command builtin improvements required
    stdin: |
      value=world
      command declare declared=$value
      command readonly fixed=$value
      declare -p declared fixed

  - name: "Function shadowing command receives its arguments"
    stdin: |
      command() { echo "shadow command: [$*] count=$#"; }
      command echo hi
      unset -f command
