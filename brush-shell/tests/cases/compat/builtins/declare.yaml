name: "Builtins: declare"
common_test_files:
  - path: "helpers.sh"
    contents: |
      stable_print_assoc_array() {
          # TODO(nameref): enable use of nameref when implemented; for now
          # we assume the name of the array is assoc_array
          # local -n assoc_array=$1
          local key

          for key in $(printf "%s\n" "${!assoc_array[@]}" | sort -n); do
              echo "\"${key}\" => ${assoc_array[${key}]}"
          done
      }

cases:
  - name: "Display vars"
    stdin: |
      declare myvar=something
      declare -p myvar

      myarr=(a b c)
      declare -p myarr

  - name: "Display vars with interesting chars"
    stdin: |
      (testvar="\"abc\"" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar="a b c" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar="'" && declare -p testvar && declare | grep testvar=)

  - name: "Display vars with adjacent single quotes"
    stdin: |
      (testvar="a''b" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar="''" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar="'a" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar="a'" && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (declare -a arr=("a''b" "'") && declare -p arr)
      echo "-------------------------"
      (declare -A m=([k]="a''b") && declare -p m)

  - name: "Display vars with interesting chars 2"
    min_oracle_version: 5.2 # some sequences render differently in older shell versions
    stdin: |
      (testvar=$'a\nb' && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar=$'\x03' && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar=$'\x08' && declare -p testvar && declare | grep testvar=)
      echo "-------------------------"
      (testvar=$(printf '\033[34mabc\033[0m') && declare -p testvar && declare | grep testvar=)

  - name: "Declare integer"
    stdin: |
      declare -i num=10
      declare -p num

      echo $num
      num+=10
      echo $num

      declare +i num
      declare -p num

      echo $num
      num+=10
      echo $num

  - name: "Declare integer with non-integer string"
    stdin: |
      declare -i var=value
      declare -p var

  - name: "Removing integer attribute prevents arithmetic evaluation"
    stdin: |
      declare -i var=5
      declare +i var=1+2
      declare -p var

  - name: "Invalid integer declaration does not evaluate value"
    stdin: |
      side_effect=0
      declare -i 'invalid-name=side_effect=1' 2>/dev/null
      echo "status: $?"
      echo "side effect: $side_effect"

  - name: "Readonly integer declaration does not evaluate value"
    stdin: |
      side_effect=0
      readonly var=1
      declare -i 'var=side_effect=1' 2>/dev/null
      echo "status: $?"
      echo "side effect: $side_effect"

  - name: "Update integer with non-integer string"
    stdin: |
      declare -i var=10
      declare -p var

      var=value
      declare -p var

  - name: "Update integer indexed array with non-integer string"
    stdin: |
      declare -ai arr=()
      declare -p arr

      arr[0]="value"
      declare -p arr

  - name: "Update integer associative array with non-integer string"
    stdin: |
      declare -Ai arr=()
      declare -p arr

      arr['key']="value"
      declare -p arr

  - name: "Declare readonly variable"
    ignore_stderr: true
    stdin: |
      declare -r var="readonly"
      declare -p var

      echo $var

      var="change"
      echo "change result: $?"
      echo "var: ${var}"

      declare +r var
      echo "+r result: $?"
      declare -p var

  - name: "Declare array"
    stdin: |
      declare -a arr=("element1" "element2" "element3")
      declare -p arr
      echo "[0]: ${arr[0]}"
      echo "[1]: ${arr[0]}"
      echo "[2]: ${arr[0]}"
      echo "[3]: ${arr[0]}"
      echo "STAR: ${arr[*]}"
      echo "AT: ${arr[*]}"

  - name: "Declare associative array"
    stdin: |
      declare -A arr=(["x1"]=1 ["x2"]=2)
      declare -p arr
      echo "[x]: ${arr[x1]}"
      echo "[y]: ${arr[x2]}"
      echo "[z]: ${arr[x3]}"
      echo "STAR: ${arr[*]}"
      echo "AT: ${arr[*]}"

  - name: "Declare and export variable"
    stdin: |
      declare -x myexportedvar="exported variable"
      env | grep myexportedvar

  - name: "Declare and export unset variable"
    stdin: |
      declare -x myunsetexportedvar
      env | grep myunsetexportedvar
      set | grep myunsetexportedvar=

  - name: "Re-declaring variable"
    stdin: |
      var="value"
      declare var
      echo "var: ${var}"

  - name: "Appending via declare"
    stdin: |
      declare var="value"
      declare -p var

      declare var+="appended"
      declare -p var

  - name: "Multiple declare operands expand before assignments are applied"
    stdin: |
      unset first second
      declare first=one second=$first
      declare -p first second

  - name: "Declare command substitutions expand left to right exactly once"
    stdin: |
      marker=marker.txt
      : > "$marker"
      declare first=$(printf one; printf x >> "$marker") second=$(read -r contents < "$marker"; printf %s "$contents")
      declare -p first second
      read -r contents < "$marker"
      echo "marker: $contents"

  - name: "Declare expansion error occurs before any operand is applied"
    known_failure: true # Requires EXIT traps to fire at subshell exit; brush only runs them
                        # when the top-level shell exits, so the trap below never observes the state.
    stdin: |
      state=state.txt
      : > "$state"
      (trap 'declare -p first > "$state" 2>/dev/null || printf unset > "$state"' EXIT; set -u; declare first=one second=$missing) 2>/dev/null
      echo "status: $?"
      read -r contents < "$state"
      echo "state: ${contents:-empty}"

  - name: "Aliases preserve declaration assignment expansion"
    stdin: |
      shopt -s expand_aliases
      alias d=declare
      alias e=export
      value=world
      d declared=$value
      e exported=$value
      declare -p declared exported

  - name: "Disabled declare uses ordinary argument expansion"
    stdin: |
      enable -n declare
      value=world
      declare disabled=$value 2>/dev/null
      echo "status: $?"
      enable declare
      declare -p disabled 2>/dev/null || echo unset

  - name: "Declaring without value"
    stdin: |
      [[ -v var ]] && echo "1: Variable is set"
      declare var
      declare -p var
      [[ -v var ]] && echo "2: Variable is set"
      declare var2=""
      declare -p var2
      [[ -v var2 ]] && echo "3: Variable is set"

  - name: "Displaying local vars"
    stdin: |
      function test {
          echo "Dumping local variables (should be empty)"
          local -p

          local -i int_var=10
          local -A assoc_array=(["x1"]=1 ["x2"]=2)
          local -a array=(a b c)
          local -r ro_var="readonly"
          local -t traced="value"

          echo "Dump all variables"
          local -p
      }

      test

  - name: "Using local to detect function presence"
    stdin: |
      function test {
        local something 2>/dev/null && echo "In function"
      }

      local something 2>/dev/null || echo "Not in function"

      test

  - name: "Displaying function names"
    stdin: |
      echo "Dumping function names"
      declare -F
      declare -p -F

      function test {
        :
      }

      echo "Dumping function names again"
      declare -F
      declare -p -F

      echo "Dumping test"
      declare -F test
      declare -p -F test

  - name: "Displaying functions"
    stdin: |
      echo "Dumping functions"
      declare -f
      declare -p -f

      function test {
        :
      }

      echo "Dumping functions again"
      declare -f
      declare -p -f

      echo "Dumping test"
      declare -f test
      declare -p -f test

  - name: "Displaying functions with compound bodies"
    stdin: |
      f() { local x=1; if [ 1 ]; then echo "a b"; fi; for i in 1 2; do :; done; }
      declare -f f

      g() { if [ 1 ]; then echo a; echo b; else echo c; fi; }
      declare -f g

      h() { while :; do break; done; { echo a; }; case x in a) echo b;; esac; }
      declare -f h

      i() { until :; do echo x; done; ( echo s; echo t ); }
      declare -f i

  - name: "Displaying a function with case patterns"
    stdin: |
      f() {
        case "$1" in
          a|b|c) echo abc;;
          (d|e) echo de;;
          single) echo one;;
          *) ;;
        esac
      }
      declare -f f

  - name: "Displaying non-existent functions"
    stdin: |
      declare -f not_a_function
      echo "Result (-f): $?"

      declare -F not_a_function
      echo "Result (-F): $?"

  - name: "Valid conversions"
    stdin: |
      declare -a arr1=(a b c)
      declare -a arr1
      echo "Conversion result: $?"
      declare -p arr1

      declare -A arr2=(["x1"]=1 ["x2"]=2)
      declare -A arr2
      echo "Conversion result: $?"
      declare -p arr2

      declare scalar1="value"
      declare -a scalar1
      echo "Conversion result: $?"
      declare -p scalar1

      declare scalar2="value"
      declare -A scalar2
      echo "Conversion result: $?"
      declare -p scalar2

  - name: "Bad conversions"
    ignore_stderr: true
    stdin: |
      declare -a arr1=(a b c)
      declare -A arr1
      echo "Conversion result: $?"
      declare -p arr1

      declare -A arr2=(["x1"]=1 ["x2"]=2)
      declare -a arr2
      echo "Conversion result: $?"
      declare -p arr2

  - name: "Declare -p using invalid forms"
    ignore_stderr: true
    stdin: |
      declare arr=(a b c)
      declare -p arr[0]
      echo "Result: $?"
      declare -p arr[0]=1
      echo "Result: $?"

      declare scalar=x
      echo "Result: $?"
      declare -p scalar=y
      echo "Result: $?"

  - name: "Declare -p error shows expanded assignment"
    stdin: |
      value=world
      output=$(declare -p missing=$value 2>&1)
      status=$?
      output=${output##*declare: }
      echo "status: $status"
      echo "error: $output"

  - name: "Updating value"
    stdin: |
      declare var="value"
      declare -p var
      declare var="changed"
      declare -p var

  - name: "Updating value attributes"
    stdin: |
      declare -ix var=10
      declare -p var
      declare +ix var
      declare -p var

  - name: "Updating array"
    stdin: |
      declare arr=(a b c)
      declare -p arr
      declare arr=(d e)
      declare -p arr
      declare arr=10
      declare -p arr

      declare arr2=a
      declare -p arr2
      declare -A arr2=(["key"]="value")
      declare -p arr2

  - name: "Updating causing conversion"
    stdin: |
      source helpers.sh

      declare assoc_array="scalar-value"
      declare -p assoc_array

      declare -A assoc_array["key"]="key-value"
      stable_print_assoc_array assoc_array

  - name: "Uppercase attribute"
    stdin: |
      declare var=value

      declare -u var
      declare -p var

      var="abcd"
      declare -p var

      declare another="abcd"
      declare -u another
      another+=efg
      declare -p another

  - name: "Lowercase attribute"
    stdin: |
      declare var=value

      declare -l var
      declare -p var

      var="AbCd"
      declare -p var

      declare another="ABCD"
      declare -l another
      another+=EFG
      declare -p another

  - name: "Capitalize attribute"
    stdin: |
      declare var=value

      declare -c var
      declare -p var

      var="aBcD eFg"
      declare -p var

      declare another="aBcD"
      declare -c another
      another+=eFg
      declare -p another

  - name: "Declare invalid identifiers"
    ignore_stderr: true
    stdin: |
      declare 1=x && echo "Set 1"
      declare @=10 && echo "Set @"

  - name: "Nameref declare -p shows nameref attribute"
    stdin: |
      target="hello"
      declare -n ref=target
      declare -p ref
      declare -p target

  - name: "Nameref declare -n with initial value"
    known_failure: true
    stdin: |
      target="original"
      declare -n ref=target
      echo "ref: $ref"
      echo "target: $target"

  - name: "Nameref remove attribute with +n"
    known_failure: true
    stdin: |
      target="value"
      declare -n ref=target
      echo "as nameref: $ref"
      declare +n ref
      echo "after +n: ref=$ref"
      declare -p ref

  - name: "Nameref to array via declare"
    known_failure: true
    stdin: |
      arr=(one two three)
      declare -n ref=arr
      echo "ref[0]: ${ref[0]}"
      echo "ref[1]: ${ref[1]}"
      echo "ref[@]: ${ref[@]}"
      echo "ref[*]: ${ref[*]}"

  - name: "Nameref array modification via declare"
    known_failure: true
    stdin: |
      arr=(a b c)
      declare -n ref=arr
      ref[1]="modified"
      echo "arr[1]: ${arr[1]}"
      echo "ref[1]: ${ref[1]}"

  - name: "Nameref to associative array via declare"
    known_failure: true
    stdin: |
      declare -A assoc=(["key1"]="val1" ["key2"]="val2")
      declare -n ref=assoc
      echo "ref[key1]: ${ref[key1]}"
      echo "ref[key2]: ${ref[key2]}"

  - name: "Nameref array iteration in function via local -n"
    known_failure: true
    stdin: |
      print_array() {
          local -n arr=$1
          echo "count: ${#arr[@]}"
          for elem in "${arr[@]}"; do
              echo "elem: $elem"
          done
      }

      myarr=(first second third)
      print_array myarr

  - name: "Nameref get keys via declare"
    known_failure: true
    stdin: |
      declare -A assoc=(["a"]=1 ["b"]=2 ["c"]=3)
      declare -n ref=assoc
      echo "keys (sorted): $(printf '%s\n' ${!ref[@]} | sort | tr '\n' ' ')"
      echo "count: ${#ref[@]}"

  - name: "Nameref array length via declare"
    known_failure: true
    stdin: |
      arr=(one two three four five)
      declare -n ref=arr
      echo "length: ${#ref[@]}"
      echo "first element length: ${#ref[0]}"

  - name: "Nameref declare -n filter"
    stdin: |
      regular="plain"
      declare -n ref1=regular
      declare -n ref2=regular
      not_a_ref="also plain"
      declare -p -n 2>/dev/null | sort

  - name: "Single-quoted scalar assignment"
    stdin: |
      declare 'x=hello'
      echo "$x"

  - name: "Single-quoted scalar with dollar sign preserved"
    stdin: |
      Y=world
      declare 'x=$Y'
      echo "$x"

  - name: "Double-quoted scalar assignment expands"
    stdin: |
      Y=world
      declare "x=$Y"
      echo "$x"

  - name: "Single-quoted array assignment with -a"
    stdin: |
      declare -a 'arr=(1 2 3)'
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Single-quoted array assignment with deferred expansion"
    stdin: |
      X="a b"
      declare -a 'arr=(${X})'
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Single-quoted array assignment with IFS splitting"
    stdin: |
      X="a,b"
      IFS=, declare -a 'arr=(${X})'
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Double-quoted compound assignment with escaped expansion"
    stdin: |
      X="a b"
      declare -a "arr=(\${X})"
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Variable-generated compound assignment syntax"
    stdin: |
      X="a b"
      value='(${X})'
      declare -a "arr=$value"
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Command-substitution-generated compound assignment syntax"
    stdin: |
      X="a b"
      declare -a "arr=$(printf '(%s)' '${X}')"
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Single-quoted compound value in parsed assignment is reparsed"
    stdin: |
      X="a b"
      declare -a arr='(${X})'
      echo "${arr[@]}"
      echo "${#arr[@]}"

  - name: "Single-quoted array assignment without -a is scalar"
    stdin: |
      declare 'arr=(1 2 3)'
      declare -p arr

  - name: "Single-quoted array assignment Gentoo rpm.eclass pattern"
    stdin: |
      RPM_COMPRESS_TYPE="lzma zstd"
      IFS=, declare -a 'types=(${RPM_COMPRESS_TYPE})'
      echo "${types[@]}"
      echo "${#types[@]}"

  - name: "local -a single-quoted array assignment"
    stdin: |
      f() {
        X="a b"
        local -a 'arr=(${X})'
        echo "${arr[@]}"
      }
      f

  - name: "Single-quoted indexed element assignment"
    stdin: |
      declare 'arr[0]=hello'
      declare -p arr

  - name: "Quoted array assignment does not execute value as shell code"
    stdin: |
      payload='(x); printf "INJECTED\n"; #'
      declare -a "arr=$payload"
      echo "status: $?"
      declare -p arr

  - name: "Quoted array assignment propagates assignment failure"
    stdin: |
      declare -ar arr=(old)
      declare -a 'arr=(new)' 2>/dev/null
      echo "status: $?"
      declare -p arr

  - name: "Quoted array assignment applies uppercase attribute"
    stdin: |
      declare -au 'arr=(ab Cd)'
      declare -p arr

  - name: "Quoted array assignment applies integer attribute"
    # Integer assignment expression evaluation is a broader core assignment issue.
    known_failure: true
    stdin: |
      declare -ai 'arr=(1+2 3*4)'
      declare -p arr

  - name: "Quoted assignment uses existing indexed array type"
    stdin: |
      arr=(old)
      declare 'arr=(new values)'
      declare -p arr

  - name: "Quoted assignment uses existing associative array type"
    stdin: |
      declare -A map=([old]=value)
      declare 'map=([new]=value [other]=two)'
      declare -p map

  - name: "Quoted assignment uses declaration target scope"
    stdin: |
      arr=(global)
      f() {
        local arr=scalar
        declare -g 'arr=(new values)'
        declare -p arr
      }
      f
      declare -p arr

  - name: "Quoted global assignment ignores local array type"
    stdin: |
      arr=global
      f() {
        local -a arr=(local)
        declare -g 'arr=(new values)'
        declare -p arr
      }
      f
      declare -p arr

  - name: "Quoted local declaration does not inherit global array type"
    stdin: |
      arr=(global)
      f() {
        declare 'arr=(local values)'
        declare -p arr
      }
      f
      declare -p arr

  - name: "Single-quoted nonzero indexed element assignment"
    stdin: |
      declare 'arr[5]=hello'
      declare -p arr

  - name: "Single-quoted indexed element append assignment"
    stdin: |
      declare -a arr=([0]=one)
      declare 'arr[0]+=two'
      declare -p arr

  - name: "Single-quoted associative element append assignment"
    stdin: |
      declare -A map=([key]=one)
      declare 'map[key]+=two'
      declare -p map

  - name: "Single-quoted arithmetic indexed element assignment"
    stdin: |
      declare 'arr[2+2]=value'
      declare -p arr

  - name: "Single-quoted variable arithmetic indexed element assignment"
    stdin: |
      index=3
      declare 'arr[index+1]=value'
      declare -p arr

  - name: "Single-quoted parameter-expanded indexed element assignment"
    stdin: |
      index=3
      declare 'arr[$index+1]=value'
      declare -p arr

  - name: "Single-quoted command-substitution indexed element assignment"
    stdin: |
      index=3
      declare 'arr[$(echo 2)+index]=value'
      declare -p arr

  - name: "Single-quoted parameter-expanded associative element assignment"
    stdin: |
      key="space key"
      declare -A 'map[$key]=value'
      declare -p map

  - name: "Single-quoted indexed subscript expands without re-expanding value"
    stdin: |
      index=2
      value=expanded
      declare 'arr[$index]=$value'
      declare -p arr

  - name: "Single-quoted associative subscript expands without re-expanding value"
    stdin: |
      key="space key"
      value=expanded
      declare -A 'map[$key]=$value'
      declare -p map

  - name: "Single-quoted append assignment"
    stdin: |
      declare 'text=one'
      declare 'text+=two' 2>/dev/null
      echo "status: $?"
      declare -p text

  - name: "Single-quoted array-like scalar assignment with +a"
    stdin: |
      declare +a 'arr=(1 2)'
      echo "status: $?"
      declare -p arr

  - name: "Cannot remove indexed array attribute with +a"
    stdin: |
      declare -a arr=(1 2)
      declare +a arr 2>/dev/null
      echo "status: $?"
      declare -p arr

  - name: "Cannot update indexed array while removing attribute with +a"
    stdin: |
      declare -a arr=(1 2)
      declare +a 'arr=(3 4)' 2>/dev/null
      echo "status: $?"
      declare -p arr

  - name: "Single-quoted associative array assignment"
    stdin: |
      declare -A 'map=([alpha]=one [beta]=two)' 2>/dev/null
      echo "status: $?"
      declare -p map 2>/dev/null

  #
  # Regression coverage: a shell function may shadow a declaration builtin. The builtin's
  # arguments must still reach the function intact.
  #
  - name: "Function shadowing declare receives its arguments"
    stdin: |
      declare() { echo "shadow declare: [$*] count=$#"; }
      declare x=1
      declare a b c
      unset -f declare

  - name: "Function shadowing local and readonly receives its arguments"
    stdin: |
      readonly() { echo "shadow readonly: [$*] count=$#"; }
      readonly r=1
      unset -f readonly
      f() {
        local() { echo "shadow local: [$*] count=$#"; }
        local l=2
        unset -f local
      }
      f

  - name: "Function shadowing declare is reached through command"
    stdin: |
      declare() { echo "shadow declare: [$*]"; }
      command declare cx=1
      unset -f declare

  #
  # Regression coverage: an assignment operand is expanded before the command runs, so the
  # command's own temporary environment and redirections cannot affect that expansion.
  #
  - name: "Temporary environment is not visible to a declare operand"
    stdin: |
      unset FOO
      FOO=fromprefix declare y=$FOO
      declare -p y

  - name: "Temporary IFS does not split an unquoted compound declare operand"
    stdin: |
      X="a:b"
      IFS=: declare -a arr=($X)
      declare -p arr

  - name: "Temporary IFS does split a quoted compound declare operand"
    stdin: |
      X="a,b"
      IFS=, declare -a 'arr=(${X})'
      declare -p arr

  - name: "Redirections do not apply to a declare operand's command substitution"
    stdin: |
      declare w=$(echo to-stderr >&2; echo val) 2>/dev/null
      declare -p w

  #
  # Regression coverage: an expansion error in an operand is fatal, exactly as it is for an
  # ordinary assignment statement.
  #
  - name: "Unset variable in a declare operand is fatal under set -u"
    ignore_stderr: true
    stdin: |
      ( set -u; declare x=$undefined; echo "NOT REACHED" )
      echo "status: $?"

  - name: "Unset variable in a local operand is fatal under set -u"
    ignore_stderr: true
    stdin: |
      f() { local x=$undefined; echo "NOT REACHED"; }
      ( set -u; f; echo "NOT REACHED EITHER" )
      echo "status: $?"

  #
  # Regression coverage: `$_` and command tracing are the interpreter's responsibility, so they
  # apply to every form of these builtins, not only to the forms that assign.
  #
  - name: "$_ - declare display and query forms"
    stdin: |
      value=world
      echo seed > /dev/null
      declare -p PWD > /dev/null; printf 'declare -p: [%s]\n' "$_"
      echo seed > /dev/null
      declare > /dev/null; printf 'declare bare: [%s]\n' "$_"
      echo seed > /dev/null
      f() { :; }
      declare -f f > /dev/null; printf 'declare -f: [%s]\n' "$_"
      echo seed > /dev/null
      declare declared=$value; printf 'declare assign: [%s]\n' "$_"

  - name: "$_ - export and readonly display forms"
    stdin: |
      echo seed > /dev/null
      export > /dev/null; printf 'export bare: [%s]\n' "$_"
      echo seed > /dev/null
      readonly > /dev/null; printf 'readonly bare: [%s]\n' "$_"
      echo seed > /dev/null
      readonly -p > /dev/null; printf 'readonly -p: [%s]\n' "$_"

  #
  # Regression coverage: `declare array[index]` versus an assignment whose value merely looks
  # like a subscript.
  #
  - name: "Assignment value ending in a bracket is not a subscripted name"
    stdin: |
      v='[a]'
      declare "x=$v"
      declare -p x

  - name: "Assignment value containing brackets is preserved"
    stdin: |
      declare 'a[1]=v[2]'
      declare -p a

  - name: "Bare subscripted name declares an array"
    stdin: |
      declare 'arr[5]'
      declare -p arr

  #
  # Regression coverage: `+a`/`+A` report why they refuse to remove an array attribute.
  #
  - name: "Removing array attribute reports an error"
    ignore_stderr: true
    stdin: |
      declare -a arr=(1 2)
      declare +a arr
      echo "status: $?"
      declare -p arr

  - name: "Removing array attribute from a declared but unset array fails"
    ignore_stderr: true
    stdin: |
      declare -a arr
      declare +a arr
      echo "status: $?"
      declare -p arr

  - name: "Removing associative array attribute fails"
    ignore_stderr: true
    stdin: |
      declare -A map=([k]=v)
      declare +A map
      echo "status: $?"
      declare -p map

  - name: "Converting a declared but unset array to the other kind fails"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      exec 2>err.txt
      declare -a arr
      declare -A arr
      echo "status: $?"
      declare -p arr
      declare -A map
      declare -a map
      echo "status: $?"
      declare -p map
      strip <err.txt; rm err.txt

  - name: "Redeclaring an unset array with the same kind leaves it unset"
    stdin: |
      declare -a arr
      declare -a arr
      declare -p arr
      declare x
      declare -a x
      declare -p x

  #
  # Regression coverage: subscript expansion for operands that arrive already expanded.
  #
  - name: "Parsed associative subscript is expanded"
    stdin: |
      declare -A m
      key="a b"
      declare m[$key]=v
      declare -p m

  # These two pin the asymmetry in how subscripts are resolved: a `name[sub]=` subscript is
  # expanded again by the builtin, while a compound element's key is already final. The key
  # deliberately expands to command-substitution syntax, so a second expansion is visible in the
  # result and the two cases cannot be collapsed without failing.
  - name: "Subscript of a parsed element assignment is expanded a second time"
    stdin: |
      key='$(echo SECOND)'
      declare -A m
      declare m[$key]=v
      declare -p m

  - name: "Compound element key is not expanded a second time"
    stdin: |
      key='$(echo SECOND)'
      declare -A m=([$key]=v)
      declare -p m

  - name: "Quoted element subscript is expanded exactly once"
    stdin: |
      key='$(echo SECOND)'
      declare -A m
      declare 'm[$key]=v'
      declare -p m

  - name: "Parsed indexed subscript is arithmetically evaluated"
    stdin: |
      index=3
      declare arr[index+1]=v
      declare -p arr

  - name: "Compound associative key is expanded exactly once"
    stdin: |
      key="a b"
      declare -A m=([$key]=v)
      declare -p m

  - name: "Compound indexed key is arithmetically evaluated"
    stdin: |
      declare -a a=([2+2]=v)
      declare -p a

  - name: "Compound value assigned to an array element targets the whole array"
    # A shell drops the subscript and applies the compound assignment to the whole array.
    stdin: |
      declare -a n=(1)
      declare -a 'n[0]=(9 8)'
      echo "status: $?"
      declare -p n

  - name: "Empty subscript is rejected"
    ignore_stderr: true
    stdin: |
      declare 'b[]' 2>/dev/null
      echo "status: $?"
      declare -p b 2>/dev/null
      echo "declare_status: $?"

  #
  # Attribute-filtered display.
  #
  - name: "Display filtered by readonly and trace attributes"
    stdin: |
      declare -r zzro=1
      declare -t zztr=2
      declare -rt zzboth=3
      zzplain=4
      echo "-r:"; declare -pr | grep zz | sort
      echo "-t:"; declare -pt | grep zz | sort

  - name: "Display filtered by several attributes lists any that match"
    # A shell combines attribute filters as a union: `declare -rt` lists variables that are
    # readonly or traced.
    stdin: |
      declare -r zzro=1
      declare -t zztr=2
      declare -rt zzboth=3
      declare -prt | grep zz | sort

  - name: "Display is not filtered by a plus attribute option"
    # A plus attribute option (`+x`) applies no display filter at all.
    stdin: |
      declare -x zzex=1
      zzplain=2
      declare +x | grep zz | sort

  - name: "Combining -a and -A is rejected"
    # A shell treats `-a` and `-A` together as an invalid option combination.
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      exec 2>err.txt
      declare -aA both
      echo "status: $?"
      declare -p both 2>/dev/null
      echo "declare_status: $?"
      strip <err.txt; rm err.txt

  - name: "Combining -a and -A with a compound operand still creates the variable"
    # bash reports the invalid option combination and still creates the variable from the
    # compound operand, as an associative array. brush creates nothing.
    known_failure: true
    ignore_stderr: true
    stdin: |
      declare -aA both=(x)
      echo "status: $?"
      declare -p both 2>/dev/null
      echo "declare_status: $?"

  - name: "Display diagnostics name the builtin as invoked"
    stdin: |
      check() {
        case $2 in
          *"$1") echo "$1: ok";;
          *) echo "$1: unexpected: $2";;
        esac
      }
      check "declare: nosuch: not found" "$(declare -p nosuch 2>&1)"
      check "typeset: nosuch: not found" "$(typeset -p nosuch 2>&1)"
      f() { check "local: nosuch: not found" "$(local -p nosuch 2>&1)"; }
      f

  - name: "Display filtered by array attributes includes unassigned arrays"
    stdin: |
      declare -a zzempty
      declare -A zzemptyA
      declare -a zzfull=(1)
      declare -A zzfullA=([k]=v)
      echo "-a:"; declare -pa | grep zz | sort
      echo "-A:"; declare -pA | grep zz | sort

  - name: "Declaration diagnostics name the builtin and quote the operand"
    # Covers every diagnostic the declaration builtins emit, so a new one cannot quietly omit the
    # builtin's name. The leading "file: line N:" a shell prefixes is stripped.
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      local x=1 2>&1 | strip
      v=w; declare -p missing=$v 2>&1 | strip
      declare -p nosuchvar 2>&1 | strip
      declare -a da=(1); declare +a da 2>&1 | strip
      declare 'bad-name=1' 2>&1 | strip
      f() { local 'bad-name2=1' 2>&1 | strip; }; f
      readonly 'bad-name3=1' 2>&1 | strip
      export -f nosuchfn 2>&1 | strip
      export 'e[0]=1' 2>&1 | strip

  - name: "declare -fx exports a function"
    stdin: |
      f() { :; }
      count_exported() { env | grep -c "^BASH_FUNC_f"; }
      count_exported
      declare -fx f; echo "rc=$?"
      count_exported
      declare +x -f f; echo "rc=$?"
      count_exported

  - name: "declare -f with attribute flags doesn't display the function"
    stdin: |
      f() { echo body; }
      echo "[$(declare -ft f)]"; echo "rc=$?"
      echo "[$(declare -fx f)]"; echo "rc=$?"

  - name: "declare -f with attribute flags on a missing function"
    stdin: |
      declare -ft nosuchfn 2>&1; echo "rc=$?"
      declare -fx nosuchfn 2>&1; echo "rc=$?"

  - name: "declare -ft records the trace attribute"
    stdin: |
      f() { :; }
      declare -ft f
      declare -F

  #
  # Operand ordering, kind conversion, readonly, and attribute rules.
  #
  # Operands are processed one at a time, each against the environment its predecessors
  # left behind: a later operand's subscript or reinterpreted compound value sees what an
  # earlier one assigned. (Values the interpreter expanded before the command ran do not; see
  # "Multiple readonly operands expand before assignments are applied".)
  #
  - name: "each operand sees what the preceding operands assigned"
    stdin: |
      declare -a 'x=(1 2)' 'y=(${x[@]})'
      declare -p y
      i=5
      declare 'a[i]=1' i=9 'c[i]=2'
      declare -p a i c
      unset i
      declare 'i=3' 'd[i]=x' 'e[i+1]=y'
      declare -p d e

  # A failed kind conversion reports the one operand and keeps going.
  #
  - name: "a failed conversion on one operand does not abort sibling operands"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      exec 2>err.txt
      declare -a q=(1)
      declare -A q r=v
      echo "status=$?"
      declare -p r q
      strip <err.txt; rm err.txt

  #
  # Converting a set function-local scalar to an array discards its value; only a global keeps
  # the scalar as element 0. This holds with or without -I, and for appended array literals.
  #
  - name: "converting a set local scalar to an array discards its value"
    stdin: |
      f() { local t=hi; declare -a t; declare -p t; }
      f
      g() { local s=hello; local -I -a s; declare -p s; }
      g
      u=hi
      declare -a u
      declare -p u

  - name: "appending an array literal to a local scalar discards the scalar"
    stdin: |
      f() { local s=hello; declare s+=(x); declare -p s; }
      f
      s2=hello
      declare s2+=(x)
      declare -p s2

  #
  # A bare subscripted operand implies an indexed array for an existing variable too: an
  # existing scalar is promoted (keeping its value at element 0 at global scope) and a
  # declared-but-unset variable is retyped.
  #
  - name: "a bare subscripted operand promotes an existing scalar to an indexed array"
    stdin: |
      v=out
      declare 'v[0]'
      declare -p v
      declare u
      declare 'u[0]'
      declare -p u

  #
  # Retyping a readonly variable is refused like any other modification -- even re-selecting the
  # kind it already has. A bare re-declaration with no kind is fine.
  #
  - name: "a readonly variable cannot be retyped to an array"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      exec 2>err.txt
      declare q2
      readonly q2
      declare -a q2
      echo "status=$?"
      declare -p q2
      s3=1
      readonly s3
      declare -A s3
      echo "status2=$?"
      declare -p s3
      readonly -a arr=(1)
      declare -a arr
      echo "status3=$?"
      declare arr
      echo "status4=$?"
      declare -p arr
      declare -a ra=(1)
      readonly ra
      declare -a ra
      echo "status3=$?"
      strip <err.txt; rm err.txt

  #
  # Attributes that can transform a variable's value (-i/-l/-u/-c, and -n) are refused on a
  # readonly variable, whether being added or removed; pure flags (-x/-t, and +n on a
  # non-nameref) are fine.
  #
  - name: "value-transforming attributes are refused on a readonly variable"
    stdin: |
      n=abc
      readonly n
      for flag in -i +i -l +l -u +u -c +c -n +n -x +x -t +t; do
        declare $flag n 2>/dev/null
        echo "$flag=$?"
      done
      declare -p n

  #
  # `set -a` exports a variable a declaration modifies, but a bare re-declaration with no
  # assignment leaves the export attribute alone.
  #
  - name: "set -a exports a variable modified via declare"
    stdin: |
      w=1
      u2=1
      set -a
      declare w=2
      declare -p w u2
      declare u2
      declare -p u2

  #
  # `+I` is accepted and behaves like `-I`.
  #
  - name: "+I is accepted and inherits like -I"
    stdin: |
      v=outer
      f() { local +I v; echo "inner=${v-UNSET}"; v=changed; }
      f
      echo "global=$v"
      g() { local -I +I v; echo "both=${v-UNSET}"; }
      g
      declare +I newvar
      echo "declare_status=$?"

  - name: "declare -pF shows function attributes"
    stdin: |
      f() { :; }
      declare -ft f
      declare -fx f
      declare -pF f
      declare +t -f f
      declare -pF f
      declare -F f
      declare -fr f
      declare -pF f

  - name: "attribute options list in declare -p form without -p"
    stdin: |
      zz_x=1
      export zz_e=2
      declare -i zz_i=3
      declare -a zz_a=(1)
      declare -t zz_t=4
      declare -r zz_r=5
      zz_f() { :; }
      declare -ft zz_f
      declare -x | grep zz_
      declare -i | grep zz_
      declare -a | grep zz_
      declare -t
      declare -xi | grep zz_
      declare -r | grep zz_
      readonly | grep zz_
      readonly -a | grep -c zz_
      declare +x | grep -c '^declare'
      declare | grep zz_f
      declare -x | grep -c zz_f

  - name: "option attributes are not granted when the assignment is refused"
    stdin: |
      readonly zz_ro=1
      declare -x zz_ro=2 2>/dev/null
      echo "status: $?"
      declare -p zz_ro
      export zz_ro=3 2>/dev/null
      echo "status: $?"
      declare -p zz_ro

  - name: "the integer attribute evaluates an arithmetic value on assignment"
    known_failure: true # TODO: integer-attributed assignments are not evaluated arithmetically
    stdin: |
      declare -i x=1+1
      declare -p x
      declare -i y
      y=2*3
      declare -p y
      declare -ai a=(1+1 2*3)
      declare -p a

  #
  # `declare -g` names a global, but a shell resolves a subscripted operand's kind against the
  # local that shadows it and then assigns there -- so the global is left untouched. brush honors
  # `-g` for both halves and writes the global.
  #
  - name: "declare -g with a subscripted operand under a shadowing local"
    known_failure: true # TODO: -g resolves the subscript against the global, not the shadowing local
    stdin: |
      declare -A g=([x]=1)
      f() {
        local -a g=(9)
        declare -g g[y]=2
        declare -p g
      }
      f
      declare -p g

  - name: "a local cannot shadow a readonly global"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      readonly zz_ro=1
      f() { local zz_ro=2 other=3; echo "status: $?"; declare -p zz_ro other; }
      { f; } 2>&1 | strip
      g() { declare zz_ro; echo "status: $?"; }
      { g; } 2>&1 | strip
      h() { local -a zz_ro; echo "status: $?"; }
      { h; } 2>&1 | strip
      outer() { local inner=1; readonly inner; middle; }
      middle() { local inner=2; echo "status: $?"; declare -p inner; }
      outer

  #
  # A parenthesized value in a subscripted operand is reinterpreted as a compound value (and
  # assigned to the whole array) only under an explicit -a/-A; without one, an existing array's
  # element receives the text literally.
  #
  - name: "a parenthesized value in a subscripted string operand stays literal without -a"
    stdin: |
      declare -a sub=(1 2)
      declare 'sub[0]=(a b)'
      declare -p sub
      declare -A sm=([k]=v)
      declare 'sm[k]=(a b)'
      declare -p sm
      f() { local -a la=(1); local 'la[0]=(x y)'; declare -p la; }
      f
      declare -a sub2=(1 2)
      declare -a 'sub2[0]=(a b)'
      declare -p sub2

  #
  # With no operands, -f/-F list only the functions matching the attribute options given, as a
  # union; a plus option applies no filter. When definitions are listed under a filter, each is
  # followed by its attribute line.
  #
  - name: "declare -F with attribute options lists only matching functions"
    stdin: |
      zf_a() { echo a; }
      zf_b() { echo b; }
      zf_c() { echo c; }
      zf_d() { echo d; }
      declare -fx zf_a
      readonly -f zf_b
      declare -ft zf_c
      echo "[Fx]"; declare -Fx
      echo "[Fr]"; declare -Fr
      echo "[Ft]"; declare -Ft
      echo "[Frx]"; declare -Frx
      echo "[fx]"; declare -fx
      echo "[F+x]"; declare -F +x | grep -c zf_
      echo "[typeset -Fx]"; typeset -Fx

  #
  # A subscript no element can have -- empty, or `*`/`@` on an indexed array -- is a bad array
  # subscript. The operand fails, but a shell has already bound the target with the kind the
  # operand implies, and it goes on to the remaining operands. The diagnostic is pinned through
  # the pipeline, where it carries no line prefix.
  #
  - name: "a bad subscript fails the operand but still declares the target"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare 'b[]=1' later=1; } 2>&1 | strip
      declare 'b[]=1' later=1 2>/dev/null
      echo "status: $?"
      declare -p b later
      { declare 'c[*]=1'; declare 'd[@]=1'; } 2>&1 | strip
      declare 'c[*]=1' 'd[@]=1' 2>/dev/null
      declare -p c d 2>/dev/null
      declare -A e
      { declare 'e[]=1'; } 2>&1 | strip
      declare 'e[]=1' 2>/dev/null
      declare -p e

  #
  # Which target a bad subscript binds depends on what was there before. A variable that does not
  # exist yet, or holds a scalar, gets bound; one that is *already* an array is left exactly as it
  # was, so a declared-but-unset array stays unset rather than becoming a set, empty one.
  #
  - name: "a bad subscript binds only a target that is not already an array"
    stdin: |
      declare 'zz_new[]=1' 2>/dev/null
      declare -p zz_new
      declare -a zz_unset_a
      declare 'zz_unset_a[]=1' 2>/dev/null
      declare -p zz_unset_a
      declare -A zz_unset_A
      declare 'zz_unset_A[]=1' 2>/dev/null
      declare -p zz_unset_A
      declare -a zz_set=(9)
      declare 'zz_set[]=1' 2>/dev/null
      declare -p zz_set
      zz_scalar=scalar
      declare 'zz_scalar[]=1' 2>/dev/null
      declare -p zz_scalar
      declare 'zz_star[*]=1' 2>/dev/null
      declare -p zz_star
      declare -A zz_assoc
      declare 'zz_assoc[*]=1' 2>/dev/null
      declare -p zz_assoc

  - name: "an expansion that leaves an indexed subscript empty is element 0"
    stdin: |
      e=
      declare "b[$e]=1" 2>/dev/null
      echo "status: $?"
      a[$e]=x
      declare -p a
      declare 'w[ ]=2'
      declare -p w

  #
  # A bad key inside a compound value stops the assignment at that element: the elements before
  # it are assigned, the rest are not. For a quoted operand -- whose compound syntax the builtin
  # recognizes only after expansion -- that is a warning and the operand still succeeds. For an
  # unquoted operand it is an assignment error: attributes are not granted, the status is 1, and
  # the rest of the command list is abandoned.
  #
  - name: "a bad key in a quoted compound operand stops the value with a warning"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare -a 'c=([2]=x []=1 [3]=y)'; } 2>&1 | strip
      declare -a 'c=([2]=x []=1 [3]=y)' 2>/dev/null
      echo "status: $?"
      declare -p c
      { declare -A 'F=([a]=1 []=2 [b]=3)'; } 2>&1 | strip
      declare -A 'F=([a]=1 []=2 [b]=3)' 2>/dev/null
      echo "status: $?"
      declare -p F
      { declare -a 'G=(1 [*]=2 3)'; } 2>&1 | strip
      { declare -a 'H=(1 [@]=2 3)'; } 2>&1 | strip
      declare -a 'G=(1 [*]=2 3)' 'H=(1 [@]=2 3)' 2>/dev/null
      echo "status: $?"
      declare -p G H

  - name: "a bad subscript on the name still grants option attributes"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare -rx 'b[*]=1'; } 2>&1 | strip
      declare -rx 'b[*]=1' 2>/dev/null
      echo "status: $?"
      declare -p b
      n=s
      declare -x 'n[@]=1' 2>/dev/null
      echo "status: $?"
      declare -p n

  - name: "a bad key in an unquoted compound operand is an assignment error"
    ignore_stderr: true
    stdin: |
      declare -a c=(1 []=2 3); echo "same list"
      echo "status: $?"
      declare -p c
      declare -a d=(1 [*]=2 3); echo "same list"
      echo "status: $?"
      declare -p d
      declare -a e=(1 [@]=2 3); echo "same list"
      echo "status: $?"
      declare -p e
      declare -A F=([a]=1 []=2 [b]=3); echo "same list"
      echo "status: $?"
      declare -p F
      s=scalar
      declare -a s=(1 []=2)
      declare -p s
      f() { local -a l=(1 []=2); echo "in function after"; }
      f
      echo "caller next line"

  - name: "an assignment error on a compound operand grants no attributes"
    ignore_stderr: true
    stdin: |
      declare -rx r=(1 []=2)
      echo "status: $?"
      declare -p r
      r[5]=x
      echo "status: $?"
      declare -p r
      declare -i i=(1 []=2)
      declare -p i

  - name: "a conversion failure on an unquoted compound operand is an assignment error"
    ignore_stderr: true
    stdin: |
      declare -A x=([k]=v)
      declare -a x=(1); echo "same list"
      echo "status: $?"
      declare -p x
      declare -a y=(1)
      declare -A y=([k]=v); echo "same list"
      echo "status: $?"
      declare -p y

  - name: "a readonly variable assigned an unquoted compound operand is an assignment error"
    ignore_stderr: true
    stdin: |
      readonly r=1
      declare r=(1 2); echo "same list"
      echo "status: $?"
      declare -p r
      declare -a r=(1 2); echo "same list"
      echo "status: $?"
      declare -p r

  #
  # Only a shell's own refusal to assign is an assignment error. brush failing to carry an
  # assignment out is an ordinary per-operand failure, so the caller's command list survives it.
  # The literal below mixes keyed and unkeyed elements in an associative array, which brush does
  # not yet assign the way bash pairs them up; what this case pins down is that hitting that gap
  # does not abandon the rest of the line.
  #
  - name: "an unimplemented compound value fails the operand without abandoning the list"
    known_failure: true # TODO: misaligned keys/values in an associative array literal
    ignore_stderr: true
    stdin: |
      declare -A y=(a [k]=b [""]=c d)
      echo "status: $?"
      declare -p y
      declare -A z=(a [k]=b); echo "same list"
      echo "reached"

  #
  # A list assigned to one element abandons not just the remaining operands but, as an
  # assignment error, the rest of the command list. brush continues the list.
  #
  - name: "a list assigned to an element abandons the rest of the list"
    ignore_stderr: true
    stdin: |
      declare m[1]=(a b); echo "status: $?"
      echo after

  #
  # A declaration naming a nameref acts on the variable it references.
  #
  - name: "declare assigns through a nameref"
    known_failure: true # TODO: declaration builtins do not follow namerefs
    stdin: |
      declare -n nr=tgt
      declare nr=hello
      declare -p tgt nr

  - name: "a subscripted assignment through a nameref targets the referenced array"
    known_failure: true # TODO: subscripted assignments do not follow namerefs
    stdin: |
      declare -A m
      declare -n r=m
      r[key]=v
      declare -p m
      declare r[other]=w
      declare -p m

  #
  # A bare operand's subscript must end the word: text after the closing bracket, or a second
  # subscript, makes the whole operand an invalid identifier. (An assignment form is rejected by
  # the parser the same way.)
  #
  - name: "a bare operand with a nested or trailing subscript is not a valid identifier"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare 'nb[a][b]'; declare 'nt[a]x]'; declare 'nb[a][b]=1'; } 2>&1 | strip
      declare 'nb[a][b]' 2>/dev/null
      echo "status: $?"
      declare -p nb nt 2>/dev/null
      echo "declare_status: $?"

  #
  # The diagnostic for a bad key in an unquoted compound operand. brush surfaces it through the
  # interpreter's error display, which adds an `error:` prefix and the builtin's name; a shell
  # prints the bare `[]=2: bad array subscript`.
  #
  - name: "a bad key in an unquoted compound operand is reported as written"
    known_failure: true # TODO: interpreter-displayed assignment errors carry an `error:` prefix and the builtin name
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare -a c=(1 []=2 3); } 2>&1 | strip
      { declare -A m=([a]=1 [""]=2); } 2>&1 | strip

  - name: "a function cannot be declared by assignment"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { declare -f f=1; echo "status: $?"; } 2>&1 | strip
      { declare -Fx f=1; echo "status: $?"; } 2>&1 | strip
      declare -F f; echo "status: $?"

  #
  # Every one of `declare`'s options has a `+X` form, including the four that select a mode rather
  # than an attribute. For those four `+X` means "off", which is already the default, so they are
  # accepted and (except for `+p`) do nothing: `+f` and `+F` drop the function restriction, `+g`
  # drops global creation, and `+p` prints just as `-p` does. brush models those four as plain
  # boolean flags with no plus form, so clap rejects the word outright and the command exits 2.
  # This also takes down any combined form that includes one of them, such as `+ft`.
  #
  - name: "declare +f drops the function restriction"
    known_failure: true # TODO(declare): -f/-F/-g/-p have no `+X` form
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      f() { :; }
      { declare +fp f; echo "status: $?"; } 2>&1 | strip

  - name: "declare +F drops names-only display and declares a variable instead"
    known_failure: true # TODO(declare): -f/-F/-g/-p have no `+X` form
    stdin: |
      f() { :; }
      declare -F f
      declare +F f
      echo "status: $?"
      declare -p f

  - name: "declare +g declares locally inside a function"
    known_failure: true # TODO(declare): -f/-F/-g/-p have no `+X` form
    stdin: |
      g=outer
      f() { declare +g g=inner; echo "inside: $g"; }
      f
      echo "outside: $g"

  - name: "declare +p displays just as -p does"
    known_failure: true # TODO(declare): -f/-F/-g/-p have no `+X` form
    stdin: |
      x=1
      declare -p x
      declare +p x
      echo "status: $?"

  - name: "declare +ft combines a mode option and an attribute option"
    known_failure: true # TODO(declare): -f/-F/-g/-p have no `+X` form
    stdin: |
      f() { :; }
      declare -ft f
      declare +ft f
      echo "status: $?"
      declare -pF f
      declare -p f
