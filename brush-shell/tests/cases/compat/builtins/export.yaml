name: "Builtins: export"
cases:
  - name: "Basic export usage"
    stdin: |
      MY_TEST_VAR="value"
      echo "Looking for unexported variable..."
      env | grep MY_TEST_VAR

      echo "Exporting and looking for it again..."
      export MY_TEST_VAR
      env | grep MY_TEST_VAR

      echo "Exporting with new value..."
      export MY_TEST_VAR="changed value"
      env | grep MY_TEST_VAR

  - name: "Exporting array"
    stdin: |
      export arr=(a 1 2)
      declare -p arr

  - name: "Export of an absent name exports a later scalar assignment"
    stdin: |
      unset pending
      export pending
      declare -p pending
      pending=value
      declare -p pending
      env | grep '^pending='

  - name: "Export -a of absent names preserves later assignment types"
    stdin: |
      unset hooks scalar
      export -a hooks scalar
      echo "status: $?"
      declare -p hooks scalar
      hooks+=(first second)
      scalar=hello
      declare -p hooks scalar

  - name: "Export -a of bare names preserves existing types and values"
    stdin: |
      scalar=hello
      indexed=([3]=three [7]=seven)
      declare -A associative=([key]=value)
      export -a scalar indexed associative
      echo "status: $?"
      declare -p scalar indexed associative

  - name: "Export -a of unset and empty arrays does not create elements"
    stdin: |
      declare -a pending
      empty=()
      declare -A associative
      export -a pending empty associative
      declare -p pending empty associative
      echo "lengths: ${#pending[@]} ${#empty[@]} ${#associative[@]}"
      pending+=(one two)
      empty+=(three four)
      declare -p pending empty

  - name: "Export -a scalar assignments create indexed arrays"
    stdin: |
      scalar=old
      export -a fresh=first scalar=next
      echo "status: $?"
      declare -p fresh scalar

  - name: "Export -a scalar appends preserve element zero"
    stdin: |
      scalar=hello
      indexed=([0]=zero [3]=three)
      export -a fresh+=first scalar+=next indexed+=suffix
      declare -p fresh scalar indexed

  - name: "Export -a scalar assignment preserves other array indices"
    stdin: |
      indexed=([3]=three [7]=seven)
      export -a indexed=zero
      declare -p indexed

  - name: "Export -a compound assignments and appends"
    stdin: |
      scalar=old
      export -a scalar=(one 'two words') fresh=(three four)
      export -a scalar+=(five six)
      declare -p scalar fresh

  - name: "Export -a assignment to unset arrays does not add empty elements"
    stdin: |
      declare -a pending scalar_pending
      export -a pending+=(one two) scalar_pending+=suffix
      declare -p pending scalar_pending

  - name: "Export -a generated assignments do not expand values again"
    stdin: |
      assignment='generated=$(printf expanded)'
      export -a "$assignment"
      name=scalar
      scalar=hello
      export -a ${name}+=next
      declare -p generated scalar

  - name: "Export -an bare names unexport without converting or creating"
    stdin: |
      export scalar=hello indexed=(one two)
      declare -Ax associative=([key]=value)
      unset absent
      export -an absent scalar indexed associative
      echo "status: $?"
      declare -p absent 2>/dev/null
      echo "absent status: $?"
      declare -p scalar indexed associative

  - name: "Export -an assignments create unexported indexed arrays"
    stdin: |
      export scalar=old
      export -an fresh=first scalar+=next compound=(one two)
      declare -p fresh scalar compound

  - name: "Export -af still exports functions"
    stdin: |
      example() { :; }
      export -af example
      echo "status: $?"
      env | grep -q '^BASH_FUNC_example%%='
      echo "exported: $?"
      export -anf example
      env | grep -q '^BASH_FUNC_example%%='
      echo "unexported: $?"

  - name: "Export -a invalid identifiers do not prevent later operands"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { export -a first=one 1bad second=two; echo "status: $?"; declare -p first second; } 2>&1 | strip

  - name: "Export -a associative assignment fails but exports and continues"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      declare -A map=([key]=old)
      { export -a map=new next=ok; echo "status: $?"; declare -p map next; } 2>&1 | strip

  - name: "Export -a unset associative assignment fails without conversion"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      declare -A map
      { export -a map+=new next=ok; echo "status: $?"; declare -p map next; } 2>&1 | strip

  - name: "Export -a readonly assignment fails but exports and continues"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      readonly fixed=old
      { export -a fixed=new next=ok; echo "status: $?"; declare -p fixed next; } 2>&1 | strip

  - name: "Export -a compound assignment to an associative array is fatal"
    known_failure: true # TODO(export): bash rejects the compound assignment before export runs and ends the command; brush reports it and goes on to later operands
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      declare -A map=([key]=old)
      { export -a map=(new) next=ok; echo "not reached"; } 2>&1 | strip
      echo "status: ${PIPESTATUS[0]}"

  - name: "Export -af without operands lists no variables"
    stdin: |
      example() { :; }
      export -f example
      export BRUSH_EXPORT_SCALAR=scalar BRUSH_EXPORT_INDEXED=(one)
      export -af
      echo "status: $?"

  - name: "Export -a lists only exported indexed arrays with canonical values"
    stdin: |
      export BRUSH_EXPORT_SCALAR=scalar
      export BRUSH_EXPORT_INDEXED=([2]='two words' [7]='quote" slash\ dollar$')
      export BRUSH_EXPORT_EMPTY=()
      declare -a BRUSH_EXPORT_PENDING
      export -a BRUSH_EXPORT_PENDING BRUSH_EXPORT_UNSET
      declare -Ax BRUSH_EXPORT_ASSOC=([key]=value)
      BRUSH_EXPORT_LOCAL=(unexported)
      export -a | grep BRUSH_EXPORT_
      export -ap | grep BRUSH_EXPORT_

  - name: "Export -a listings retain integer and readonly attributes"
    stdin: |
      declare -aix BRUSH_EXPORT_INTS=(1 2)
      declare -arx BRUSH_EXPORT_READONLY=(fixed)
      export -ap | grep BRUSH_EXPORT_

  - name: "Export -a arrays do not become child environment strings"
    stdin: |
      export BRUSH_EXPORT_SCALAR=scalar
      export -a BRUSH_EXPORT_INDEXED=(one two) BRUSH_EXPORT_ASSIGNED=value
      declare -Ax BRUSH_EXPORT_ASSOC=([0]=zero [key]=value)
      declare -a BRUSH_EXPORT_PENDING
      export -a BRUSH_EXPORT_PENDING
      env | grep '^BRUSH_EXPORT_' | sort

  - name: "Export scalar assignment with parameter expansion"
    stdin: |
      value=hello
      export result="$value world"
      echo "$result"

  - name: "Export scalar assignment with command substitution"
    stdin: |
      export result=$(printf hello)
      echo "$result"

  - name: "Export structured assignment does not recursively expand its value"
    stdin: |
      source='$(printf expanded)'
      export result=$source
      declare -p result

  - name: "Export generated assignment does not expand its value again"
    stdin: |
      assignment='result=$(printf expanded)'
      export "$assignment"
      declare -p result

  - name: "Export indexed array with arithmetic key"
    known_failure: true # TODO: export improvements required
    stdin: |
      export arr=([2+2]=value)
      declare -p arr

  - name: "Export associative array with expanded key"
    stdin: |
      declare -A map
      key="space key"
      export map=([$key]=value)
      declare -p map

  - name: "Unexporting variable"
    stdin: |
      MY_TEST_VAR="value"
      export MY_TEST_VAR="value"
      export -n MY_TEST_VAR

      env | grep MY_TEST_VAR

  - name: "Export with assignment through nameref"
    known_failure: true
    stdin: |
      declare -n ref=MY_EXPORT_VAR
      export ref="exported_value"
      echo "MY_EXPORT_VAR: $MY_EXPORT_VAR"
      env | grep MY_EXPORT_VAR

  - name: "Export append to existing variable"
    stdin: |
      MYVAR="-O3 -pipe"
      export MYVAR+=" -Wno-foo"
      echo "MYVAR: $MYVAR"

  - name: "Export append to already-exported variable"
    stdin: |
      export MYVAR="-O3 -pipe"
      export MYVAR+=" -Wno-baz"
      echo "MYVAR: $MYVAR"

  - name: "Export append to unset variable"
    stdin: |
      export MYVAR+="first"
      echo "MYVAR: $MYVAR"

  - name: "Multiple export operands expand before assignments are applied"
    stdin: |
      unset first second
      export first=one second=$first
      declare -p first second

  - name: "Export command substitutions expand left to right exactly once"
    stdin: |
      marker=marker.txt
      : > "$marker"
      export first=$(printf one; printf x >> "$marker") second=$(read -r contents < "$marker"; printf %s "$contents")
      declare -p first second
      read -r contents < "$marker"
      echo "marker: $contents"

  - name: "Export expansion error occurs before any operand is applied"
    known_failure: true # Requires EXIT traps to fire at subshell exit; brush only runs them
                        # when the top-level shell exits, so the trap below never observes the state.
    stdin: |
      state=state.txt
      : > "$state"
      (trap 'declare -p first > "$state" 2>/dev/null || printf unset > "$state"' EXIT; set -u; export first=one second=$missing) 2>/dev/null
      echo "status: $?"
      read -r contents < "$state"
      echo "state: ${contents:-empty}"

  - name: "Disabled export uses ordinary argument expansion"
    stdin: |
      enable -n export
      value=world
      export disabled=$value 2>/dev/null
      echo "status: $?"
      enable export
      declare -p disabled 2>/dev/null || echo unset

  #
  # Regression coverage: expansion, tracing, and `$_` for operands that arrive already expanded.
  #
  - name: "Temporary environment is not visible to an export operand"
    stdin: |
      unset FOO
      FOO=fromprefix export y=$FOO
      declare -p y

  - name: "Redirections do not apply to an export operand's command substitution"
    stdin: |
      export w=$(echo to-stderr >&2; echo val) 2>/dev/null
      declare -p w

  - name: "Unset variable in an export operand is fatal under set -u"
    ignore_stderr: true
    stdin: |
      ( set -u; export x=$undefined; echo "NOT REACHED" )
      echo "status: $?"

  - name: "Function shadowing export receives its arguments"
    stdin: |
      export() { echo "shadow export: [$*] count=$#"; }
      export y=2
      unset -f export

  - name: "Export rejects an array element target"
    ignore_stderr: true
    stdin: |
      export 'ea[0]=1'
      echo "status: $?"

  - name: "Export recognizes an assignment produced through command"
    stdin: |
      value=world
      command export wrapped=$value
      declare -p wrapped

  - name: "export rejects dash-prefixed operands after a name"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { export v -x; echo "export v -x: $?"; } 2>&1 | strip
      { export -- -x; echo "export -- -x: $?"; } 2>&1 | strip
      { export w=1 +r; echo "export w=1 +r: $?"; } 2>&1 | strip

  - name: "Usage error in a special builtin is fatal in POSIX mode"
    known_failure: true # TODO(posix): a special builtin's usage error doesn't end a non-interactive POSIX shell
    ignore_stderr: true
    stdin: |
      set -o posix
      export --bogus
      echo "not reached"

  - name: "Usage error in a special builtin is not fatal outside POSIX mode"
    ignore_stderr: true
    stdin: |
      export --bogus
      echo "still running: $?"

  - name: "export --help prints help on stdout"
    stdin: |
      export --help >/dev/null 2>&1; echo "rc=$?"
      [[ -n $(export --help 2>/dev/null) ]] && echo "help on stdout"


  - name: "export --help is fatal in POSIX mode"
    known_failure: true # TODO(posix): a special builtin's --help doesn't end a non-interactive POSIX shell
    stdin: |
      set -o posix
      export --help >/dev/null
      echo "still running: $?"

  - name: "export -f of a missing function"
    known_failure: true # TODO(export): fails with status 2, without attribution, where bash fails with 1
    stdin: |
      strip() { sed -E 's/\x1b\[[0-9;]*m//g; s/^[^ ]*: line [0-9]+: //; s/^error: //'; }
      export -f nofunc 2>&1 | strip
      echo "export: ${PIPESTATUS[0]}"

  - name: "export reports a readonly variable and goes on"
    known_failure: true # TODO(export): stops at a readonly variable instead of going on to the next operand
    ignore_stderr: true
    stdin: |
      readonly r=1
      export r=2 y=3
      echo "export: $? r=$r y=$y"
      readonly r=4 z=5
      echo "readonly: $? r=$r z=$z"
      unset r w
      echo "unset: $? r=$r"

  - name: "export rejects a name that isn't an identifier"
    ignore_stderr: true
    stdin: |
      export "a b=1"; echo "a b=1: $?"
      export 1x=2; echo "1x=2: $?"
      export "a-b"; echo "a-b: $?"

  - name: "export rejects an invalid name and goes on with the rest"
    stdin: |
      strip() { sed -E 's/^[^ ]*: line [0-9]+: //'; }
      { export ok 1x also=2; echo "rc=$?"; } 2>&1 | strip
      { export -n a-b=1 =x; echo "rc=$?"; } 2>&1 | strip
      { export arr[1]=x; echo "rc=$?"; } 2>&1 | strip
      export ok also=2
      env | grep -E '^(ok|also)='

  - name: "export takes a word that expanded into an assignment"
    stdin: |
      v=A
      export ${v}=x
      env | grep '^A='
      export ${v}+=y
      echo "A=$A"
      w="B="
      export $w
      env | grep -c '^B='
