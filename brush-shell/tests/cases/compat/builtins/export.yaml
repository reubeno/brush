name: "Builtins: export"
cases:
  - name: "Basic export usage"
    stdin: |
      MY_TEST_VAR="value"
      echo "Looking for unexported variable..."
      env | grep MY_TEST_VAR

      echo "Exporting and looking for it again..."
      export MY_TEST_VAR
      env | grep MY_TEST_VAR

      echo "Exporting with new value..."
      export MY_TEST_VAR="changed value"
      env | grep MY_TEST_VAR

  - name: "Exporting array"
    stdin: |
      export arr=(a 1 2)
      declare -p arr

  - name: "Unexporting variable"
    stdin: |
      MY_TEST_VAR="value"
      export MY_TEST_VAR="value"
      export -n MY_TEST_VAR

      env | grep MY_TEST_VAR

  - name: "Export with assignment through nameref"
    known_failure: true
    stdin: |
      declare -n ref=MY_EXPORT_VAR
      export ref="exported_value"
      echo "MY_EXPORT_VAR: $MY_EXPORT_VAR"
      env | grep MY_EXPORT_VAR

  - name: "Export append to existing variable"
    stdin: |
      MYVAR="-O3 -pipe"
      export MYVAR+=" -Wno-foo"
      echo "MYVAR: $MYVAR"

  - name: "Export append to already-exported variable"
    stdin: |
      export MYVAR="-O3 -pipe"
      export MYVAR+=" -Wno-baz"
      echo "MYVAR: $MYVAR"

  - name: "Export append to unset variable"
    stdin: |
      export MYVAR+="first"
      echo "MYVAR: $MYVAR"

  - name: "export -a marks indexed array and exports (with array element assignment)"
    stdin: |
      export -a arr
      arr[0]=hello
      arr[1]=world
      declare -p arr

  - name: "export -a with scalar assignment auto-promotes to array"
    stdin: |
      export -a arr=hello
      declare -p arr

  - name: "export -a with array literal assignment"
    stdin: |
      export -a arr=(a b c)
      declare -p arr

  - name: "export -a converts an existing scalar to an indexed array"
    stdin: |
      foo=hello
      export -a foo
      foo[1]=world
      declare -p foo

  - name: "export -an together unmarks export on an existing array, without creating a new var"
    stdin: |
      export -a arr=(x y z)
      export -an arr
      declare -p arr

  - name: "export -an on a name that doesn't exist is a no-op (does not create an unset array)"
    ignore_stderr: true # Different error messages (bash prefixes "bash: line N:", brush doesn't)
    stdin: |
      export -an brand_new_name
      declare -p brand_new_name

  - name: "export -a foo+=bar appends onto an indexed array, honoring -a"
    stdin: |
      declare -a arr=(one)
      export -a arr+=two
      declare -p arr

  - name: "export -a chpwd_functions (mise activate bash's real-world trigger, issue #1132)"
    stdin: |
      export -a chpwd_functions
      chpwd_functions+=(__zsh_like_cd)
      chpwd_functions+=(__another_hook)
      declare -p chpwd_functions
