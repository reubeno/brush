name: "Builtins: readonly"
cases:
  - name: "making var readonly"
    stdin: |
      my_var="value"
      readonly my_var

      echo "Invoking declare -p..."
      declare -p my_var

  - name: "using readonly with value"
    stdin: |
      readonly my_var="my_value"

      echo "Invoking declare -p..."
      declare -p my_var

  - name: "readonly array after append"
    stdin: |
      ARR=()
      f() {
          ARR+=("a" "b")
          readonly ARR
          echo "${#ARR[@]}"
      }
      f

  - name: "Multiple readonly operands expand before assignments are applied"
    stdin: |
      unset first second
      readonly first=one second=$first
      declare -p first second

  - name: "readonly on nameref makes nameref readonly"
    known_failure: true
    ignore_stderr: true
    stdin: |
      target="value"
      declare -n ref=target
      readonly ref
      declare -p ref
      declare -p target
      # Changing what ref points to should fail
      declare -n ref=other 2>/dev/null
      echo "exit: $?"
      # But target should still be writable
      target="new_value"
      echo "target: $target"

  - name: "readonly target through nameref assignment"
    known_failure: true
    ignore_stderr: true
    stdin: |
      target="value"
      readonly target
      declare -n ref=target
      ref="new_value" 2>/dev/null
      echo "exit: $?"
      echo "target: $target"

  - name: "readonly -f marks a function readonly rather than displaying it"
    # brush routes `readonly -f` through the same display path as `declare -f`, so it prints the
    # function's definition and never makes it readonly. A shell prints nothing, rejects a later
    # redefinition, and reports a missing name as "readonly: NAME: not a function".
    known_failure: true
    ignore_stderr: true
    stdin: |
      g() { echo original; }
      readonly -f g
      echo "status: $?"
      g() { echo redefined; }
      g
      readonly -f nosuchfn

  #
  # Readonly is enforced for assignments that target a single array element, not just for
  # assignments that replace a whole variable.
  #
  - name: "readonly blocks a plain subscripted assignment"
    ignore_stderr: true
    stdin: |
      arr=(one)
      readonly arr
      arr[0]=mutated
      echo "status: $?"
      declare -p arr

  - name: "readonly blocks a subscripted assignment through declare"
    ignore_stderr: true
    stdin: |
      declare -ar arr=(one)
      declare 'arr[0]=mutated'
      echo "status: $?"
      declare -p arr

  - name: "readonly blocks appending to an array element"
    ignore_stderr: true
    stdin: |
      declare -A map=([k]=one)
      readonly map
      map[k]+=two
      echo "status: $?"
      declare -p map

  - name: "readonly blocks adding a new array element"
    ignore_stderr: true
    stdin: |
      arr=(one)
      readonly arr
      arr[5]=added
      echo "status: $?"
      declare -p arr

  #
  # Readonly enforcement reached through paths other than a plain assignment. The element guard
  # lives in the one place all of these converge, so these cases keep the other callers honest.
  #
  - name: "readonly blocks an assignment expansion on an array element"
    ignore_stderr: true
    stdin: |
      declare -a c=(one)
      readonly c
      echo "${c[1]:=default}"
      declare -p c

  - name: "readonly blocks an assignment expansion on a scalar"
    ignore_stderr: true
    stdin: |
      declare u
      readonly u
      echo "${u:=default}"
      echo "after"

  - name: "readonly blocks an arithmetic assignment to an array element"
    ignore_stderr: true
    stdin: |
      a=(one)
      readonly a
      (( a[0] = 99 ))
      echo "status: $?"
      declare -p a

  - name: "readonly blocks an arithmetic assignment to a scalar"
    ignore_stderr: true
    stdin: |
      s=1
      readonly s
      (( s = 5 ))
      echo "status: $?"
      declare -p s

  - name: "readonly blocks mapfile from replacing an array"
    ignore_stderr: true
    stdin: |
      m=(one)
      readonly m
      printf 'x\ny\n' | mapfile -t m
      echo "status: $?"
      declare -p m
