name: "Builtins: shift"
cases:
  - name: "shift past the end fails with status 1"
    ignore_stderr: true
    stdin: |
      set -- a
      shift 2
      echo "shift: $?"

  - name: "A non-numeric shift count is misuse, in bash's words"
    min_oracle_version: "5.3" # bash 5.2 fails with 1
    stdin: |
      strip() { sed -E 's/\x1b\[[0-9;]*m//g; s/^[^ ]*: line [0-9]+: //; s/^error: //'; }
      set -- a b
      shift x 2>err.txt
      echo "shift x: $?"
      strip <err.txt
      rm err.txt
