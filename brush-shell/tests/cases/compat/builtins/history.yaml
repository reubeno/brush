name: "Builtins: history"
cases:
  - name: "basic history saving"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo something
      echo else

  - name: "existing history file"
    pty: true
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
    ignore_stdout: true # Prompts and other don't quite line up
    stdin: |
      #expect-prompt
      history >history-output.txt
      #send:Enter
      #expect-prompt
      #send:Ctrl+D

  - name: "existing history file with timestamps"
    pty: true
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          #1750000000
          a b c
          #1750000001
          1 2 3
    ignore_stdout: true # Prompts and other don't quite line up
    stdin: |
      #expect-prompt
      history >history-output.txt
      #send:Enter
      #expect-prompt
      #send:Ctrl+D

  - name: "existing history file with timestamps and HISTTIMEFORMAT"
    pty: true
    env:
      HISTFILE: "history-file.txt"
      HISTTIMEFORMAT: "%C "
    test_files:
      - path: "history-file.txt"
        contents: |
          #1750000000
          a b c
          #1750000001
          1 2 3
    ignore_stdout: true # Prompts and other don't quite line up
    stdin: |
      #expect-prompt
      #send:Ctrl+D

  - name: "history N"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      : cmd2
      history 2

  - name: "history with duplicates"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      : cmd1
      : cmd1
      : cmd2
      : cmd1
      history

  - name: "history -c"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      history -c
      history

  - name: "history -d"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      history -d 1
      history

  - name: "history -d: negative offset"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      : cmd2
      history -d -2
      history

  - name: "history -a"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo "[histfile]"
      cat $HISTFILE

      history -a

      echo "[histfile after -a]"
      cat $HISTFILE

      history -a

      echo "[histfile after second -a]"
      cat $HISTFILE

  - name: "history -w"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo "[histfile]"
      cat $HISTFILE

      history -w

      echo "[histfile after -w]"
      cat $HISTFILE

      history -w

      echo "[histfile after second -w]"
      cat $HISTFILE

  - name: "history -w with explicit file"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      history -w some-file.txt

  - name: "history -s"
    known_failure: true # NOTE: bash excludes the history command itself from history
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s a b c
      history

  - name: "HISTCMD"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : cmd1
      echo $HISTCMD
      : cmd2
      echo $HISTCMD
      : cmd3
      echo $HISTCMD

  - name: "HISTTIMEFORMAT"
    known_failure: true # TODO(history): needs triage
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
      HISTTIMEFORMAT: "century=%C "
    stdin: |
      : cmd1
      : cmd2
      history

  - name: "history file with unreadable lines"
    ignore_stderr: true # Ignore brush's warnings about unreadable lines
    stdin: |
      bash -c 'printf "\xff\xfe\xfd" >history-file.txt'
      HISTFILE=history-file.txt $0 -o history -c 'echo hi'

  # NOTE: These cases run interactively with the harness's --norc removed so that ~/.bashrc is
  # honored. The system rc file also runs on some distros and may set HISTTIMEFORMAT, so each
  # .bashrc unsets it.
  - name: "HISTFILE loaded from environment"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
    stdin: |
      history

  - name: "HISTFILE changed by .bashrc"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: "other-history-file.txt"
        contents: |
          x y z
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
          HISTFILE=other-history-file.txt
    stdin: |
      history

  - name: "HISTFILE emptied by .bashrc"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
          HISTFILE=
    stdin: |
      history

  - name: "empty HISTFILE in environment"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: ""
    test_files:
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
    stdin: |
      history

  - name: "history -w with empty HISTFILE"
    min_oracle_version: "5.3" # bash 5.2 fails with status 1; 5.3 warns but succeeds
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: ""
    stdin: |
      history -w; echo "status: $?"

  - name: "history -s in .bashrc suppresses loading HISTFILE"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
          history -s marker
    stdin: |
      history

  - name: "history -s then -c in .bashrc still loads HISTFILE"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
          history -s marker
          history -c
    stdin: |
      history

  - name: "history -s then -d in .bashrc still loads HISTFILE"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
          history -s marker
          history -d 1
    stdin: |
      history

  - name: "loaded history entries without timestamps are stamped with load time"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTTIMEFORMAT: "[stamped] "
    test_files:
      - path: "history-file.txt"
        contents: |
          a b c
          1 2 3
    stdin: |
      history
      # Unset HISTFILE before exit so no wall-clock timestamp gets written to the file.
      unset HISTFILE

  # Numbering: an entry's number is its position, so removing one renumbers those after
  # it, and new entries are numbered after what's left.
  - name: "history -d from the middle renumbers later entries"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      : c
      history -d 2
      : d
      history

  - name: "history -d of the last entry"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      history -d -1
      history

  - name: "history -d repeatedly"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      : c
      : d
      history -d 1
      history -d 1
      history -d 2
      history

  - name: "history -d range"
    known_failure: true # brush's history -d takes only a single offset
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      : c
      : d
      history -d 2-3
      history

  - name: "history numbering after history -c"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      history -c
      : c
      : d
      history

  - name: "HISTCMD after history -d"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      : c
      history -d 1
      echo $HISTCMD
      : d
      echo $HISTCMD

  - name: "history -a after history -d"
    # Deletes an entry not yet appended. (See the next case for one already appended.)
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      history -a
      : b
      : c
      history -d -2
      history -a
      echo "[histfile]"
      cat $HISTFILE

  - name: "history -a after history -d of an entry already appended"
    # bash counts the entries to append rather than tracking which aren't saved, so
    # deleting one already appended shifts what its next -a appends: it skips the
    # history -d, which was never saved. brush appends it. (Arguably a bash quirk.)
    known_failure: true
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      history -a
      history -d 1
      : c
      history -a
      echo "[histfile]"
      cat $HISTFILE

  - name: "history -w after history -d"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      : b
      : c
      history -d 2
      history -w
      echo "[histfile]"
      cat $HISTFILE

  - name: "history -d in history loaded from HISTFILE"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    removed_default_args: ["--norc"]
    args: ["-i"]
    home_dir: "."
    env:
      HISTFILE: "history-file.txt"
    test_files:
      - path: "history-file.txt"
        contents: |
          one
          two
          three
      - path: ".bashrc"
        contents: |
          unset HISTTIMEFORMAT
    stdin: |
      history -d 2
      : four
      history
      # Unset HISTFILE before exit so the shell doesn't write it back.
      unset HISTFILE

  # HISTCONTROL applies only to interactive shells.
  - name: "HISTCONTROL=ignoredups"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "ignoredups"
    stdin: |
      : a
      : b
      : b
      : a
      history

  - name: "HISTCONTROL=ignorespace"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "ignorespace"
    stdin: |
      : shown
       : hidden
      : shown
      history

  - name: "HISTCONTROL=ignoreboth"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "ignoreboth"
    stdin: |
      : a
       : hidden
      : a
      : b
      history

  - name: "HISTCONTROL=erasedups"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "erasedups"
    stdin: |
      : a
      : b
      : a
      : c
      : a
      history

  - name: "HISTCONTROL with unknown values in its list"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "bogus:ignoredups"
    stdin: |
      : a
      : a
      history

  # N.B. Quoted so the trailing whitespace these depend on survives editors and hooks.
  - name: "History keeps a command's surrounding whitespace"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
    stdin: ": first\n  : indented\n: trailing  \nhistory\n"

  - name: "HISTCONTROL=ignoredups tells apart lines differing in whitespace"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "ignoredups"
    stdin: ": same\n: same \n : same\nhistory\n"

  - name: "HISTCONTROL=erasedups tells apart lines differing in whitespace"
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTCONTROL: "erasedups"
    stdin: ": same\n: same \n : same\n: other\n: same\nhistory\n"

  - name: "set +o history stops recording"
    known_failure: true # brush keeps recording after `set +o history`
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      : a
      set +o history
      : hidden
      set -o history
      : b
      history

  - name: "HISTIGNORE"
    known_failure: true # brush doesn't implement HISTIGNORE
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
      HISTIGNORE: "ls*:&:echo skip"
    stdin: |
      : a
      ls >/dev/null
      : a
      echo skip
      : b
      history

  - name: "cmdhist saves a multi-line command as one line"
    known_failure: true # brush saves the command's newlines as typed
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      for x in 1; do
        : inside
      done
      history

  - name: "History expansion"
    known_failure: true # brush doesn't implement history expansion
    ignore_stderr: true # Ignore job control warnings from interactive shell without a tty
    args: ["-i"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      !!
      history

  - name: "history rejects an unknown option with status 2"
    ignore_stderr: true
    stdin: |
      history -z
      echo "history -z: $?"

  - name: "history --help fails with status 2"
    stdin: |
      history --help >/dev/null 2>&1
      echo "history --help: $?"

  - name: "history rejects an unknown long option with status 2"
    ignore_stderr: true
    stdin: |
      history --bogus
      echo "history --bogus: $?"

  - name: "history -s takes words that look like options after --"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s -- -x y; history | tail -n 1 | sed 's/^ *[0-9]* *//'
      unset HISTFILE # brush also saves the history -s line

  - name: "history -s keeps a -- after its first word"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s a -- b; history | tail -n 1 | sed 's/^ *[0-9]* *//'
      unset HISTFILE # brush also saves the history -s line

  - name: "history -s rejects an unknown option with status 2"
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s -x
      echo "history -s -x: $?"

  - name: "history -d takes an attached negative offset"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -d-1
      echo "history -d-1: $?"

  - name: "history -w takes its file name after --"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -w -- written.txt
      unset HISTFILE

  - name: "history -w takes its file name after other options"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -w -c written.txt
      unset HISTFILE

  - name: "history -w in a bundle takes the next word as its file name"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -wc written.txt
      unset HISTFILE

  - name: "history -w rejects an attached file name"
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -wwritten.txt
      echo "history -wwritten.txt: $?"
      unset HISTFILE

  - name: "history rejects more than one of -anrw with status 1"
    known_failure: true # brush reports the conflict as a usage error, with status 2
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -a -w
      echo "history -a -w: $?"
      history -aw
      echo "history -aw: $?"
      unset HISTFILE

  - name: "history -s with -p stores its arguments"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -sp a b; echo "history -sp: $?"; history | tail -n 1 | sed 's/^ *[0-9]* *//'
      history -ps c d; echo "history -ps: $?"; history | tail -n 1 | sed 's/^ *[0-9]* *//'
      unset HISTFILE # brush also saves the history -s lines

  - name: "history -s stops reading options at its first argument"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s a -x; history | tail -n 1 | sed 's/^ *[0-9]* *//'
      unset HISTFILE # brush also saves the history -s line

  - name: "history -s rejects a negative number as an option"
    known_failure: true # TODO(history): brush stores -1 as the entry
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -s -1; echo "history -s -1: $?"
      unset HISTFILE

  - name: "history -d -- -1 is an error"
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -d -- -1; echo "history -d -- -1: $?"
      history
      unset HISTFILE

  - name: "history -d requires an offset"
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -d; echo "history -d: $?"
      unset HISTFILE

  - name: "history -d rejects a non-numeric offset with status 1"
    known_failure: true # TODO(history): brush reports a usage error, with status 2
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -d abc; echo "history -d abc: $?"
      unset HISTFILE

  - name: "history takes its count after --"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -- 1
      unset HISTFILE

  - name: "history rejects a negative or non-numeric count with status 2"
    known_failure: true # TODO(history): brush fails with status 1
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history -1; echo "history -1: $?"
      history abc; echo "history abc: $?"
      unset HISTFILE

  - name: "history rejects more than one count"
    known_failure: true # TODO(history): brush uses the first and ignores the rest
    args: ["-o", "history"]
    ignore_stderr: true
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      history 1 2; echo "history 1 2: $?"
      unset HISTFILE

  - name: "history -w ignores arguments after its file name"
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -w written.txt -c
      history | wc -l
      unset HISTFILE

  - name: "history -c with -s only clears the history"
    known_failure: true # TODO(history): brush clears, then also stores the entry
    args: ["-o", "history"]
    env:
      HISTFILE: "history-file.txt"
    stdin: |
      echo one
      history -c -s z
      history
      unset HISTFILE
