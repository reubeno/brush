name: "Builtins: complete"
cases:
  - name: "complete with no options"
    stdin: |
      complete -W foo mycmd
      complete

  - name: "complete -p with no such completion spec fails"
    stdin: |
      strip() { sed 's/^.*complete:/complete:/'; }

      complete -p mycmd 2>err; echo "rc=$?"; strip <err
      for flag in -D -E -I; do
        complete -p $flag 2>err; echo "rc=$?"; strip <err
      done
      rm err

  - name: "complete -p lists every spec, including -D, -E, and -I"
    stdin: |
      complete -W b bcmd
      complete -D -W x
      complete -E -F f
      complete -I -o nospace -W y
      complete -W a acmd
      # Check which specs are listed, not how: bash lists them in its hash table's order.
      names() { grep -oE -- ' -[DEI]( |$)|[ab]cmd$' | tr -d ' ' | sort; }
      complete -p | names
      echo ---
      complete | names
      echo ---
      for name in -D -E -I _DefaultCmD_; do
        complete -p $name | grep -oE -- "-W 'x'|-F f|-W 'y'"
      done

  - name: "Roundtrip: complete -W"
    stdin: |
      complete -W foo mycmd
      complete -p mycmd

      complete -W 'foo bar' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -P"
    stdin: |
      complete -P myprefix mycmd
      complete -p mycmd

      complete -P 'my prefix' mycmd
      complete -p mycmd

  - name: "compopt +o wins over -o for the same option"
    stdin: |
      complete -W x cmd
      compopt -o nospace +o nospace cmd
      complete -p cmd
      compopt +o nospace -o nospace cmd
      complete -p cmd
      compopt -o nospace +o filenames -o filenames cmd
      complete -p cmd

  - name: "Roundtrip: complete -S"
    stdin: |
      complete -S mysuffix mycmd
      complete -p mycmd

      complete -S 'my suffix' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -F"
    stdin: |
      complete -Fmyfunc mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -F"
    stdin: |
      complete -G pattern mycmd
      complete -p mycmd

      complete -G 'pat tern' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -X"
    stdin: |
      complete -X pattern mycmd
      complete -p mycmd

      complete -X 'pat tern' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -C"
    stdin: |
      complete -C cmd mycmd
      complete -p mycmd

      complete -C 'c md' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -A"
    stdin: |
      for action in alias arrayvar binding builtin command directory disabled enabled export file 'function' group helptopic hostname job keyword running service setopt shopt signal stopped user variable; do
        complete -A ${action} mycmd
        complete -p mycmd
      done

  - name: "Roundtrip: complete -o options"
    stdin: |
      for opt in bashdefault default dirnames filenames noquote nosort nospace plusdirs; do
        echo "--- Testing option: ${opt} ------------------"
        complete -o ${opt} mycmd_${opt}
        complete -p mycmd_${opt}
      done

  - name: "compopt +o disables an option"
    stdin: |
      complete -o nospace -o filenames -W x mycmd
      compopt +o nospace mycmd; echo "rc=$?"
      complete -p

  - name: "compopt takes command names starting with + or - after --"
    stdin: |
      complete -W x -- +cmd -cmd
      compopt -o nospace -- +cmd -cmd; echo "rc=$?"
      complete -p -- +cmd -cmd

  - name: "complete -r"
    stdin: |
      echo "[Removing non-existent]"
      complete -r nonexistent
      echo $?

      echo "[Removing existing]"
      complete -W token mycmd
      complete -r mycmd
      echo $?
      complete -p mycmd 2>/dev/null

  - name: "compopt with a name that has no completion spec fails"
    stdin: |
      strip() { sed -E 's/^.*compopt:/compopt:/'; }

      complete -W x a
      compopt -o nospace b a 2>err; echo "rc=$?"; strip <err
      complete -p a
      complete -p b >/dev/null 2>&1; echo "b has a spec: rc=$?"
      rm err

  - name: "compopt -D, -E, or -I with no such completion spec fails"
    stdin: |
      strip() { sed -E 's/^.*compopt:/compopt:/'; }

      for flag in -D -E -I; do
        compopt $flag -o nospace 2>err; echo "rc=$?"; strip <err
      done
      rm err

  - name: "compopt -D, -E, or -I updates an existing completion spec"
    stdin: |
      for flag in -D -E -I; do
        complete $flag -W x
        compopt $flag -o nospace; echo "rc=$?"
        complete -p $flag | grep -o -- '-o nospace'
      done

  - name: "complete -r with no args"
    stdin: |
      complete -W token mycmd1
      complete -W token mycmd2

      complete -r
      echo $?

      complete -p

  - name: "complete -r with special options"
    stdin: |
      complete -W token mycmd
      complete -W other -E

      complete -r -E
      echo $?

      complete -p

  - name: "complete -p prints options, actions, and arguments in bash's order"
    stdin: |
      complete -v -o nospace -A function -a -o default -F fn -G '*.c' -W 'w1 w2' -X '*.x' -P pre -S suf -C cmd mycmd
      complete -p mycmd
      complete -A signal -A arrayvar -b -a -A builtin other
      complete -p other
      complete -X '*.y' -W x 'a b'
      complete -p 'a b'

  - name: "complete -p output round-trips"
    stdin: |
      complete -o filenames -A function -X '*.x' -P pre -W 'w1 w2' mycmd
      complete -D -X '*.y' -F fn
      before=$(complete -p mycmd; complete -p -D)
      complete -r
      eval "$before"
      after=$(complete -p mycmd; complete -p -D)
      echo "$after"
      [[ $before == "$after" ]] && echo "round-tripped"

  - name: "complete -p quotes names like bash, so its output round-trips"
    stdin: |
      complete -F '#fn' -W x '~'
      complete -F a,b cmd1
      complete -F fn 'a,b'
      before=$(complete -p '~' cmd1 'a,b')
      echo "$before"
      complete -r
      eval "$before"
      after=$(complete -p '~' cmd1 'a,b')
      [[ $before == "$after" ]] && echo "round-tripped"

  - name: "complete actions are generated once each, in bash's order"
    stdin: |
      alias zzqa=1
      zzqf() { :; }
      compgen -A function -A alias zzq
      echo ---
      compgen -A alias -A alias zzq
      echo ---
      complete -o nosort -A function -A alias -A function mycmd
      complete -p mycmd

  - name: "compgen -W preserves duplicates"
    stdin: |
      compgen -W "a b a c b"

  - name: "compgen -W preserves order"
    stdin: |
      compgen -W "z y x a"

  - name: "complete -p shows a -X pattern with a leading ! as given"
    stdin: |
      complete -f -X '!*.txt' mycmd
      complete -p mycmd
