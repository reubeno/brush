name: "Builtins: complete"
cases:
  - name: "complete with no options"
    stdin: |
      complete -W foo mycmd
      complete

  - name: "Roundtrip: complete -W"
    stdin: |
      complete -W foo mycmd
      complete -p mycmd

      complete -W 'foo bar' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -P"
    stdin: |
      complete -P myprefix mycmd
      complete -p mycmd

      complete -P 'my prefix' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -S"
    stdin: |
      complete -S mysuffix mycmd
      complete -p mycmd

      complete -S 'my suffix' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -F"
    stdin: |
      complete -Fmyfunc mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -F"
    stdin: |
      complete -G pattern mycmd
      complete -p mycmd

      complete -G 'pat tern' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -X"
    stdin: |
      complete -X pattern mycmd
      complete -p mycmd

      complete -X 'pat tern' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -C"
    stdin: |
      complete -C cmd mycmd
      complete -p mycmd

      complete -C 'c md' mycmd
      complete -p mycmd

  - name: "Roundtrip: complete -A"
    stdin: |
      for action in alias arrayvar binding builtin command directory disabled enabled export file 'function' group helptopic hostname job keyword running service setopt shopt signal stopped user variable; do
        complete -A ${action} mycmd
        complete -p mycmd
      done

  - name: "Roundtrip: complete -o options"
    stdin: |
      for opt in bashdefault default dirnames filenames noquote nosort nospace plusdirs; do
        echo "--- Testing option: ${opt} ------------------"
        complete -o ${opt} mycmd_${opt}
        complete -p mycmd_${opt}
      done

  - name: "compopt +o disables an option"
    stdin: |
      complete -o nospace -o filenames -W x mycmd
      compopt +o nospace mycmd; echo "rc=$?"
      complete -p

  - name: "compopt takes command names starting with + or - after --"
    stdin: |
      complete -W x -- +cmd -cmd
      compopt -o nospace -- +cmd -cmd; echo "rc=$?"
      complete -p -- +cmd -cmd

  - name: "complete -r"
    stdin: |
      echo "[Removing non-existent]"
      complete -r nonexistent
      echo $?

      echo "[Removing existing]"
      complete -W token mycmd
      complete -r mycmd
      echo $?
      complete -p mycmd 2>/dev/null

  - name: "compopt with a name that has no completion spec fails"
    stdin: |
      strip() { sed -E 's/^.*compopt:/compopt:/'; }

      complete -W x a
      compopt -o nospace b a 2>err; echo "rc=$?"; strip <err
      complete -p a
      complete -p b >/dev/null 2>&1; echo "b has a spec: rc=$?"
      rm err

  - name: "compopt -D, -E, or -I with no such completion spec fails"
    stdin: |
      strip() { sed -E 's/^.*compopt:/compopt:/'; }

      for flag in -D -E -I; do
        compopt $flag -o nospace 2>err; echo "rc=$?"; strip <err
      done
      rm err

  - name: "compopt -D, -E, or -I updates an existing completion spec"
    stdin: |
      for flag in -D -E -I; do
        complete $flag -W x
        compopt $flag -o nospace; echo "rc=$?"
        complete -p $flag | grep -o -- '-o nospace'
      done

  - name: "complete -r with no args"
    stdin: |
      complete -W token mycmd1
      complete -W token mycmd2

      complete -r
      echo $?

      complete -p

  - name: "complete -r with special options"
    stdin: |
      complete -W token mycmd
      complete -W other -E

      complete -r -E
      echo $?

      complete -p

  - name: "compgen -W preserves duplicates"
    stdin: |
      compgen -W "a b a c b"

  - name: "compgen -W preserves order"
    stdin: |
      compgen -W "z y x a"

  - name: "complete -p shows a -X pattern with a leading ! as given"
    stdin: |
      complete -f -X '!*.txt' mycmd
      complete -p mycmd
