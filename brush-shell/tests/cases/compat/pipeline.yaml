name: "Pipeline"
cases:
  - name: "Basic pipe"
    stdin: |
      echo hi | grep -l h

  - name: "Longer pipe"
    stdin: |
      echo hi | grep h | wc -l

  - name: "Invert result"
    stdin: |
      ! false
      echo "! false: $?"
      ! true
      echo "! true: $?"

  - name: "Standalone negation (no command)"
    stdin: |
      !
      echo "After !: $?"
      ! !
      echo "After ! !: $?"

  - name: "Exit codes for piped commands"
    test_files:
      - path: "script.sh"
        executable: true
        contents: |
          #!/bin/sh
          (cat; echo -n "-> $1")
          exit $1
    stdin: |
      ./script.sh 10 | ./script.sh 0 | ./script.sh 33

  - name: "Side effects in pipe commands"
    stdin: |
      var=0
      echo "var: ${var}"
      { var=1; }
      echo "var: ${var}"
      { var=2; echo hi; } | cat
      echo "var: ${var}"
      echo hi | { var=3; cat; }
      echo "var: ${var}"

  - name: "pipeline extension"
    stdin: |
      echo -e "hello" |& wc -l
      cat dfdfgdfgdf |& wc -l
      foo() { cat dfgdfg; } |& wc -l

  - name: "Possible broken pipe case"
    stdin: |
      echo hello | var=value

  - name: "printf broken pipe returns 141 in PIPESTATUS"
    stdin: |
      printf '%s\n' {0..10000} | x=1

  - name: "Function stage writing more than a pipe buffer before the next stage is spawned"
    # Regression test: a shell function used as a non-last pipeline stage
    # must run concurrently with the rest of the pipeline, not be awaited
    # to completion before the next stage is even spawned. Otherwise, once
    # the function writes more to its stdout pipe than the OS pipe buffer
    # holds (commonly 64KiB on Linux) before returning, the write blocks
    # forever because nothing is reading the other end yet.
    stdin: |
      big() {
        local i
        for i in $(seq 1 5000); do
          echo "padding line number ${i} to exceed the pipe buffer size"
        done
      }
      big | wc -l
      echo "Last: $?, PIPESTATUS: ${PIPESTATUS[*]}"

  - name: "Builtin that fails in a pipeline stage"
    known_failure: true # TODO(pipeline): the builtin's error escapes its stage: it's shown on the shell's stderr despite the stage's redirects, and the pipeline's status is 1 rather than its last stage's
    stdin: |
      cd /nonexistent 2>/dev/null | true
      echo "status: $?"
      cd /nonexistent 2>&1 | { read -r line; echo "got an error message: ${line:+yes}"; }

  - name: "Exit in a pipeline's last stage"
    known_failure: true # TODO(pipeline): with lastpipe off the last stage runs in a subshell, but its exit ends the shell itself
    stdin: |
      echo hi | exit 3
      echo "status: $?"

  - name: "Break and return in a pipeline's last stage"
    known_failure: true # TODO(pipeline): with lastpipe off the last stage runs in a subshell, but its break and return leave the enclosing loop and function
    stdin: |
      for i in 1 2; do
        echo "$i" | break
        echo "i=$i"
      done

      f() {
        echo hi | return 5
        echo "after return"
      }
      f
      echo "f: $?"

  - name: "Compound command writing more than a pipe holds"
    known_failure: true # TODO(pipeline): a compound stage runs to completion before the next stage starts, so it blocks for good once the pipe fills
    timeout_in_seconds: 3
    stdin: |
      for ((i = 0; i < 10000; i++)); do echo "line $i"; done | wc -l

  - name: "Endless producer into head"
    known_failure: true # TODO(pipeline): the producer runs to completion before head starts, so it never stops
    timeout_in_seconds: 3
    stdin: |
      while true; do echo y; done | head -n 1
