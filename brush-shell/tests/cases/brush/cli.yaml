name: "CLI tests"
cases:
  - name: "Basic echo"
    stdin: "echo hello world"
    expected_exit_code: 0
    expected_stdout: "hello world\n"

  - name: "Exit code propagates"
    stdin: "exit 42"
    expected_exit_code: 42

  - name: "Exit code propagates from an interactive session"
    incompatible_platforms: ["windows"] # (No pty to run it in)
    pty: true
    stdin: |
      #expect-prompt
      exit 42
      #send:Enter
    expected_exit_code: 42

  - name: "Echo via args"
    args:
      - "-c"
      - "echo from args"
    expected_exit_code: 0
    expected_stdout: "from args\n"

  - name: "Version flag succeeds"
    args:
      - "--version"
    expected_exit_code: 0
    # Note: can't easily check stdout content as it varies

  - name: "Version goes to stdout and names the shell"
    stdin: |
      version=$("$BASH" --version 2>/dev/null)
      echo "${version%% *}"
    expected_exit_code: 0
    expected_stdout: "brush\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion script callback answers from the CLI spec"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush --input-backend r'
    expected_exit_code: 0
    expected_stdout: "reedline\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback completes a flag value after other flags"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush --norc --input-backend r'
    expected_exit_code: 0
    expected_stdout: "reedline\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback completes an attached flag value"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush --input-backend=r'
    expected_exit_code: 0
    expected_stdout: "--input-backend=reedline\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback completes a long flag name"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush --nor'
    expected_exit_code: 0
    expected_stdout: "--norc\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  # Flags stop at the script or `-c` command, so a later flag-like word is an
  # argument: the callback answers `\x01files`, its request for file names.
  - name: "Completion callback offers files, not flag values, after a script"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush script.sh --input-backend r'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback offers files, not attached flag values, after a script"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush script.sh --input-backend=r'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback offers files, not flag names, after a script"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush script.sh --nor'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback offers files, not flag values, after a -c command"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush -c "echo hi" --input-backend r'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback offers files, not flag names, after a -c command"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush -c "echo hi" --nor'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Completion callback offers files, not flag names, after --"
    stdin: |
      "$BASH" __complete_word__ --shell bash --line 'brush -- --nor'
    expected_exit_code: 0
    expected_stdout: "\x01files\n"
    # Runs brush as a child process, which WASI 0.2 cannot do.
    incompatible_platforms: ["wasi"]

  - name: "Help flag succeeds"
    args:
      - "--help"
    expected_exit_code: 0

  - name: "Invalid option fails"
    args:
      - "--unknown-argument-here"
    expected_exit_code: 2
    # Exit code 2 for argument parsing errors.

  - name: "Explicit config file not found fails"
    removed_default_args:
      - "--no-config"
    args:
      - "--config"
      - "/nonexistent/path/to/config.toml"
      - "-c"
      - "echo should_not_run"
    expected_exit_code: 1

  - name: "Explicit config file valid"
    removed_default_args:
      - "--no-config"
    test_files:
      - path: "config.toml"
        contents: |
          [ui]
          syntax-highlighting = false

          [experimental]
          zsh-hooks = false
    args:
      - "--config"
      - "config.toml"
      - "-c"
      - "echo config_loaded"
    expected_exit_code: 0
    expected_stdout: "config_loaded\n"

  - name: "Config file with unknown fields succeeds"
    removed_default_args:
      - "--no-config"
    test_files:
      - path: "config.toml"
        contents: |
          [ui]
          syntax-highlighting = true
          future-setting = "ignored"

          [unknown-section]
          foo = "bar"
    args:
      - "--config"
      - "config.toml"
      - "-c"
      - "echo forward_compat"
    expected_exit_code: 0
    expected_stdout: "forward_compat\n"
