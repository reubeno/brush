#
# This workflow was based on https://docs.zizmor.sh/integrations/
#

name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

# N.B. This is the *online* zizmor pass: it runs the audits that need network
# access and uploads SARIF to code scanning for stateful triage in the Security
# tab, and it deliberately does not fail the build.
#
# The complementary offline pass -- which does fail, and fails fast -- is the
# `zizmor` hook in .pre-commit-config.yaml, run in CI by hooks.yaml and locally
# by `cargo xtask check hooks workflows`. The two are not redundant; do not
# collapse them without checking which audits each one actually runs.

# Only allow one run of the workflow per branch / PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor latest via zizmor-action
    runs-on: ubuntu-latest
    permissions:
      security-events: write # needed for SARIF uploads
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reporting pass: uploads SARIF to code scanning, giving us stateful
      # analysis and incremental triage in the Security tab. Does not fail
      # with non-zero result but reports them.
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
