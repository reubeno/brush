[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
targets = []
#exclude = []
all-features = false
no-default-features = false
#features = []

[output]
feature-depth = 1

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
yanked = "deny"
#db-path = "$CARGO_HOME/advisory-dbs"
#db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # arrayref 0.3.9 is the last known-good release, and we pin to it deliberately.
    #
    # On 2026-08-20 every published arrayref version (0.3.5 through 0.3.9) was
    # yanked and a 0.3.10 was published in their place. That 0.3.10 has a
    # byte-identical src/lib.rs to 0.3.9 and differs only by an injected,
    # never-referenced dependency on `proc-macro1` (a typosquat of proc-macro2)
    # that crates.io has since removed. The same day, the same owner account
    # published internment 0.8.7 with the identical injected dependency, so this
    # looks like an account compromise rather than a maintainer decision.
    #
    # We reach arrayref only transitively via uucore -> blake2b_simd. Our lockfile
    # pins 0.3.9, whose checksum matches the genuine registry checksum.
    #
    # Do NOT "fix" this by running `cargo update -p arrayref` as the diagnostic
    # suggests -- that resolves to the poisoned 0.3.10. Remove this entry once a
    # clean arrayref is published upstream and blake2b_simd can reach it.
    { crate = "arrayref@0.3.9", reason = "last known-good version; 0.3.5-0.3.9 yanked during apparent 2026-08-20 account compromise, 0.3.10 injects a removed `proc-macro1` dep" },
]
#git-fetch-with-cli = true

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "WTFPL",
    "Zlib",
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8
# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = []

[licenses.private]
ignore = false
registries = []

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# List of crates that are allowed. Use with care!
allow = []
# List of crates to deny
deny = []

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# 1 or more github.com organizations to allow git sources for
github = []
